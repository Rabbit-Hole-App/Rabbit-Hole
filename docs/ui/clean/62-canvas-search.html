    .checkbox > input[type="checkbox"] { appearance:none; position:relative; flex:none; width:16px; height:16px; border:1px solid var(--control-hover-border); border-radius:4px; background:var(--control-bg); cursor:pointer; }
    .checkbox > input:hover:enabled { background:var(--panel); border-color:var(--muted); }
    .checkbox > input:active:enabled { background:var(--control-active-bg); border-color:var(--control-selected-border); }
    .checkbox > input:is(:checked,:indeterminate) { background:var(--primary); border-color:var(--primary); }

    .checkbox > input:checked::before { content:""; position:absolute; left:50%; top:50%; width:8px; height:5px; border-left:2px solid var(--control-bg); border-bottom:2px solid var(--control-bg); transform:translate(-50%,-64%) rotate(-45deg); }

    @media (max-width:740px) { main { padding:18px 12px 33px; } .specimens { grid-template-columns:1fr; } .specimen,.reference-panel { padding:10px; } }

.library-chip{display:inline-flex;align-items:center;gap:6px}

.library-chip .icon{width:12px;height:12px}
.library-folders{margin-bottom:32px}
.library-folders .home-section-title{font-size:15px;color:var(--ink)}
#folder-total{font-weight:400;color:var(--muted)}

.library-menu{position:fixed;z-index:50;width:240px;max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);overflow:auto}
.library-menu .menu-label{flex:1}
.library-menu .icon{width:16px;height:16px;stroke-width:1.5}
.library-menu [aria-checked]>.icon:last-child{visibility:hidden}
.library-menu [aria-checked=true]>.icon:last-child{visibility:visible;color:var(--primary)}
.library-menu .library-menu-heading{font-size:13px;text-transform:none;letter-spacing:0;font-weight:650;padding:8px 8px 3px;margin:0;color:var(--muted)}

.library-breadcrumb{display:flex;align-items:center;gap:6px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.library-breadcrumb .link{border:0;background:none;padding:0;font-size:inherit;color:inherit;text-decoration:none}
.library-breadcrumb .link:hover{color:var(--ink)}
.library-breadcrumb .icon{width:14px;height:14px}
#library-folder-crumb{color:var(--ink);min-width:0;overflow-wrap:anywhere}
.library-group+.library-group{margin-top:28px}
.library-group-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.library-group-heading h2{font-size:15px;font-weight:650;margin:0}
.library-group-heading .button{font-size:13px}

/* The app's EmptyState sits directly on the page surface. */
.library-empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:48px 12px;font-size:15px;color:var(--muted)}
.library-empty>.icon{width:20px;height:20px;stroke-width:1.5}
.library-empty p{margin:0}
@media(max-width:700px){
  .library-header-actions{gap:8px}
  .library-filter-controls,.library-view-controls{flex-basis:100%}
  .library-view-controls{justify-content:space-between}
  .library-view-controls .home-size{margin-inline-start:auto}
  .library-chip .icon-button{min-width:32px;min-height:32px}
  .library-folder .icon-button{min-width:44px;min-height:44px}
}

/* Layout of the existing chat shell and CanvasSearchPanel. Controls use standards.css. */
.clean-stage:has(#canvas-search-panel) {
  display:flex; justify-content:flex-end; max-width:840px;
}
#canvas-search-panel {
  --card-width:510px;
  width:var(--card-width); min-width:0; max-width:100%;
  height:min(760px, calc(100dvh - 56px));
}
.canvas-search-body { position:relative; display:flex; flex-direction:column; flex:1; min-height:0; padding:12px 16px 0; }
.canvas-search-toolbar { display:flex; align-items:center; gap:4px; }
.canvas-search-field.library-search { position:relative; min-width:0; gap:0; }
.canvas-search-field > .icon { position:absolute; left:10px; width:16px; height:16px; z-index:1; }
#canvas-search-panel .canvas-search-field > .control { padding-inline-start:34px; width:100%; min-width:0; }
.canvas-search-toolbar .button { flex:none; }
.canvas-search-toolbar .icon-button { flex:none; }
.canvas-search-toolbar .canvas-filter-chevron { width:12px; height:12px; }
.canvas-previous-chevron { transform:rotate(180deg); }
#canvas-filter[aria-expanded="true"] {
  background:var(--blue-soft); color:var(--primary); border-color:var(--control-selected-border);
}
.canvas-search-meta {
  display:flex; align-items:center; justify-content:flex-end; padding:8px 0;
  color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums;
}
.canvas-search-results { min-height:0; flex:1; overflow:auto; list-style:none; padding:0 2px 14px; }
.canvas-search-results li + li { margin-top:8px; }
.canvas-search-result.menu-item {
  --button-bg:var(--card); --button-line:var(--card-border); --button-ink:var(--ink);
  --hover-bg:var(--panel); --hover-line:var(--control-hover-border);
  --press-bg:var(--hover-bg); --press-line:var(--hover-line); --press-ink:var(--hover-ink);
  align-items:flex-start; gap:10px; padding:9px 10px;
  font-weight:400;
}
.canvas-search-result.menu-item[aria-current="true"] {
  --button-bg:var(--blue-soft); --button-line:var(--control-selected-border);
  --hover-bg:var(--button-bg); --hover-line:var(--button-line);
}
.canvas-search-result.menu-item:focus-visible { outline-offset:-2px; }
.canvas-result-copy { display:flex; flex:1; flex-direction:column; gap:2px; min-width:0; }
.canvas-result-heading { display:flex; align-items:center; gap:6px; font-weight:650; font-size:14px; }
.canvas-result-heading > .icon { width:14px; height:14px; color:var(--muted); }
.canvas-result-heading > [data-result-title] { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.canvas-result-meta { color:var(--muted); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.canvas-result-snippet {
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden;
  color:var(--copy-ink); line-height:1.45; overflow-wrap:anywhere; white-space:normal;
}
.canvas-result-snippet.is-code {
  display:block; padding:3px 0; border:1px solid var(--panel-border); border-radius:6px; background:var(--panel);
  font:11px/16px ui-monospace,monospace;
}
.canvas-code-line { display:flex; align-items:baseline; white-space:pre; }
.canvas-code-line > :first-child { flex:0 0 30px; padding-right:8px; text-align:right; color:var(--muted); }
.canvas-code-line > :last-child { min-width:0; overflow:hidden; text-overflow:ellipsis; }
.canvas-search-result mark { background:var(--control-active-bg); color:var(--ink); border-radius:2px; }
.canvas-search-empty { padding:8px 2px; color:var(--muted); font-size:13px; }
.canvas-filter-menu.library-menu {
  position:absolute; top:51px; right:16px; width:290px; max-width:calc(100% - 32px);
  max-height:calc(100% - 66px); grid-template-rows:auto minmax(0,1fr) auto auto; overflow:hidden;
}
.canvas-filter-menu .canvas-filter-field { margin:4px 4px 2px; }
.canvas-filter-options { min-height:0; overflow:auto; }
.canvas-filter-options .checkbox { display:flex; cursor:pointer; }
.canvas-filter-options .checkbox:hover { background:var(--control-hover-bg); }
.canvas-filter-options .checkbox:focus-within { outline:2px solid var(--blue); outline-offset:-2px; }
.canvas-filter-options .checkbox > input:focus-visible { outline:none; }
.canvas-filter-options .checkbox:has(input:checked) > .icon { color:var(--primary); }
.canvas-filter-count { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
.canvas-filter-menu #filter-no-results { text-transform:none; letter-spacing:normal; color:var(--muted); font-weight:400; }
#canvas-search-tooltip {
  position:fixed; z-index:60; max-width:min(240px,calc(100vw - 16px)); pointer-events:none;
}
.canvas-search-resize {
  position:absolute; inset:0 auto 0 0; width:6px; z-index:5;
  cursor:col-resize; touch-action:none;
}
.canvas-search-resize:is(:hover,:focus-visible),.resizing .canvas-search-resize { background:var(--control-selected-border); }
.canvas-search-resize:focus-visible { outline-offset:-2px; }
#canvas-search-panel [aria-disabled="true"] { cursor:default; }
#canvas-search-panel [aria-disabled="true"]:hover { color:inherit; background:transparent; }
#canvas-search-panel [hidden], #canvas-search-panel[hidden], #reopen-canvas-search[hidden] { display:none!important; }
@media (max-width:600px) {
  #canvas-search-panel { height:calc(100dvh - 32px); }
  .canvas-search-resize { display:none; }
}
@media (max-width:400px) {
  .canvas-search-body { padding-inline:10px; }
  .canvas-filter-menu.library-menu { right:10px; max-width:calc(100% - 20px); }
  .canvas-search-toolbar .icon-button { width:26px; }
  .canvas-search-toolbar .button { padding-inline:7px; gap:4px; }
  .canvas-search-toolbar .canvas-filter-chevron { display:none; }
}

/* Current balance, following the owner's return to ca0affe as the color reference.
   Scope colors by purpose; never recolor the entire card or app from its pill. */
:root {
  --rh-action:#375d92; --rh-action-hover:#2b4b78; --rh-action-pressed:#203858;
  --rh-action-soft:#eaf1fb; --rh-action-line:#adc4e5;
  --rh-experiment:#b86232; --rh-experiment-ink:#934723;
  --rh-experiment-soft:#f8ece3; --rh-experiment-line:#e2ad8f;
  --rh-experiment-hover:#f5e0d2; --rh-experiment-pressed:#eac6ad;
  --rh-focus:#426db2;
  --rh-toggle-on:#267657; --rh-toggle-hover:#1d6247; --rh-toggle-pressed:#174f39;
}
/* Isolated experiment widgets and the experiment row of composed cards. */
body[data-ui-palette="experiment"] .catalog-preview,
body[data-ui-palette="balanced-card"] .card-controls {
  --blue-soft:var(--rh-experiment-soft);
  --blue-border:var(--rh-experiment-line);
  --blue-ink:var(--rh-experiment-ink);
  --blue-hover:var(--rh-experiment-hover);
  --blue-pressed:var(--rh-experiment-pressed);
  --explanation-ink:var(--rh-experiment-ink);
  --control-selected-border:var(--rh-experiment-line);
  --control-selected-hover-bg:var(--rh-experiment-hover);
  --control-active-bg:var(--rh-experiment-pressed);
}
body[data-ui-palette="experiment"] .control-row input[type="range"],
body[data-ui-palette="balanced-card"] .card-controls input[type="range"] { accent-color:var(--rh-experiment); }
body[data-ui-palette="experiment"] .control-row .value,
body[data-ui-palette="balanced-card"] .card-controls .control-row .value { color:var(--rh-experiment-ink); }
/* Owner correction: toggles are green in app settings and experiments. */
body:not([data-ui-palette="historical"]) :is(.switch input,input.switch):checked,
body:not([data-ui-palette="historical"]) .toggle input:checked + .toggle-track { background:var(--rh-toggle-on); border-color:var(--rh-toggle-on); }
body:not([data-ui-palette="historical"]) :is(.switch input,input.switch):checked:hover:enabled,
body:not([data-ui-palette="historical"]) .toggle:hover input:checked:enabled + .toggle-track { background:var(--rh-toggle-hover); border-color:var(--rh-toggle-hover); }
body:not([data-ui-palette="historical"]) :is(.switch input,input.switch):checked:active:enabled,
body:not([data-ui-palette="historical"]) .toggle:active input:checked:enabled + .toggle-track { background:var(--rh-toggle-pressed); border-color:var(--rh-toggle-pressed); }
/* Reset/Previous/Next remain neutral; experiment identity must not tint every action. */
body:is([data-ui-palette="experiment"],[data-ui-palette="balanced-card"]) .button.secondary:hover:enabled { background:#f6f8f4; border-color:#d2d9d2; color:#202723; }
body:is([data-ui-palette="experiment"],[data-ui-palette="balanced-card"]) .button.secondary:active:enabled { background:#e3e7e0; color:#202723; }
/* The focus ring remains blue even within an experiment. */
body[data-ui-palette="experiment"] :is(button,input,select,summary):focus-visible,
body[data-ui-palette="balanced-card"] .card-controls :is(button,input,select,summary):focus-visible { outline-color:var(--rh-focus); }

    { id:'document', type:'document', title:'metrics.md', text:'Definitions and conventions for the evaluation run.' },
    { id:'other', type:'other-cards', title:'Evaluation checkpoint', text:'Review the metrics before comparing models.' },
    { id:'arxiv', type:'arxiv', title:'Calibration paper on arXiv', text:'Source for the model calibration notes.' },
    { id:'wiki', type:'wikipedia', title:'Confusion matrix', text:'Wikipedia reference for the metric table.' },
    { id:'youtube', type:'youtube', title:'Bias–variance tradeoff on YouTube', text:'Video source for the evaluation walkthrough.', also:['video'] },
    { id:'web', type:'web', title:'Model evaluation guide', text:'Documentation for classifier scoring.' },
    { id:'repo', type:'repository', title:'Model evaluation repository', text:'Source files and examples for the workshop.' },
    { id:'refs', type:'references', title:'Sources for model calibration', text:'References used in the evaluation notes.' },
    { id:'links', type:'links', title:'Decision Trees', text:'Linked from this canvas.' },
    { id:'rabbit-hole', type:'rabbit-holes', title:'Why do models get overconfident?', text:'A follow-up on calibration.' }
  ];
  const panel = get('canvas-search-panel');
  const query = get('canvas-query');
  const resultsList = get('canvas-search-results');
  const matchCount = get('canvas-match-count');
  const previous = get('previous-match');
  const next = get('next-match');
  const filter = get('canvas-filter');

  let resultButtons = [];

    for (const hit of value.matchAll(new RegExp(expression, 'gi'))) {

      const mark = document.createElement('mark');

      node.append(mark);
      offset = hit.index + hit[0].length;

  }
  function showResult(row, index, expression) {
    const item = clone('canvas-search-result-template');
    const button = item.firstElementChild;
    button.dataset.searchResult = row.id;
    button.dataset.resultType = row.type;
    iconFor(item.querySelector('.canvas-result-heading .icon'), row.type);
    highlight(item.querySelector('[data-result-title]'), row.title, expression);
    item.querySelector('.canvas-result-meta').textContent = row.meta || (row.path ? typeLabel(row.type) + ' · ' + row.path + ' · Line ' + row.line : typeLabel(row.type));

    if (row.code) {
      snippet.classList.add('is-code');
      row.code.forEach((line, position) => {
        const preview = document.createElement('span');
        preview.className = 'canvas-code-line';
        const number = document.createElement('span');
        number.setAttribute('aria-hidden', 'true');
        number.textContent = row.line + position;
        const code = document.createElement('code');
        highlight(code, line || ' ', expression);
        preview.append(number, code);
        snippet.append(preview);
      });

    button.addEventListener('keydown', event => {
      const position = {ArrowUp:index-1, ArrowDown:index+1, Home:0, End:resultButtons.length-1}[event.key];

      event.preventDefault();

  }

    const expression = query.value.trim() ? pattern(query.value) : '';
    const test = expression ? new RegExp(expression, 'i') : null;
    if (!test) return { rows, expression };
    const title = [];
    const content = [];
    for (const row of rows) {
      if ([row.title, row.path].some(value => value && test.test(value))) title.push(row);
      else if ([row.text, ...(row.code || [])].some(value => test.test(value))) content.push(row);
    }

  }
  function updateCounter() {

      : matches.length + (matches.length === 1 ? ' result' : ' results');
  }
  function activate(index) {
    if (!matches.length) return;

    active = index;
    const button = resultButtons[index];
    button.setAttribute('aria-current', 'true');

    const listBounds = resultsList.getBoundingClientRect();
    if (rowBounds.top < listBounds.top || rowBounds.bottom > listBounds.bottom) button.scrollIntoView({ block:'nearest' });
    updateCounter();
  }
  function step(direction) {
    if (!matches.length) return;
    const start = active >= 0 ? active : direction > 0 ? -1 : 0;
    activate((start + direction + matches.length) % matches.length);
  }

    matches = search.rows.filter(row => !selected.size || categories(row).some(type => selected.has(type)));

    resultsList.replaceChildren(...matches.map((row, index) => showResult(row, index, search.expression)));
    resultButtons = Array.from(resultsList.querySelectorAll('button'));
    resultsList.scrollTop = 0;
    previous.disabled = next.disabled = matches.length === 0;
    get('canvas-search-empty').hidden = matches.length > 0;
    updateCounter();
  }

    const counts = new Map();
    for (const row of unfilteredMatches().rows) for (const type of categories(row)) counts.set(type, (counts.get(type) || 0) + 1);
    const groups = [];
    for (const { title, items } of searchFilterGroups) {
      const visible = items.filter(([,label]) => label.toLowerCase().includes(search));
      if (!visible.length) continue;

      group.setAttribute('aria-label', title);
      group.querySelector('p').textContent = title;
      const body = group.querySelector('[data-filter-items]');
      for (const [id, label] of visible) {
        const row = clone('canvas-filter-row-template');
        row.dataset.filterRow = id;
        iconFor(row, id);
        row.querySelector('.menu-label').textContent = label;
        row.querySelector('.canvas-filter-count').textContent = counts.get(id) || 0;
        const input = row.querySelector('input');
        input.checked = selected.has(id);
        input.addEventListener('change', () => {
          if (input.checked) selected.add(id);
          else selected.delete(id);
          syncFilter();
          renderResults();
        });
        if (id === 'references') row.title = 'Cards on this canvas that cite a source';
        if (id === 'links') row.title = 'Other canvases this one links to or from';
        body.append(row);

    }

  }
  function syncFilter() {
    get('canvas-filter-label').textContent = selected.size ? 'Filter (' + selected.size + ')' : 'Filter';
    clearFilters.disabled = selected.size === 0;
  }

      renderFilterOptions();

  filter.addEventListener('keydown', event => {
    if (event.key !== 'ArrowDown') return;
    event.preventDefault();
    if (menu.hidden) setMenu(true);
    filterQuery.focus();
  });

  clearFilters.addEventListener('click', () => {
    selected.clear();
    syncFilter();
    renderFilterOptions();
    renderResults();
    filterQuery.focus();
  });

    if (!['ArrowUp','ArrowDown','Home','End'].includes(event.key)) return;
    if (event.target === filterQuery && ['Home','End'].includes(event.key)) return;
    const stops = [filterQuery, ...filterOptions.querySelectorAll('input')];
    if (!clearFilters.disabled) stops.push(clearFilters);
    const index = stops.indexOf(document.activeElement);
    const last = stops.length - 1;
    const target = {ArrowUp:Math.max(0, index-1), ArrowDown:Math.min(last,index+1), Home:1, End:last}[event.key];

    setMenu(false);
    panel.hidden = true;
    reopen.hidden = false;
    reopen.focus();
  });

    if (event.key === 'Escape') {
      hideTip();
      if (!menu.hidden) {
        event.preventDefault();
        setMenu(false, true);
      } else if (event.target === query && query.value) {
        event.preventDefault();
        query.value = '';
        renderResults();
      }
    }
    if (event.key === '/' && !event.altKey && !event.ctrlKey && !event.metaKey

      event.preventDefault();
      openSearch();
    }
  });

  let tipTimer;
  let tipTarget;
  function hideTip() {
    clearTimeout(tipTimer);
    tooltip.hidden = true;
    tipTarget?.removeAttribute('aria-describedby');
    tipTarget = null;
  }
  function showTip(target) {
    hideTip();
    tipTimer = setTimeout(() => {
      if (panel.hidden) return;
      tipTarget = target;
      tooltip.textContent = target.dataset.tooltipLabel;
      tooltip.hidden = false;
      target.setAttribute('aria-describedby', tooltip.id);

      tooltip.style.top = Math.max(8, top) + 'px';

  }

    target.addEventListener('pointerenter', () => showTip(target));
    target.addEventListener('focus', () => { if (target.matches(':focus-visible')) showTip(target); });
    for (const event of ['pointerleave', 'blur', 'pointerdown', 'click']) target.addEventListener(event, hideTip);

  pin.addEventListener('click', () => pin.setAttribute('aria-pressed', String(pin.getAttribute('aria-pressed') !== 'true')));

  const edge = panel.querySelector('[role="separator"]');

  function resize(value) {
    const available = panel.parentElement.clientWidth - 40;
    const width = Math.max(320, Math.min(value, 800, available));

    drag = null;
    panel.classList.remove('resizing');
  }

  edge.ondblclick = () => resize(510);
  edge.onkeydown = event => {
    if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
    event.preventDefault();
    const step = event.shiftKey ? 40 : 10;
    resize({ ArrowLeft:panel.offsetWidth + step, ArrowRight:panel.offsetWidth - step, Home:320, End:800 }[event.key]);
  };
  renderResults();
})();

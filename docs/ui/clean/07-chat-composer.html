/* Current balance, following the owner's return to ca0affe as the color reference.
   Scope colors by purpose; never recolor the entire card or app from its pill. */
:root {
  --rh-action:#375d92; --rh-action-hover:#2b4b78; --rh-action-pressed:#203858;
  --rh-action-soft:#eaf1fb; --rh-action-line:#adc4e5;
  --rh-experiment:#b86232; --rh-experiment-ink:#934723;
  --rh-experiment-soft:#f8ece3; --rh-experiment-line:#e2ad8f;
  --rh-experiment-hover:#f5e0d2; --rh-experiment-pressed:#eac6ad;
  --rh-focus:#426db2;
  --rh-toggle-on:#267657; --rh-toggle-hover:#1d6247; --rh-toggle-pressed:#174f39;
}
/* Isolated experiment widgets and the experiment row of composed cards. */
body[data-ui-palette="experiment"] .catalog-preview,
body[data-ui-palette="balanced-card"] .card-controls {
  --blue-soft:var(--rh-experiment-soft);
  --blue-border:var(--rh-experiment-line);
  --blue-ink:var(--rh-experiment-ink);
  --blue-hover:var(--rh-experiment-hover);
  --blue-pressed:var(--rh-experiment-pressed);
  --explanation-ink:var(--rh-experiment-ink);
  --control-selected-border:var(--rh-experiment-line);
  --control-selected-hover-bg:var(--rh-experiment-hover);
  --control-active-bg:var(--rh-experiment-pressed);
}
body[data-ui-palette="experiment"] .control-row input[type="range"],
body[data-ui-palette="balanced-card"] .card-controls input[type="range"] { accent-color:var(--rh-experiment); }
body[data-ui-palette="experiment"] .control-row .value,
body[data-ui-palette="balanced-card"] .card-controls .control-row .value { color:var(--rh-experiment-ink); }
/* Owner correction: toggles are green in app settings and experiments. */
body:not([data-ui-palette="historical"]) :is(.switch input,input.switch):checked,
body:not([data-ui-palette="historical"]) .toggle input:checked + .toggle-track { background:var(--rh-toggle-on); border-color:var(--rh-toggle-on); }
body:not([data-ui-palette="historical"]) :is(.switch input,input.switch):checked:hover:enabled,
body:not([data-ui-palette="historical"]) .toggle:hover input:checked:enabled + .toggle-track { background:var(--rh-toggle-hover); border-color:var(--rh-toggle-hover); }
body:not([data-ui-palette="historical"]) :is(.switch input,input.switch):checked:active:enabled,
body:not([data-ui-palette="historical"]) .toggle:active input:checked:enabled + .toggle-track { background:var(--rh-toggle-pressed); border-color:var(--rh-toggle-pressed); }
/* Reset/Previous/Next remain neutral; experiment identity must not tint every action. */
body:is([data-ui-palette="experiment"],[data-ui-palette="balanced-card"]) .button.secondary:hover:enabled { background:#f6f8f4; border-color:#d2d9d2; color:#202723; }
body:is([data-ui-palette="experiment"],[data-ui-palette="balanced-card"]) .button.secondary:active:enabled { background:#e3e7e0; color:#202723; }
/* The focus ring remains blue even within an experiment. */
body[data-ui-palette="experiment"] :is(button,input,select,summary):focus-visible,
body[data-ui-palette="balanced-card"] .card-controls :is(button,input,select,summary):focus-visible { outline-color:var(--rh-focus); }

<script>
  (() => {
function cardSize(width, height, availableWidth) {
  const maxWidth = Math.max(0, availableWidth);
  return {
    width: Math.min(maxWidth, Math.max(300, width)),
    height: Math.min(760, Math.max(245, height)),
  };
}

function installResize(card, handle) {
  let drag = null;

  function setSize(width, height) {
    const parent = card.parentElement;
    const style = getComputedStyle(parent);
    const padding = (Number.parseFloat(style.paddingLeft) || 0) + (Number.parseFloat(style.paddingRight) || 0);
    const size = cardSize(width, height, parent.clientWidth - padding);
    card.style.setProperty('--card-width', `${size.width}px`);
    card.style.setProperty('--card-height', `${size.height}px`);
  }

  handle.addEventListener('pointerdown', event => {
    if (event.button !== 0 || drag) return;
    const { width, height } = card.getBoundingClientRect();
    drag = { pointerId: event.pointerId, x: event.clientX, y: event.clientY, width, height };
    handle.setPointerCapture(event.pointerId);
    card.classList.add('is-resizing');
    handle.focus({ preventScroll: true });
    event.preventDefault();
  });

  handle.addEventListener('pointermove', event => {
    if (drag?.pointerId !== event.pointerId) return;
    setSize(drag.width + event.clientX - drag.x, drag.height + event.clientY - drag.y);
  });

  function finish(event) {
    if (drag?.pointerId !== event.pointerId) return;
    drag = null;
    card.classList.remove('is-resizing');
    if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
  }

  handle.addEventListener('pointerup', finish);
  handle.addEventListener('pointercancel', finish);
  handle.addEventListener('lostpointercapture', finish);

  handle.addEventListener('keydown', event => {
    const axes = {
      ArrowLeft: [-1, 0],
      ArrowRight: [1, 0],
      ArrowUp: [0, -1],
      ArrowDown: [0, 1],
    };
    const axis = axes[event.key];
    if (!axis) return;
    const { width, height } = card.getBoundingClientRect();
    const step = event.shiftKey ? 48 : 16;
    setSize(width + step * axis[0], height + step * axis[1]);
    event.preventDefault();
  });

    const composer = document.getElementById('rh-composer');
    const form = document.getElementById('rh-composer-form');
    const message = document.getElementById('rh-message');
    const send = document.getElementById('rh-send');
    const depth = document.getElementById('rh-depth');
    const help = document.getElementById('rh-depth-help');
    const status = document.getElementById('rh-composer-status');
    const depthHelp = { Overview:'The central idea in a short explanation.', Standard:'A balanced explanation.', Deep:'Reasoning, a worked example and edge cases.' };
    let streaming = false;
    function updateSend() {
      send.disabled = !streaming && !message.value.trim();
      send.dataset.streaming = String(streaming);
      send.querySelector('span').textContent = streaming ? 'Stop' : 'Send';
      send.querySelector('use').setAttribute('href',streaming ? '#i-Square' : '#i-ArrowUp');
    }
    function fitMessage() {
      message.style.height = 'auto';
      const borderHeight = message.offsetHeight - message.clientHeight;
      message.style.height = `${message.scrollHeight + borderHeight}px`;
    }

    let messageWidth = message.clientWidth;
    new ResizeObserver(() => {
      if (messageWidth === message.clientWidth) return;
      messageWidth = message.clientWidth;
      fitMessage();
    }).observe(message);

    message.addEventListener('input',() => {
      fitMessage();
      updateSend();
    });
    depth.addEventListener('change',() => { help.textContent = depthHelp[depth.value]; });
    form.addEventListener('submit',event => {
      event.preventDefault();
      if (send.disabled) return;
      streaming = !streaming;
      updateSend();
      status.textContent = streaming ? 'Streaming preview.' : 'Preview stopped.';
    });
    for (const button of composer.querySelectorAll('[data-rh-demo]')) {
      button.addEventListener('click',() => { status.textContent = button.dataset.rhDemo; });
    }
    installResize(composer,composer.querySelector('.resize-handle'));
    fitMessage();
    updateSend();

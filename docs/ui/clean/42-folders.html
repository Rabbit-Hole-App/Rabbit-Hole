<script>(() => {
const $=id=>document.getElementById(id),menu=$('folder-menu'),edit=$('folder-edit-dialog'),confirm=$('folder-delete-dialog');
// Allowed IDs copied from packages/web/src/library-folders.js. Preserve them in API integration.
const colours=[['#37352f','Ink'],['#2383e2','Blue'],['#b42318','Red'],['#1a7f37','Green'],['#f59e0b','Amber'],['#7c3aed','Purple']];
let folders=[{id:'leetcode',name:'LeetCode',color:'#b42318',count:0},{id:'machine-learning',name:'Machine learning',color:'#2383e2',count:0}],selected=null,trigger=null,editing=null,afterCreate=null;
const refs={folder:'#home--home-folder',more:'#standards--i-Ellipsis'};
function icon(ref){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','icon');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');const u=document.createElementNS(s.namespaceURI,'use');u.setAttribute('href',ref);s.append(u);return s}
const ink=color=>color==='#37352f'?'var(--ink)':color;
function focusFolder(id){const row=[...document.querySelectorAll('[data-folder-id]')].find(n=>n.dataset.folderId===id);(row?.querySelector('.folder-more')||trigger||$('folder-create'))?.focus()}
function tell(s){$('folder-status').textContent=s}
function change(){render();window.dispatchEvent(new CustomEvent('rh-folders-change'))}
function close(focus=true){menu.hidden=true;if(trigger){trigger.setAttribute('aria-expanded','false');if(focus&&trigger.isConnected)trigger.focus()}}
function keys(e,buttons){const i=buttons.indexOf(document.activeElement),n={ArrowDown:(i+1)%buttons.length,ArrowUp:(i+buttons.length-1)%buttons.length,Home:0,End:buttons.length-1}[e.key];if(n!==undefined){e.preventDefault();buttons[n]?.focus()}}
function open(folder,b){close(false);selected=folder;trigger=b;b.setAttribute('aria-expanded','true');$('folder-swatches').hidden=true;$('folder-colour').setAttribute('aria-expanded','false');$('folder-current-colour').style.background=ink(folder.color);menu.hidden=false;const box=b.getBoundingClientRect();menu.style.left=Math.max(12,Math.min(box.left,innerWidth-menu.offsetWidth-12))+'px';menu.style.top=Math.max(12,Math.min(box.bottom+6,innerHeight-menu.offsetHeight-12))+'px';$('folder-rename').focus()}
function render(){const grid=$('folder-grid');if(!grid)return;grid.replaceChildren();$('folder-total').textContent=String(folders.length);$('folders-empty').hidden=!!folders.length;folders.forEach(folder=>{const row=document.createElement('div');row.className='folder-tile';row.dataset.folderId=folder.id;row.style.setProperty('--folder-colour',ink(folder.color));const glyph=icon(refs.folder);glyph.classList.add('folder-glyph');const copy=document.createElement('div');copy.className='folder-copy';const title=document.createElement('button');title.className='folder-name';title.type='button';title.textContent=folder.name;title.onclick=()=>tell('Open '+folder.name);const count=document.createElement('span');count.className='folder-count';count.textContent=folder.count+' '+(folder.count===1?'item':'items');copy.append(title,count);const b=document.createElement('button');b.type='button';b.className='icon-button quiet folder-more';b.setAttribute('aria-label','Options for '+folder.name);b.setAttribute('aria-haspopup','menu');b.setAttribute('aria-expanded','false');b.setAttribute('aria-controls','folder-menu');b.append(icon(refs.more));b.onclick=()=>open(folder,b);b.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();open(folder,b)}};row.append(glyph,copy,b);grid.append(row)})}
function openEdit(folder,callback=null){close(false);editing=folder;afterCreate=callback;$('folder-edit-title').textContent=folder?'Rename folder':'New folder';$('folder-edit-save').textContent=folder?'Save':'Create';$('folder-name').value=folder?.name||'';edit.showModal();$('folder-name').focus()}
$('folder-rename').onclick=()=>openEdit(selected);$('folder-create')?.addEventListener('click',e=>{trigger=e.currentTarget;openEdit(null)});$('folder-edit-cancel').onclick=()=>edit.close();
$('folder-edit-form').onsubmit=e=>{e.preventDefault();const name=$('folder-name').value.trim().replace(/\s+/g,' ');if(!name||name.length>60){$('folder-name').setCustomValidity('Enter a name of 1–60 characters.');$('folder-name').reportValidity();return}let folder=editing;if(folder)folder.name=name;else{folder={id:'folder-'+Date.now(),name,color:colours[(folders.length+1)%colours.length][0],count:0};folders.push(folder)}edit.close();change();afterCreate?.(folder);afterCreate=null;focusFolder(folder.id)};$('folder-name').oninput=e=>e.target.setCustomValidity('');
function swatches(){const list=$('folder-swatches');list.replaceChildren();colours.forEach(([color,label])=>{const b=document.createElement('button');b.type='button';b.className='folder-swatch';b.setAttribute('role','radio');b.setAttribute('aria-label',label);b.setAttribute('aria-checked',String(selected.color===color));b.tabIndex=selected.color===color?0:-1;const dot=document.createElement('span');dot.className='folder-dot';dot.style.background=ink(color);b.append(dot);b.onclick=()=>{selected.color=color;close(false);change();tell(selected.name+' colour changed');focusFolder(selected.id)};b.onkeydown=e=>{if(['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','Home','End'].includes(e.key)){e.preventDefault();e.stopPropagation();const all=[...list.children],i=all.indexOf(b);const n=e.key==='Home'?0:e.key==='End'?all.length-1:(i+(['ArrowRight','ArrowDown'].includes(e.key)?1:-1)+all.length)%all.length;all.forEach((x,j)=>x.tabIndex=j===n?0:-1);all[n].focus()}if(e.key==='Escape'){e.preventDefault();e.stopPropagation();list.hidden=true;$('folder-colour').setAttribute('aria-expanded','false');$('folder-colour').focus()}};list.append(b)})}
function toggleColour(){const list=$('folder-swatches');list.hidden=!list.hidden;$('folder-colour').setAttribute('aria-expanded',String(!list.hidden));if(!list.hidden){swatches();list.querySelector('[aria-checked=true]').focus()}}
$('folder-colour').onclick=toggleColour;$('folder-colour').onkeydown=e=>{if(e.key==='ArrowRight'){e.preventDefault();if($('folder-swatches').hidden)toggleColour()}};
$('folder-delete').onclick=()=>{close(false);$('folder-delete-title').textContent='Delete “'+selected.name+'”?';$('folder-delete-description').textContent=selected.count?'Its '+selected.count+' '+(selected.count===1?'canvas returns':'canvases return')+' to Library. Nothing inside is deleted.':'The folder is empty.';confirm.showModal();$('folder-delete-cancel').focus()};$('folder-delete-cancel').onclick=()=>confirm.close();$('folder-delete-confirm').onclick=()=>{const id=selected.id;folders=folders.filter(f=>f.id!==id);confirm.close();change();window.dispatchEvent(new CustomEvent('rh-folder-deleted',{detail:id}));($('folder-create')||trigger)?.focus()};
for(const dialog of [edit,confirm])dialog.addEventListener('close',()=>{if(trigger?.isConnected)trigger.focus()});menu.onkeydown=e=>{if(e.target.closest('.folder-swatches'))return;keys(e,[...menu.querySelectorAll('[role=menuitem]')]);if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab')close(true)};document.addEventListener('pointerdown',e=>{if(!menu.hidden&&!menu.contains(e.target)&&!trigger?.contains(e.target))close(false)});window.addEventListener('resize',()=>close(false));
window.RHFolderUI={get folders(){return folders},create(callback,opener){trigger=opener;openEdit(null,callback)},setCounts(counts){folders.forEach(f=>f.count=counts[f.id]||0);render()}};render();
})();

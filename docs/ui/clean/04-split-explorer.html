<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tree Split Explorer</title><style>
    :root {
      color-scheme: light;
      --paper:#f5f4ed; --card:#fffefa; --panel:#f6f8f4; --ink:#202723; --muted:#5d675f;
      --border:#e3e7e0; --card-border:#dedfd8; --blue:#426db2; --blue-soft:#eaf1fb;
      --blue-border:#adc4e5; --blue-ink:#375d92; --blue-hover:#dde9f8; --blue-pressed:#d0e0f4; --blue-solid-hover:#2b4b78; --blue-solid-pressed:#203858;
      --orange:#b86232; --orange-dark:#934723; --orange-soft:#f8ece3;
      --green:#267657; --green-soft:#e5f2ea; --green-border:#b8dccc;
      font:16px/1.45 Inter,"Liberation Sans",Arial,sans-serif; background:var(--paper); color:var(--ink);
    }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; }
    main { width:min(100%,1256px); margin:auto; padding:27px 26px 52px; }
    h1,h2,h3,p,dl,dd,figure { margin:0; }
    h1 { margin:6px 0; font-size:clamp(2rem,4vw,2.8rem); line-height:1.1; letter-spacing:-.036em; }
    h2 { font-size:clamp(1.45rem,3vw,1.8rem); letter-spacing:-.025em; }
    .eyebrow { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:.88rem; font-weight:700; }
    .eyebrow::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--blue); }
    .lede,.section-description { color:var(--muted); max-width:74ch; }
    .page-nav { display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:16px; }
    a { color:var(--blue-ink); text-underline-offset:3px; }
    section { margin-top:31px; scroll-margin-top:18px; }
    .section-description { margin:4px 0 13px; }
    .grid { display:grid; gap:14px; grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start; }
    .card,.sample,.inventory { background:var(--card); border:1px solid var(--card-border); border-radius:18px; }
    .card { padding:18px 24px 21px; box-shadow:0 2px #e6e5de; min-width:0; container-type:inline-size; }
    .card-header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
    .badge { display:inline-flex; align-items:center; min-height:26px; padding:1px 11px; border:1px solid transparent; border-radius:999px; font-size:13px; font-weight:700; line-height:1.45; white-space:nowrap; }
    .badge.explain { color:var(--blue-ink); background:var(--blue-soft); }
    .badge.interactive { color:var(--orange-dark); background:var(--orange-soft); }
    .slot-tag { color:var(--muted); font-size:.8rem; }
    .card h3 { font-size:26.4px; font-weight:700; line-height:1.17; letter-spacing:-.023em; }
    .card-copy { display:grid; gap:5px; margin:9px 0 11px; color:#505b52; font-size:15px; font-weight:400; line-height:1.45; }
    .why { border:1px solid var(--green-border); border-radius:9px; margin:0 0 10px; padding:7px 10px; background:var(--green-soft); color:#205c45; font-size:.875rem; }
    .why strong { margin-inline-end:5px; }
    .scene { min-width:0; overflow:hidden; }
    .scene svg { display:block; width:100%; height:auto; font-family:inherit; }
    .card-controls { display:grid; gap:8px; margin-top:10px; }
    .card-timeline:not(:empty) { margin-top:9px; }
    .example-stat { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .stat { display:grid; gap:3px; min-width:0; padding:12px; background:var(--panel); border:1px solid var(--border); border-radius:10px; color:var(--muted); }
    .stat strong { color:var(--blue); font-size:1.35rem; }
    .catalog { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .sample { min-width:0; padding:15px 15px 16px; border-radius:13px; container-type:inline-size; }
    .sample h3 { font-size:1rem; }
    .sample p { color:var(--muted); font-size:.85rem; margin:4px 0 10px; }
    .sample[data-demo="timeline"] { grid-column:span 2; }
    .control-row { min-width:0; display:grid; grid-template-columns:minmax(75px,auto) minmax(62px,1fr) max-content; gap:9px; align-items:center; }
    .control-label { font-weight:650; color:var(--ink); font-size:.875rem; }
    .value { color:var(--blue-ink); font-size:.875rem; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
    button,input,select { font:inherit; }
    button,select,input[type="number"] { min-height:35px; color:var(--ink); }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.45; }
    :is(button,input,select,summary):focus-visible,.choice:has(input:focus-visible) .choice-text,.toggle:has(input:focus-visible) .toggle-track { outline:2px solid var(--blue); outline-offset:2px; }
    input[type="range"] { width:100%; min-width:0; margin:0; accent-color:var(--blue); cursor:pointer; }
    fieldset { border:0; min-inline-size:0; padding:0; margin:0; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    .selector { display:flex; align-items:center; gap:8px 10px; flex-wrap:wrap; }
    .choice-list { display:flex; flex:1; flex-wrap:wrap; gap:5px; }
    .choice { position:relative; display:inline-flex; flex:1; }
    .choice-text { display:grid; width:100%; min-height:35px; place-items:center; text-align:center; padding:5px 8px; cursor:pointer; color:var(--muted); font-size:13px; font-weight:650; line-height:1.45; background:#fff; border:1px solid var(--border); border-radius:8px; white-space:nowrap; }
    .choice input:checked + .choice-text { background:var(--blue-soft); color:var(--blue-ink); border-color:var(--blue-border); }
    .choice:hover input:enabled + .choice-text { background:var(--blue-hover); color:var(--blue-ink); border-color:var(--blue-border); }
    .choice:active input:enabled + .choice-text { background:var(--blue-pressed); color:var(--blue-ink); border-color:var(--blue-border); }
    .choice input:disabled + .choice-text { cursor:default; opacity:.45; }
    .button { display:inline-flex; justify-content:center; align-items:center; gap:5px; min-height:35px; padding:6px 11px; border:1px solid var(--blue-border); border-radius:8px; color:var(--blue-ink); background:var(--blue-soft); font-size:13px; font-weight:650; line-height:1.45; white-space:nowrap; }
    .button:enabled:hover { background:var(--blue-hover); }
    .button:enabled:active { background:var(--blue-pressed); }
    .button.secondary { background:#fff; border-color:var(--border); color:var(--muted); }
    .button.secondary:enabled:hover { background:var(--blue-hover); }
    .button.secondary:enabled:active { background:var(--blue-pressed); }
    .action-row,.index-row { display:flex; align-items:center; flex-wrap:wrap; gap:7px; }
    .action-row .status { margin-inline-start:2px; }
    .status { font-size:.83rem; color:var(--muted); font-variant-numeric:tabular-nums; }
    .transport { display:grid; grid-template-columns:72px minmax(55px,1fr) 68px; gap:9px; align-items:center; padding:6px 8px; border:1px solid var(--border); border-radius:9px; background:var(--panel); }
    .transport .value { text-align:right; }
    .select-row,.toggle { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
    select,input[type="number"] { border:1px solid var(--border); border-radius:8px; background:#fff; padding:6px 8px; font-size:.875rem; }
    select { min-width:110px; max-width:100%; }
    .toggle { position:relative; cursor:pointer; }
    .toggle-track { display:flex; width:37px; height:22px; padding:2px; align-items:center; border:1px solid #ced8cc; background:#e2e8df; border-radius:11px; }
    .toggle-track::after { content:""; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px #20272330; }
    .toggle input:checked + .toggle-track { background:var(--blue-ink); border-color:var(--blue-ink); justify-content:flex-end; }
    .toggle:hover input:checked:enabled + .toggle-track { background:var(--blue-solid-hover); border-color:var(--blue-solid-hover); }
    .toggle:active input:checked:enabled + .toggle-track { background:var(--blue-solid-pressed); border-color:var(--blue-solid-pressed); }
    .stepper { display:flex; gap:4px; align-items:center; }
    .stepper input { width:54px; text-align:center; }
    .settings { border:1px solid var(--border); border-radius:9px; padding:7px 9px; background:var(--panel); }
    .settings summary { cursor:pointer; font-size:.85rem; font-weight:650; }
    .settings-body { padding-top:7px; }
    .readout { display:flex; justify-content:space-between; align-items:baseline; gap:8px; color:var(--green); background:var(--green-soft); padding:8px 10px; border-radius:8px; font-size:.87rem; }
    .readout strong { font-variant-numeric:tabular-nums; }
    .inventory { padding:0 14px; border-radius:13px; }
    .inventory .line { display:grid; grid-template-columns:minmax(135px,1fr) minmax(0,2.8fr); gap:10px; padding:10px 0; }
    .inventory .line + .line { border-top:1px solid var(--border); }
    .inventory dd { color:var(--muted); }
    .inventory dt { font-weight:700; }
    .availability { display:inline-block; color:var(--blue-ink); background:var(--blue-soft); border-radius:999px; padding:2px 7px; font-size:.72rem; font-weight:700; margin-bottom:4px; }
    .availability.gated { background:#ecefe8; color:#4b584e; }
    .availability.planned { background:var(--panel); color:var(--muted); }
    @media (max-width:860px) { .grid,.catalog { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:690px) { .grid { grid-template-columns:1fr; } }
    @media (max-width:500px) {
      main { padding:19px 13px 35px; }
      .card { padding:14px 13px 16px; }
      .catalog { grid-template-columns:1fr; }
      .sample[data-demo="timeline"] { grid-column:auto; }
      .inventory .line { grid-template-columns:1fr; gap:2px; }
    }
    /* Container queries measure the content box. Subtract the border and horizontal padding from 370 px. */
    @container (max-width:320px) { .card h3 { font-size:21.6px; } }
    @media (max-width:500px) {
      @container (max-width:342px) { .card h3 { font-size:21.6px; } }
    }
    @container (max-width:235px) {
      .control-row { grid-template-columns:1fr auto; }
      .control-row input[type="range"] { grid-row:2; grid-column:1 / -1; }
      .control-row output { grid-row:1; grid-column:2; }
      .transport { grid-template-columns:68px minmax(55px,1fr); }
      .transport .value { grid-column:2; }
    }
  

    :root {
      color-scheme: light;
      /* Card tokens. The design tables below describe these same values. */
      --font-family: Inter, "Liberation Sans", Arial, sans-serif;
      --font-base: 1rem;
      --leading-default: 1.45;
      --title-size: 1.65rem;
      --title-size-compact: 1.35rem;
      --title-leading: 1.17;
      --title-tracking: -.023em;
      --copy-size: .9375rem;
      --detail-size: .875rem;
      --label-size: .8125rem;
      --weight-normal: 400;
      --weight-label: 650;
      --weight-bold: 700;
      --subtitle-leading: 1.35;
      --paper: #f5f4ed;
      --card: #fffefa;
      --card-border: #dedfd8;
      --card-shadow: #e6e5de;
      --header-line: #ecece6;
      --panel: #f6f8f4;
      --panel-border: #e3e7e0;
      --ink: #202723;
      --muted: #5d675f;
      --copy-ink: #505b52;
      --blue: #426db2;
      --explanation-ink: #375d92;
      --blue-soft: #eaf1fb;
      --control-selected-border: #adc4e5;
      --control-selected-hover-bg: #dde9f8;
      --control-active-bg: #d0e0f4;
      --orange: #b86232;
      --orange-dark: #934723;
      --orange-soft: #f8ece3;
      --green: #267657;
      --green-soft: #e5f2ea;
      --why-ink: #205c45;
      --why-border: #b8dccc;
      --deny-border: #eac6ad;
      --control-bg: #ffffff;
      --control-hover-bg: #f6f8f4;
      --control-hover-border: #d2d9d2;
      --tree-line: #b9c3b9;
      --tree-active-border: #93c9af;
      --tree-deny-border: #dfae8e;
      --disabled-opacity: .45;
      --card-radius: 18px;
      --card-inset-default: 24px;
      --card-inset-compact: 15px;
      --pill-height: 26px;
      --pill-radius: 999px;
      --why-radius: 9px;
      --control-radius: 8px;
      --grip-radius: 7px;
      --focus-width: 2px;
      font: var(--font-base)/var(--leading-default) var(--font-family);
      background: var(--paper);
      color: var(--ink);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body, h1, h2, p, figure { margin: 0; }
    main { max-width: 1256px; margin: 0 auto; padding: 27px 26px 44px; }
    .eyebrow { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .9375rem; font-weight: 700; }
    .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
    h1 { margin: 6px 0 5px; font-size: clamp(1.65rem, 4vw, 2.25rem); line-height: 1.2; letter-spacing: -.026em; }
    .page-note { color: var(--muted); max-width: 72ch; }
    .examples { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 22px; align-items: start; }
    .demo { min-width: 0; }
    .demo-label { color: var(--muted); font-size: .8125rem; font-weight: 650; margin: 0 0 7px 2px; }

    /* The resize height is a ceiling. Short content keeps its natural height. */
    .teaching-card {
      --card-width: 548px;
      --card-height: 430px;
      --card-inset: var(--card-inset-default);
      display: flex;
      flex-direction: column;
      position: relative;
      width: min(100%, var(--card-width));
      max-height: var(--card-height);
      min-width: 0;
      min-height: 0;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
      box-shadow: 0 2px var(--card-shadow);
      overflow: hidden;
      container-type: inline-size;
    }
    .card-header { flex: none; padding: 17px var(--card-inset) 11px; background: var(--card); border-bottom: 1px solid var(--header-line); }
    .card-top { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .card-pill { display: inline-flex; align-items: center; min-height: var(--pill-height); padding: 1px 11px; border-radius: var(--pill-radius); font-size: var(--label-size); font-weight: var(--weight-bold); }
    .card-pill.explain { color: var(--explanation-ink); background: var(--blue-soft); }
    .card-pill.interactive { color: var(--orange-dark); background: var(--orange-soft); }
    .card-title { color: var(--ink); font-size: var(--title-size); font-weight: var(--weight-bold); line-height: var(--title-leading); letter-spacing: var(--title-tracking); overflow-wrap: anywhere; }
    .card-subtitle { margin-top: 4px; color: var(--muted); font-size: var(--detail-size); font-weight: var(--weight-label); line-height: var(--subtitle-leading); }
    .card-actions:empty { display: none; }
    .card-body {
      flex: 0 1 auto;
      min-height: 0;
      padding: 11px var(--card-inset) 24px;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      scrollbar-width: thin;
    }
    .card-body:focus-visible { outline: var(--focus-width) solid var(--blue); outline-offset: -3px; }
    .card-copy { display: grid; gap: 5px; margin-bottom: 10px; color: var(--copy-ink); font-size: var(--copy-size); font-weight: var(--weight-normal); }
    .card-why { margin-bottom: 9px; padding: 7px 10px; border: 1px solid var(--why-border); border-radius: var(--why-radius); background: var(--green-soft); color: var(--why-ink); font-size: var(--detail-size); }
    .card-why strong { margin-inline-end: 5px; font-weight: var(--weight-bold); }
    .card-why[data-decision="deny"] { border-color: var(--deny-border); background: var(--orange-soft); color: var(--orange-dark); }
    .card-visual { width: 100%; min-width: 0; }
    .card-visual :is(svg, img) { display: block; width: 100%; max-width: 100%; height: auto; }
    .card-visual img { object-fit: contain; }
    .card-caption { margin-top: 6px; color: var(--muted); font-size: var(--detail-size); }
    .card-controls:not(:empty) { margin-top: 10px; }
    .tree-background { fill: var(--panel); stroke: var(--panel-border); }
    .branch { stroke: var(--tree-line); stroke-width: 1.6; }
    .branch.is-active { stroke: var(--green); stroke-width: 3; }
    .edge-label { fill: var(--muted); }
    .edge-label.is-active { fill: var(--green); }
    .tree-node rect { fill: var(--control-bg); stroke: var(--panel-border); }
    .tree-node text { fill: var(--ink); }
    .tree-node:is([data-route$="-approve"], [data-route$="-deny"]) text { fill: var(--muted); }
    .tree-node.is-active rect { fill: var(--green-soft); stroke: var(--tree-active-border); }
    .tree-node.is-active text { fill: var(--green); }
    .tree-node.is-active[data-route$="-deny"] rect { fill: var(--orange-soft); stroke: var(--tree-deny-border); }
    .tree-node.is-active[data-route$="-deny"] text { fill: var(--orange-dark); }
    fieldset { min-inline-size: 0; margin: 0; padding: 0; border: 0; }
    .choices { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .choice-label { margin-inline-end: 4px; font-weight: var(--weight-label); font-size: var(--detail-size); }
    .choice { display: grid; flex: 1 1 83px; cursor: pointer; }
    .choice-text { display: grid; place-items: center; min-height: 35px; padding: 5px 7px; text-align: center; border: 1px solid var(--panel-border); border-radius: var(--control-radius); background: var(--control-bg); color: var(--muted); font-size: var(--label-size); font-weight: var(--weight-label); }
    .choice:hover input:enabled + .choice-text { background: var(--control-hover-bg); border-color: var(--control-hover-border); }
    .choice input:checked + .choice-text { border-color: var(--control-selected-border); background: var(--blue-soft); color: var(--explanation-ink); }
    .choice:hover input:checked:enabled + .choice-text { background: var(--control-selected-hover-bg); border-color: var(--control-selected-border); color: var(--explanation-ink); }
    .choice:active input:enabled + .choice-text { background: var(--control-active-bg); border-color: var(--control-selected-border); color: var(--explanation-ink); }
    .choice input:focus-visible + .choice-text { outline: var(--focus-width) solid var(--blue); outline-offset: 2px; }
    .choice input:disabled + .choice-text { opacity: var(--disabled-opacity); cursor: not-allowed; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .resize-handle {
      position: absolute; right: 2px; bottom: 2px;
      display: grid; place-items: center;
      width: 26px; height: 26px; padding: 0;
      border: 1px solid transparent; border-radius: var(--grip-radius);
      background: var(--card); color: var(--muted);
      cursor: nwse-resize; touch-action: none;
    }
    .resize-handle:hover { color: var(--explanation-ink); background: var(--blue-soft); border-color: var(--control-selected-border); }
    .resize-handle:active, .teaching-card.is-resizing .resize-handle { color: var(--explanation-ink); background: var(--control-active-bg); border-color: var(--control-selected-border); }
    .resize-handle:focus-visible { outline: var(--focus-width) solid var(--blue); outline-offset: -2px; }
    .teaching-card.is-resizing { user-select: none; }
    @container (max-width: 370px) {
      .card-header, .card-body { padding-inline: var(--card-inset-compact); }
      .card-title { font-size: var(--title-size-compact); }
      .choices .choice-label { flex-basis: 100%; }
    }
    @media (max-width: 790px) { .examples { grid-template-columns: 1fr; } }
    @media (max-width: 510px) { main { padding: 18px 12px 32px; } }
    .spec-link { display: inline-block; margin-top: 8px; color: var(--explanation-ink); font-size: var(--detail-size); }
    .design-spec { margin-top: 32px; }
    .design-spec > p { margin: 7px 0 13px; color: var(--muted); }
    .design-spec details { margin-bottom: 10px; padding: 10px 13px; background: var(--card); border: 1px solid var(--card-border); border-radius: 10px; }
    .design-spec summary { cursor: pointer; font-weight: var(--weight-bold); }
    .spec-table { margin-top: 8px; overflow-x: auto; }
    .design-spec table { width: 100%; border-collapse: collapse; text-align: left; font-size: var(--detail-size); }
    .design-spec th, .design-spec td { border-bottom: 1px solid var(--header-line); padding: 7px 8px; vertical-align: top; }
    .design-spec th { background: var(--panel); }
    .design-spec code { white-space: nowrap; }
    .swatch { display: inline-block; width: 13px; height: 13px; margin-inline-end: 5px; vertical-align: -1px; border: 1px solid var(--card-border); border-radius: 3px; background: var(--swatch); }
  
/* Slot composition only. Palette roles remain in foundations/palette.css. */
#example-cards > .teaching-card > .card-header { display:block; margin:0; }
#example-cards > .teaching-card .card-top { margin-bottom:8px; }
#example-cards > .teaching-card .card-copy { margin-top:0; }
#example-cards > .teaching-card .card-controls { margin-top:10px; }
#example-cards > .teaching-card .card-timeline:not(:empty) { margin-top:9px; }

/* Owner review: one current card system across individual components and flows. */
:root{--ui-scroll:#d5d9cf;--ui-scroll-hover:#bdc6b5;--ui-min-width:440px;--ui-max-width:960px;--ui-min-height:320px;--ui-max-height:760px;--scroll-thumb:#d5d9cf;--scroll-thumb-hover:#bdc6b5;--surface:#fffefa;--ink:#202723;--ink-2:#5d675f;--secondary:#5d675f;--line:#dedfd8;--inset:#f6f8f4;--accent:#426db2}

/* Current balance, following the owner's return to ca0affe as the color reference.
   Scope colors by purpose; never recolor the entire card or app from its pill. */
:root {
  --rh-action:#375d92; --rh-action-hover:#2b4b78; --rh-action-pressed:#203858;
  --rh-action-soft:#eaf1fb; --rh-action-line:#adc4e5;

  --rh-experiment-soft:#f8ece3; --rh-experiment-line:#e2ad8f;
  --rh-experiment-hover:#f5e0d2; --rh-experiment-pressed:#eac6ad;
  --rh-focus:#426db2;
  --rh-toggle-on:#267657; --rh-toggle-hover:#1d6247; --rh-toggle-pressed:#174f39;
}
/* Isolated experiment widgets and the experiment row of composed cards. */
body[data-ui-palette="experiment"] .catalog-preview,
body[data-ui-palette="balanced-card"] .card-controls {
  --blue-soft:var(--rh-experiment-soft);
  --blue-border:var(--rh-experiment-line);
  --blue-ink:var(--rh-experiment-ink);
  --blue-hover:var(--rh-experiment-hover);
  --blue-pressed:var(--rh-experiment-pressed);
  --explanation-ink:var(--rh-experiment-ink);
  --control-selected-border:var(--rh-experiment-line);
  --control-selected-hover-bg:var(--rh-experiment-hover);
  --control-active-bg:var(--rh-experiment-pressed);
}
body[data-ui-palette="experiment"] .control-row input[type="range"],
body[data-ui-palette="balanced-card"] .card-controls input[type="range"] { accent-color:var(--rh-experiment); }
body[data-ui-palette="experiment"] .control-row .value,
body[data-ui-palette="balanced-card"] .card-controls .control-row .value { color:var(--rh-experiment-ink); }
/* Owner correction: toggles are green in app settings and experiments. */
body:not([data-ui-palette="historical"]) :is(.switch input,input.switch):checked,
body:not([data-ui-palette="historical"]) .toggle input:checked + .toggle-track { background:var(--rh-toggle-on); border-color:var(--rh-toggle-on); }

/* Reset/Previous/Next remain neutral; experiment identity must not tint every action. */

<script>
function cardSize(width, height, availableWidth, limits = {}) {
  const maxWidth = Math.min(960, Math.max(limits.minWidth || 440, availableWidth));
  return {
    width: Math.min(maxWidth, Math.max(limits.minWidth || 440, width)),
    height: Math.min(760, Math.max(limits.minHeight || 320, height)),
  };
}

function installResize(card, handle) {
  if (!handle || handle.dataset.resizeBound) return;
  handle.dataset.resizeBound = 'true';
  let drag = null;

  function setSize(width, height) {
    const parent = card.parentElement;
    const style = getComputedStyle(parent);
    const padding = (Number.parseFloat(style.paddingLeft) || 0) + (Number.parseFloat(style.paddingRight) || 0);
    const size = cardSize(width, height, parent.clientWidth - padding, card.matches(".rh-composer") ? {minWidth:360,minHeight:170} : {});
    card.style.setProperty('--card-width', `${size.width}px`);
    card.style.setProperty('--card-height', `${size.height}px`);
  }

  handle.addEventListener('pointerdown', event => {
    if (event.button !== 0 || drag) return;
    const { width, height } = card.getBoundingClientRect();
    drag = { pointerId: event.pointerId, x: event.clientX, y: event.clientY, width, height };
    handle.setPointerCapture(event.pointerId);
    card.classList.add('is-resizing');
    handle.focus({ preventScroll: true });
    event.preventDefault();
  });

  handle.addEventListener('pointermove', event => {
    if (drag?.pointerId !== event.pointerId) return;
    setSize(drag.width + event.clientX - drag.x, drag.height + event.clientY - drag.y);
  });

  function finish(event) {
    if (drag?.pointerId !== event.pointerId) return;
    drag = null;
    card.classList.remove('is-resizing');
    if (handle.hasPointerCapture(event.pointerId)) handle.releasePointerCapture(event.pointerId);
  }

  handle.addEventListener('pointerup', finish);
  handle.addEventListener('pointercancel', finish);
  handle.addEventListener('lostpointercapture', finish);

  handle.addEventListener('keydown', event => {
    const axes = {
      ArrowLeft: [-1, 0],
      ArrowRight: [1, 0],
      ArrowUp: [0, -1],
      ArrowDown: [0, 1],
    };
    const axis = axes[event.key];
    if (!axis) return;
    const { width, height } = card.getBoundingClientRect();
    const step = event.shiftKey ? 48 : 16;
    setSize(width + step * axis[0], height + step * axis[1]);
    event.preventDefault();
  });
}



function drawSplit(cutoff, criterion) {
  const points = ['A', 'A', 'B', 'A', 'A', 'B', 'B', 'A', 'B', 'B'];
  const left = points.filter((_, i) => i + 1 <= cutoff);
  const right = points.slice(left.length);
  const tally = group => group.filter(label => label === 'A').length;
  const impurity = group => {
    const p = tally(group) / group.length;
    if (p === 0 || p === 1) return 0;
    return criterion === 'entropy'
      ? -p * Math.log2(p) - (1 - p) * Math.log2(1 - p)
      : 1 - p ** 2 - (1 - p) ** 2;
  };
  const leftA = tally(left);
  const rightA = tally(right);
  const child = (left.length * impurity(left) + right.length * impurity(right)) / points.length;
  const gain = impurity(points) - child;
  const format = value => value.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
  const measure = criterion === 'entropy' ? 'entropy' : 'Gini';
  const splitX = 30 + (cutoff - 1) * (480 / 9);
  const dots = points.map((label, i) => {
    const x = 30 + i * (480 / 9);
    return `<circle cx="${x}" cy="52" r="12" fill="${label === 'A' ? '#426db2' : '#b86232'}"/>
      <text x="${x}" y="56" fill="white" text-anchor="middle" font-size="11" font-weight="700">${label}</text>
      <text x="${x}" y="76" fill="#5d675f" text-anchor="middle" font-size="11">${i + 1}</text>`;
  }).join('');
  return {
    why: `At ${cutoff.toFixed(1)}, the left group has ${leftA} A and ${left.length - leftA} B. The right group has ${rightA} A and ${right.length - rightA} B, giving ${measure} gain of ${format(gain)}.`,
    svg: `<svg viewBox="0 0 540 140" role="img" aria-label="Labeled points, class counts and split gain" style="display:block;width:100%;height:auto">
      <rect x="0.5" y="0.5" width="539" height="139" rx="10" fill="#f6f8f4" stroke="#e3e7e0"/>
      <rect x="13" y="14" width="${splitX - 13}" height="73" rx="6" fill="#eaf1fb"/>
      <rect x="${splitX}" y="14" width="${527 - splitX}" height="73" rx="6" fill="#f8ece3"/>
      <path d="M ${splitX} 14 V 87" stroke="#267657" stroke-width="2" stroke-dasharray="4 3"/>
      ${dots}
      <text x="${splitX}" y="29" text-anchor="middle" fill="#267657" font-size="11" font-weight="700" paint-order="stroke" stroke="#f6f8f4" stroke-width="3">${cutoff.toFixed(1)}</text>
      <text x="20" y="109" fill="#202723" font-size="13" font-weight="700">Left · ${leftA} A, ${left.length - leftA} B</text>
      <text x="20" y="126" fill="#202723" font-size="13" font-weight="700">Right · ${rightA} A, ${right.length - rightA} B</text>
      <text x="520" y="109" text-anchor="end" fill="#5d675f" font-size="13">Weighted ${measure} ${format(child)}</text>
      <text x="520" y="126" text-anchor="end" fill="#267657" font-size="13" font-weight="700">Gain ${format(gain)}</text>
    </svg>`,
  };
}

function drawToss(height, time) {

  function transport({ min, max, initial, step, signed }, onChange = () => {}) {
    const node = clone('timeline');

    let time = initial;
    let active = false;

  if(button.hasAttribute('data-chat-edit')){const box=button.closest('.chat-proposal');if(!box.querySelector('textarea')){const input=document.createElement('textarea');input.setAttribute('aria-label','Edit card instructions');input.placeholder='Describe your changes…';input.style.cssText='width:100%;padding:10px;border:1px solid #dedfd8;border-radius:8px;font:15px/1.5 sans-serif';box.append(input);input.focus();}}
  if(button.hasAttribute('data-reply-focus'))button.closest('.comment-thread').querySelector('textarea').focus();
 });
 document.addEventListener('keydown',event=>{if(event.key==='Tab'&&!event.shiftKey&&!event.ctrlKey&&!event.metaKey&&(event.target===document.body||event.target.closest('.proposal-stack .teaching-card'))){const accept=document.querySelector('.acceptance-pill:not([hidden]) [data-approve=accept]');if(accept){event.preventDefault();accept.click();}}if(event.key==='Escape')document.querySelectorAll('details.ui-select[open]').forEach(d=>{d.open=false;d.querySelector('summary').focus();});});
 document.querySelectorAll('[data-followup-form]').forEach(form=>{const input=form.querySelector('input'),send=form.querySelector('button[type=submit]');send.disabled=!input.value.trim();input.addEventListener('input',()=>send.disabled=!input.value.trim());});
 document.querySelectorAll('[data-followup-form]').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const input=form.querySelector('input');if(!input.value.trim())return;const message=document.createElement('p');message.className='followup-message';message.textContent=input.value.trim();form.before(message);input.value='';form.querySelector('button[type=submit]').disabled=true;}));
 document.querySelectorAll('.reply-form').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const input=form.querySelector('textarea');if(!input.value.trim())return;const reply=document.createElement('article');reply.className='comment';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent='Y';const body=document.createElement('div');const name=document.createElement('strong');name.textContent='You';const time=document.createElement('time');time.textContent=' · Just now';const text=document.createElement('p');text.textContent=input.value.trim();body.append(name,time,text);reply.append(avatar,body);form.closest('.comment-thread').querySelector('.replies').append(reply);input.value='';form.closest('.comment-thread').querySelector('.reply-status').textContent='Reply posted in this preview.';}));
 refresh();let scheduled=false;new MutationObserver(records=>{if(scheduled||!records.some(r=>r.addedNodes.length))return;scheduled=true;requestAnimationFrame(()=>{scheduled=false;refresh();});}).observe(document.body,{childList:true,subtree:true});
})();

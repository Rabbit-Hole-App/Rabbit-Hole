    .switch input:checked:hover:enabled { background:var(--primary-hover); border-color:var(--primary-hover); }
    .switch input:checked:active:enabled { background:var(--primary-pressed); border-color:var(--primary-pressed); }
    .checkbox > input[type="checkbox"] { appearance:none; position:relative; flex:none; width:16px; height:16px; border:1px solid var(--control-hover-border); border-radius:4px; background:var(--control-bg); cursor:pointer; }
    .checkbox > input:hover:enabled { background:var(--panel); border-color:var(--muted); }
    .checkbox > input:active:enabled { background:var(--control-active-bg); border-color:var(--control-selected-border); }
    .checkbox > input:is(:checked,:indeterminate) { background:var(--primary); border-color:var(--primary); }
    .checkbox > input:is(:checked,:indeterminate):hover:enabled { background:var(--primary-hover); border-color:var(--primary-hover); }
    .checkbox > input:is(:checked,:indeterminate):active:enabled { background:var(--primary-pressed); border-color:var(--primary-pressed); }
    .checkbox > input:checked::before { content:""; position:absolute; left:50%; top:50%; width:8px; height:5px; border-left:2px solid var(--control-bg); border-bottom:2px solid var(--control-bg); transform:translate(-50%,-64%) rotate(-45deg); }
    .checkbox > input:indeterminate::before { content:""; position:absolute; left:3px; top:6px; width:8px; height:2px; background:var(--control-bg); }
    @media (max-width:740px) { main { padding:18px 12px 33px; } .specimens { grid-template-columns:1fr; } .specimen,.reference-panel { padding:10px; } }

.trash-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--header-line);padding:12px 0;font-size:15px}.trash-row:last-child{border:0}.item-copy{flex:1;min-width:0}.item-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:650}.item-copy small{font-size:13px;color:var(--muted)}.trash-row .button{flex:none;white-space:nowrap}.local-status:empty{display:none}.local-status{font-size:13px;color:var(--green);margin-top:12px}
.feedback-types{display:flex;gap:6px}.feedback-types .button{flex:1;white-space:nowrap;padding-inline:8px}.feedback-types .button[aria-pressed="true"]{color:var(--primary);background:var(--blue-soft);border-color:var(--control-selected-border)}
#feedback-text{resize:none;min-height:132px;max-height:240px;overflow:auto;font-size:15px}.notification-copy{font-size:15px}.notification-copy p{margin-top:5px}.notification-meta{font-size:13px;color:var(--muted);margin-top:8px}
.sidebar-row>.count-badge{flex:none}.sidebar-row[aria-expanded="true"]{background:var(--control-hover-bg);color:var(--ink)}.collapsed .sidebar-row>.count-badge{position:absolute;right:0;top:1px;min-width:16px;height:16px;font-size:10px}

/* Current balance, following the owner's return to ca0affe as the color reference.
   Scope colors by purpose; never recolor the entire card or app from its pill. */
:root {
  --rh-action:#375d92; --rh-action-hover:#2b4b78; --rh-action-pressed:#203858;
  --rh-action-soft:#eaf1fb; --rh-action-line:#adc4e5;
  --rh-experiment:#b86232; --rh-experiment-ink:#934723;
  --rh-experiment-soft:#f8ece3; --rh-experiment-line:#e2ad8f;
  --rh-experiment-hover:#f5e0d2; --rh-experiment-pressed:#eac6ad;
  --rh-focus:#426db2;
  --rh-toggle-on:#267657; --rh-toggle-hover:#1d6247; --rh-toggle-pressed:#174f39;
}
/* Isolated experiment widgets and the experiment row of composed cards. */
body[data-ui-palette="experiment"] .catalog-preview,
body[data-ui-palette="balanced-card"] .card-controls {
  --blue-soft:var(--rh-experiment-soft);
  --blue-border:var(--rh-experiment-line);
  --blue-ink:var(--rh-experiment-ink);
  --blue-hover:var(--rh-experiment-hover);
  --blue-pressed:var(--rh-experiment-pressed);
  --explanation-ink:var(--rh-experiment-ink);
  --control-selected-border:var(--rh-experiment-line);
  --control-selected-hover-bg:var(--rh-experiment-hover);
  --control-active-bg:var(--rh-experiment-pressed);
}
body[data-ui-palette="experiment"] .control-row input[type="range"],
body[data-ui-palette="balanced-card"] .card-controls input[type="range"] { accent-color:var(--rh-experiment); }
body[data-ui-palette="experiment"] .control-row .value,
body[data-ui-palette="balanced-card"] .card-controls .control-row .value { color:var(--rh-experiment-ink); }
/* Owner correction: toggles are green in app settings and experiments. */
body:not([data-ui-palette="historical"]) :is(.switch input,input.switch):checked,
body:not([data-ui-palette="historical"]) .toggle input:checked + .toggle-track { background:var(--rh-toggle-on); border-color:var(--rh-toggle-on); }
body:not([data-ui-palette="historical"]) :is(.switch input,input.switch):checked:hover:enabled,
body:not([data-ui-palette="historical"]) .toggle:hover input:checked:enabled + .toggle-track { background:var(--rh-toggle-hover); border-color:var(--rh-toggle-hover); }
body:not([data-ui-palette="historical"]) :is(.switch input,input.switch):checked:active:enabled,
body:not([data-ui-palette="historical"]) .toggle:active input:checked:enabled + .toggle-track { background:var(--rh-toggle-pressed); border-color:var(--rh-toggle-pressed); }
/* Reset/Previous/Next remain neutral; experiment identity must not tint every action. */
body:is([data-ui-palette="experiment"],[data-ui-palette="balanced-card"]) .button.secondary:hover:enabled { background:#f6f8f4; border-color:#d2d9d2; color:#202723; }
body:is([data-ui-palette="experiment"],[data-ui-palette="balanced-card"]) .button.secondary:active:enabled { background:#e3e7e0; color:#202723; }
/* The focus ring remains blue even within an experiment. */
body[data-ui-palette="experiment"] :is(button,input,select,summary):focus-visible,
body[data-ui-palette="balanced-card"] .card-controls :is(button,input,select,summary):focus-visible { outline-color:var(--rh-focus); }

<script>
(() => {
const sidebar=document.getElementById('sidebar'), collapse=document.getElementById('collapse'), account=document.getElementById('account'), menu=document.getElementById('account-menu'), tooltip=document.getElementById('sidebar-tooltip'), separator=document.getElementById('resize-sidebar'), status=document.getElementById('preview-status');
let width=300,collapsed=false,timer=null,tipTarget=null,drag=null;
const announce=label=>{status.textContent=label+' selected in this local sidebar preview. No app action is performed.'};
function hideTip(){clearTimeout(timer);tooltip.hidden=true;if(tipTarget)tipTarget.removeAttribute('aria-describedby');tipTarget=null;}
function showTip(target,label){hideTip();timer=setTimeout(()=>{if(!label)return;tipTarget=target;tooltip.textContent=label;tooltip.hidden=false;target.setAttribute('aria-describedby','sidebar-tooltip');const box=target.getBoundingClientRect(),edge=sidebar.getBoundingClientRect().right;tooltip.style.left=Math.max(8,Math.min(edge+8,innerWidth-tooltip.offsetWidth-8))+'px';tooltip.style.top=Math.max(8,Math.min(box.top+(box.height-tooltip.offsetHeight)/2,innerHeight-tooltip.offsetHeight-8))+'px';},400)}
function positionMenu(){const edge=sidebar.getBoundingClientRect();menu.style.left=(collapsed?Math.min(edge.right+8,Math.max(10,innerWidth-270)):10)+'px';menu.style.top=(collapsed?8:58)+'px'}
function closeMenu(focus=false){menu.hidden=true;account.setAttribute('aria-expanded','false');if(focus)account.focus()}
function openMenu(){hideTip();positionMenu();menu.hidden=false;account.setAttribute('aria-expanded','true');menu.querySelector('[role=menuitem]').focus()}
account.onclick=()=>menu.hidden?openMenu():closeMenu(true);
account.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();openMenu()}};
menu.onkeydown=e=>{const items=[...menu.querySelectorAll('[role=menuitem]')],index=items.indexOf(document.activeElement);let next;if(e.key==='ArrowDown')next=(index+1)%items.length;if(e.key==='ArrowUp')next=(index+items.length-1)%items.length;if(e.key==='Home')next=0;if(e.key==='End')next=items.length-1;if(next!==undefined){e.preventDefault();items[next].focus()}if(e.key==='Tab'){closeMenu();if(e.shiftKey){e.preventDefault();account.focus()}else{e.preventDefault();collapse.focus()}}};
menu.querySelectorAll('[data-account-action]').forEach(b=>b.onclick=()=>{announce(b.dataset.accountAction);closeMenu(true)});
document.addEventListener('pointerdown',e=>{if(!menu.hidden&&!menu.contains(e.target)&&!account.contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideTip();if(!menu.hidden)closeMenu(true)}});
function setCollapsed(value){hideTip();closeMenu();collapsed=value;sidebar.classList.toggle('collapsed',value);collapse.setAttribute('aria-label',value?'Expand sidebar':'Collapse sidebar');collapse.setAttribute('aria-expanded',String(!value));collapse.querySelector('use').setAttribute('href',value?'#sidebar--sidebar-panel-left-open':'#sidebar--sidebar-panel-left-close');separator.tabIndex=value?-1:0;}
collapse.onclick=()=>setCollapsed(!collapsed);
const recentToggle=document.getElementById('recent-toggle');recentToggle.onclick=()=>{const open=recentToggle.getAttribute('aria-expanded')!=='true';recentToggle.setAttribute('aria-expanded',String(open));recentToggle.setAttribute('aria-label',open?'Collapse Recent':'Expand Recent');document.getElementById('recent-list').hidden=!open;hideTip()};
document.querySelectorAll('.sidebar-row').forEach(b=>{b.onclick=()=>{hideTip();closeMenu();document.querySelectorAll('.sidebar-row').forEach(n=>delete n.dataset.open);if(b.dataset.kind==='destination'){document.querySelectorAll('.sidebar-row[aria-current]').forEach(n=>n.removeAttribute('aria-current'));b.setAttribute('aria-current','page')}else b.dataset.open='true';announce(b.dataset.label)};});
document.querySelectorAll('.sidebar-row,#account,#collapse,#recent-toggle').forEach(b=>{const label=()=>{if(b.classList.contains('sidebar-row')){const text=b.querySelector('.row-label');return collapsed||text.scrollWidth>text.clientWidth?b.dataset.label:null}if(b===account)return collapsed?'Account menu':b.querySelector('.account-label').scrollWidth>b.querySelector('.account-label').clientWidth?'Yudhisteer Chintaram':null;return b.getAttribute('aria-label')};b.addEventListener('pointerenter',()=>showTip(b,label()));b.addEventListener('pointerleave',hideTip);b.addEventListener('focus',()=>{if(b.matches(':focus-visible'))showTip(b,label())});b.addEventListener('blur',hideTip);b.addEventListener('pointerdown',hideTip)});
function setWidth(next){width=Math.max(200,Math.min(400,next));sidebar.style.setProperty('--sidebar-width',width+'px');separator.setAttribute('aria-valuenow',String(Math.round(width)));hideTip();closeMenu();}
separator.onpointerdown=e=>{if(e.button!==0)return;drag={x:e.clientX,width};sidebar.classList.add('resizing');separator.setPointerCapture(e.pointerId);separator.focus();e.preventDefault()};
separator.onpointermove=e=>{if(drag)setWidth(drag.width+e.clientX-drag.x)};
function endResize(){drag=null;sidebar.classList.remove('resizing')};separator.onpointerup=endResize;separator.onpointercancel=endResize;separator.onlostpointercapture=endResize;
separator.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const step=e.shiftKey?40:10;setWidth(e.key==='Home'?200:e.key==='End'?400:width+(e.key==='ArrowLeft'?-step:step))};
window.addEventListener('resize',()=>{hideTip();if(!menu.hidden)positionMenu()});document.getElementById('sidebar-scroll').addEventListener('scroll',hideTip);
})();



(() => {
const $=id=>document.getElementById(id), sidebar=$('sidebar');
const panels={Search:$('search-panel'),Trash:$('trash-panel'),Notifications:$('notifications-panel'),Feedback:$('feedback-panel')};
const triggers={};let active=null,opener=null,highlight=0;let feedbackTimer=null;
const canvases=['Untitled canvas','Decision Trees and Random Forests'];
let deleted=['Feature Scaling Explorer','Forest Voting Explorer'];
const iconRefs={"i-Shapes":"#standards--i-Shapes","i-Trash2":"#standards--i-Trash2","sidebar-search":"#sidebar--sidebar-search"};
const svg=name=>'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="'+iconRefs[name]+'"></use></svg>';
Object.keys(panels).forEach(name=>{const b=document.querySelector('.sidebar-row[data-label="'+name+'"]');triggers[name]=b;b.setAttribute('aria-controls',panels[name].id);b.setAttribute('aria-expanded','false');b.setAttribute('aria-haspopup','dialog');});
const badge=document.createElement('span');badge.className='count-badge';badge.textContent='1';badge.setAttribute('aria-hidden','true');triggers.Notifications.append(badge);triggers.Notifications.setAttribute('aria-label','Notifications, 1 unread');
function position(){if(!active||!['Feedback','Notifications'].includes(active))return;const p=panels[active];const left=sidebar.getBoundingClientRect().right+12;p.style.left=(left+p.offsetWidth+12<=innerWidth?left:Math.max(12,innerWidth-p.offsetWidth-12))+'px';}
function close(focus=true){if(!active)return;const name=active,p=panels[name];active=null;if(p.tagName==='DIALOG'&&p.open)p.close();else p.hidden=true;triggers[name].setAttribute('aria-expanded','false');delete triggers[name].dataset.open;if(focus&&opener?.isConnected)opener.focus();}
function open(name){if(active===name){close();return;}close(false);$('account-menu').hidden=true;$('account').setAttribute('aria-expanded','false');$('sidebar-tooltip').hidden=true;active=name;opener=triggers[name];document.querySelectorAll('.sidebar-row').forEach(b=>delete b.dataset.open);opener.dataset.open='true';opener.setAttribute('aria-expanded','true');const p=panels[name];if(p.tagName==='DIALOG')p.showModal();else{p.hidden=false;position();}if(name==='Search'){highlight=0;$('search-query').value='';renderSearch();$('search-query').focus();}else if(name==='Feedback')$('feedback-text').focus();else p.querySelector('[data-close-surface]').focus();if(name==='Notifications'){badge.hidden=true;opener.setAttribute('aria-label','Notifications');}}
Object.entries(triggers).forEach(([name,b])=>b.addEventListener('click',()=>open(name)));
Object.values(panels).forEach(p=>{p.querySelector('[data-close-surface]').onclick=()=>close();p.addEventListener('cancel',e=>{e.preventDefault();close();});p.addEventListener('click',e=>{if(p.tagName!=='DIALOG'||e.target!==p)return;const r=p.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)close();});});
document.addEventListener('pointerdown',e=>{if(active&&panels[active].tagName!=='DIALOG'&&!panels[active].contains(e.target)&&!triggers[active].contains(e.target))close(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&active){e.preventDefault();close();return;}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='f'&&!e.target.closest('input,textarea,[contenteditable]')){e.preventDefault();open('Search');}if(!active||e.key!=='Tab')return;const p=panels[active];const items=[...p.querySelectorAll('button:not([disabled]),input,textarea,[tabindex="0"]')].filter(n=>n.getClientRects().length);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}});
window.addEventListener('resize',position);new ResizeObserver(position).observe(sidebar);
function hits(){return canvases.filter(t=>t.toLowerCase().includes($('search-query').value.trim().toLowerCase()));}
function pick(title){close();document.querySelectorAll('.sidebar-row[aria-current]').forEach(n=>n.removeAttribute('aria-current'));const row=[...document.querySelectorAll('.sidebar-row')].find(n=>n.dataset.label===title);if(row){row.setAttribute('aria-current','page');row.focus();}$('preview-status').textContent='Selected '+title+' in this local preview.';}
function renderSearch(){const list=$('search-results'),results=hits();highlight=Math.max(0,Math.min(highlight,results.length-1));list.replaceChildren();$('search-count').textContent=results.length+' results';if(!results.length){const empty=document.createElement('div');empty.className='empty-state';empty.innerHTML=svg('sidebar-search')+'<strong>No results</strong><span>Try another canvas title.</span>';list.append(empty);return;}results.forEach((title,i)=>{const b=document.createElement('button');b.type='button';b.className='menu-item search-result';b.dataset.active=String(i===highlight);b.innerHTML=svg('i-Shapes')+'<span class="result-title"></span><span class="result-kind">Canvas</span>';b.querySelector('.result-title').textContent=title;b.onclick=()=>pick(title);b.onkeydown=e=>{if(!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();highlight=(i+(e.key==='ArrowDown'?1:-1)+results.length)%results.length;renderSearch();list.children[highlight].focus();};list.append(b);});}
$('search-query').oninput=()=>{highlight=0;renderSearch();};$('search-query').onkeydown=e=>{const results=hits();if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();if(!results.length)return;highlight=e.key==='ArrowDown'?0:results.length-1;renderSearch();$('search-results').children[highlight].focus();}if(e.key==='Enter'&&results.length){e.preventDefault();pick(results[highlight]);}};
function renderTrash(){const list=$('trash-items');list.replaceChildren();if(!deleted.length){list.innerHTML='<div class="empty-state">'+svg('i-Trash2')+'<strong>Nothing in the trash.</strong><span>Deleted canvases will appear here.</span></div>';return;}deleted.forEach((title,i)=>{const row=document.createElement('div');row.className='trash-row';row.innerHTML=svg('i-Shapes')+'<div class="item-copy"><strong></strong><small>Canvas · Deleted '+(i?'yesterday':'2 hours ago')+'</small></div><button class="button secondary" type="button">Restore</button>';row.querySelector('strong').textContent=title;row.querySelector('button').setAttribute('aria-label','Restore '+title);row.querySelector('button').onclick=()=>{deleted=deleted.filter(t=>t!==title);canvases.push(title);$('restore-status').textContent=title+' restored.';renderTrash();($('trash-items').querySelector('button')||panels.Trash.querySelector('[data-close-surface]')).focus();};list.append(row);});}renderTrash();
$('clear-notifications').onclick=()=>{$('notification-items').hidden=true;$('notifications-empty').hidden=false;$('clear-notifications').hidden=true;panels.Notifications.querySelector('[data-close-surface]').focus();badge.hidden=true;$('preview-status').textContent='Notifications cleared.';};
document.querySelectorAll('[data-feedback-kind]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-feedback-kind]').forEach(n=>n.setAttribute('aria-pressed',String(n===b)));const bug=b.dataset.feedbackKind==='bug';$('feedback-label').textContent=bug?'What went wrong?':'Your idea';$('feedback-text').placeholder=bug?'What happened, and what did you expect?':'What would you like Rabbit Hole to do?';$('feedback-status').textContent='';$('feedback-text').focus();});
$('feedback-text').oninput=()=>{$('feedback-submit').disabled=!$('feedback-text').value.trim();$('feedback-status').textContent='';};
let feedbackSending=false,feedbackSuccessTimer=null;
const feedbackRow=triggers.Feedback;
const feedbackIcon=feedbackRow.querySelector('use');
const originalFeedbackIcon=feedbackIcon.getAttribute('href');
function resetFeedbackConfirmation(){
 clearTimeout(feedbackSuccessTimer);
 feedbackIcon.setAttribute('href',originalFeedbackIcon);
 feedbackRow.style.removeProperty('color');
 feedbackRow.dataset.label='Feedback';
 feedbackRow.setAttribute('aria-label','Feedback');
}
feedbackRow.addEventListener('click',resetFeedbackConfirmation);
$('feedback-form').onsubmit=e=>{
 e.preventDefault();
 if(feedbackSending||!$('feedback-text').value.trim())return;
 feedbackSending=true;resetFeedbackConfirmation();
 $('feedback-submit').disabled=true;
 $('feedback-submit').textContent='Submitting…';
 $('feedback-text').disabled=true;
 document.querySelectorAll('[data-feedback-kind]').forEach(b=>b.disabled=true);
 $('feedback-form').setAttribute('aria-busy','true');
 // Local success simulation. Production uses FeedbackButton.jsx API and error handling.
 feedbackTimer=setTimeout(()=>{
  feedbackSending=false;
  $('feedback-form').removeAttribute('aria-busy');
  $('feedback-text').disabled=false;
  $('feedback-text').value='';
  document.querySelectorAll('[data-feedback-kind]').forEach(b=>b.disabled=false);
  $('feedback-submit').textContent='Submit';
  $('feedback-submit').disabled=true;
  $('feedback-status').textContent='';
  if(active==='Feedback')close();
  feedbackIcon.setAttribute('href','#standards--i-Check');
  feedbackRow.style.setProperty('color','var(--green)');
  feedbackRow.dataset.label='Sent, thank you';
  feedbackRow.setAttribute('aria-label','Feedback sent, thank you');
  $('preview-status').textContent='Feedback sent, thank you.';
  feedbackSuccessTimer=setTimeout(resetFeedbackConfirmation,2500);
 },500);
};
const initial=document.querySelector('[data-sidebar-initial]')?.dataset.sidebarInitial;
if(initial&&triggers[initial])triggers[initial].click();
})();

</script>

<article class="specimen" id="o-tooltip">
  <h3>Tooltip and icon label</h3>
  <p class="muted">Use a brief action label. Keep the icon button’s accessible name available before the tooltip appears.</p>
  <div class="sample-row" style="padding-top:38px">
    <span class="tooltip-trigger tooltip-preview">
      <button class="icon-button" type="button" aria-label="Pin card" aria-describedby="o-pin-hint" data-demo-state="hover"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-Pin"></use></svg></button>
      <span class="tooltip" id="o-pin-hint" role="tooltip">Pin card</span>
    </span>
    <span class="tooltip-trigger">
      <button class="icon-button" type="button" aria-label="More actions" aria-describedby="o-more-hint" data-demo-state="focus"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-Ellipsis"></use></svg></button>
      <span class="tooltip" id="o-more-hint" role="tooltip">More actions</span>
    </span>
  </div>
</article>

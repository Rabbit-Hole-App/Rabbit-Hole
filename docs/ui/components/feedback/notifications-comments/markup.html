<article class="specimen" id="o-notifications">
  <h3>Notifications and comments</h3>
  <p class="muted">Use a label or count as well as color to distinguish unread items. Read items use the resting surface and a Read label.</p>
  <div class="sample-row">
    <button class="icon-button" type="button" aria-label="Notifications, 1 unread"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-Bell"></use></svg></button>
    <button class="button secondary" type="button" aria-label="Open comments, 2 comments"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-MessageCircle"></use></svg>Comments <span class="pill neutral" aria-hidden="true">2</span></button>
  </div>
  <div class="notification" data-unread="true">
    <svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-MessageSquare"></use></svg>
    <div><strong>New comment</strong><p class="muted">A collaborator replied to your note.</p></div>
    <span class="pill neutral">Unread</span>
    <button class="button quiet" type="button"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-Reply"></use></svg>Reply</button>
  </div>
  <div class="notification" data-unread="false">
    <svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-CircleCheck"></use></svg>
    <div><strong>Roadmap updated</strong><p class="muted">A section is ready to review.</p></div>
    <span class="muted">Read</span>
  </div>
</article>

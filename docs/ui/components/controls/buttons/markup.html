<article class="specimen" id="f-buttons">
  <h3>Button hierarchy</h3>
  <p class="muted">Give the main action the strongest fill. Use outlined buttons for alternatives, quiet buttons for Cancel, and the danger style for a destructive action.</p>
  <div class="sample-row" role="group" aria-label="Button hierarchy examples">
    <button class="button primary" type="button">Start a rabbit hole</button>
    <button class="button secondary" type="button"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-Pencil"></use></svg>Edit card</button>
    <button class="button quiet" type="button">Cancel</button>
    <button class="button danger" type="button"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-Trash2"></use></svg>Move to Trash</button>
  </div>
  <div class="sample-row" role="group" aria-label="Button state examples">
    <button class="button primary" type="button" data-demo-state="hover">Hover</button>
    <button class="button primary" type="button" data-demo-state="pressed">Pressed</button>
    <button class="button primary" type="button" data-demo-state="focus">Keyboard focus</button>
    <button class="button primary" type="button" disabled>Disabled</button>
    <button class="button secondary" type="button" disabled>Save</button>
  </div>
</article>

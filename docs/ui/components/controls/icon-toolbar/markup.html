<article class="specimen" id="f-toolbar">
  <h3>Icon toolbar</h3>
  <p class="muted">Use the existing glyphs with one hit area, one radius and one state system. Mark the current tool as selected and name every icon-only button.</p>
  <div class="sample-row" role="group" aria-label="Canvas tool specimens">
    <button class="icon-button" type="button" aria-label="Select and move" aria-pressed="true" data-demo-state="selected" title="Select and move"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-MousePointer2"></use></svg></button>
    <button class="icon-button" type="button" aria-label="Pan" aria-pressed="false" title="Pan"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-Hand"></use></svg></button>
    <button class="icon-button" type="button" aria-label="Draw" aria-pressed="false" title="Draw" data-demo-state="hover"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-Pencil"></use></svg></button>
    <button class="icon-button" type="button" aria-label="Highlight" aria-pressed="false" title="Highlight"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-Highlighter"></use></svg></button>
    <button class="icon-button" type="button" aria-label="Add text" title="Add text"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-Type"></use></svg></button>
    <button class="icon-button" type="button" aria-label="Add sticky note" title="Add sticky note"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-StickyNote"></use></svg></button>
    <button class="icon-button" type="button" aria-label="Add equation" title="Add equation"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-Sigma"></use></svg></button>
  </div>
  <div class="sample-row" role="group" aria-label="Card action specimens">
    <button class="icon-button" type="button" aria-label="Comments" title="Comments" data-demo-state="focus"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-MessageCircle"></use></svg></button>
    <button class="icon-button" type="button" aria-label="Notifications" title="Notifications"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-Bell"></use></svg></button>
    <button class="icon-button" type="button" aria-label="More actions" title="More actions"><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-Ellipsis"></use></svg></button>
    <button class="icon-button" type="button" aria-label="Trash" title="Trash" disabled><svg class="icon" viewbox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-Trash2"></use></svg></button>
  </div>
</article>

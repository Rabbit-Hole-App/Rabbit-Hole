
<div class="rh-composer-example" style="min-width:0">
<article class="teaching-card rh-composer" id="rh-composer" aria-labelledby="rh-composer-title">
  <header class="card-header"><h3 class="card-title" id="rh-composer-title">Chat composer</h3></header>
  <form class="rh-form" id="rh-composer-form">
    <div class="card-body" role="region" aria-label="Chat composer content" tabindex="0">
      <div>
        <label class="rh-input-label" for="rh-message">Message</label>
        <textarea class="rh-field" id="rh-message" rows="2" placeholder="Ask a question"></textarea>
      </div>
      <div class="rh-context" role="group" aria-label="Context">
        <span class="pill">This canvas</span>
        <span class="pill"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="../../../icons/source-headers.svg#i-FileText"/></svg>lesson.md</span>
      </div>
      <p class="rh-depth-help" id="rh-depth-help">A balanced explanation.</p>
      <p class="rh-status" id="rh-composer-status" role="status">Type a message to enable Send.</p>
    </div>
    <div class="rh-footer">
      <div class="rh-actions" role="group" aria-label="Composer controls">
        <button type="button" class="button secondary" data-rh-demo="Attach control preview."><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="../../../icons/source-headers.svg#i-Plus"/></svg>Attach</button>
        <label class="rh-depth">Depth <select class="rh-field" id="rh-depth" aria-describedby="rh-depth-help"><option>Overview</option><option selected>Standard</option><option>Deep</option></select></label>
        <button type="button" class="icon-button" aria-label="Voice input" title="Voice input" data-rh-demo="Voice control preview."><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="../../../icons/source-headers.svg#i-Mic"/></svg></button>
        <button type="submit" class="button primary rh-send" id="rh-send" disabled><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="../../../icons/source-headers.svg#i-ArrowUp"/></svg><span>Send</span></button>
      </div>
      <button type="button" class="resize-handle" aria-describedby="rh-resize-guide" aria-label="Resize chat composer" title="Resize card">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 12 12 3M8 12 12 8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
  </form>
</article>
<p class="rh-grip-guide" id="rh-resize-guide">Drag the bottom-right grip or use its arrow keys to resize. Hold Shift for larger steps.</p>
</div>

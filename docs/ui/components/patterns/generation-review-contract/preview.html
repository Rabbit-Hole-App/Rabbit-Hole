<body data-ui-palette="balanced-card"><div class="catalog-note"><a href="../../../index.html">UI catalog</a> · <a href="README.md">Component mapping</a> · <a href="https://github.com/Rabbit-Hole-App/Rabbit-Hole/blob/aa2cfb19a2ca551f2c99aad5cbbacf968c7b9f56/docs/features/explain-on-canvas/handoff/ui/templates/generation-review-shell.html">Source</a><p>flow reference / current shell — Host-populated generation review slots. Not an autonomous demo. Updated to the shared warm card shell and visible card controls; archived source retains provenance.</p></div>
<div class="catalog-preview"><!--
Shared generation-review markup for the approved ../08-interactive-review.html.
Use its review styles with the existing GenerationProposalCard and command schema.

Clone the shell per proposal. Fill command-label from the shared command label
and title from the proposal. Give the title and any visual caption unique IDs
and wire their aria-labelledby relationships before mounting.

For a visual preview, show intro, visual and takeaway in that order. Insert the
rendered TutorDiagram or image into visual-content. For a text-only proposal,
show its existing description in summary. Show the settings slot only for
commands whose review includes editable settings.

Bind Generate and Edit to the existing proposal actions and action state.
-->
<template id="generation-review-shell">
  <article class="review" data-review-shell>
    <header class="review-head">
      <span class="kind" data-slot="command-label"></span>
      <h1 data-slot="title"></h1>
    </header>

    <p data-slot="summary" hidden></p>
    <p data-slot="intro" hidden></p>
    <figure class="preview" data-slot="visual" hidden>
      <figcaption data-slot="visual-title" hidden></figcaption>
      <div data-slot="visual-content"></div>
    </figure>
    <p data-slot="takeaway" hidden></p>
    <div data-slot="settings" hidden></div>

    <footer class="actions">
      <button type="button" class="primary" data-action="generate">Generate</button>
      <button type="button" data-action="edit">Edit</button>
    </footer>
  </article>
</template>
</div>

<script src="../../../scripts/resize.js"></script>
<script src="../../../scripts/review-corrections.js"></script>
</body></html>

<template id="card-template">
  <article class="card"><header class="card-header"><span class="badge" data-slot="pill"></span><span class="slot-tag" data-slot="mode"></span></header>
  <h3 data-slot="title"></h3><div class="card-copy"><p data-slot="concept"></p><p data-slot="instruction" hidden></p></div>
  <p class="why" data-slot="why" hidden><strong>Why</strong><span data-slot="reason"></span></p>
  <figure class="scene" data-slot="scene"></figure><div class="card-timeline" data-slot="timeline"></div><div class="card-controls" data-slot="controls" hidden></div></article>
</template>

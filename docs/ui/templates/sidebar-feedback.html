<section class="popover ui-popover" id="feedback-panel" role="dialog" aria-labelledby="feedback-title" hidden>
<div class="panel-heading"><h2 id="feedback-title">Send feedback</h2><button type="button" class="icon-button quiet" data-close-surface aria-label="Close send feedback"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><use href="../../../icons/standards.svg#i-X"></use></svg></button></div><form id="feedback-form" class="panel-body panel-stack"><div class="feedback-types" role="group" aria-label="Feedback type"><button type="button" class="button secondary" data-feedback-kind="bug" aria-pressed="true">Report a bug</button><button type="button" class="button secondary" data-feedback-kind="idea" aria-pressed="false">Suggest a feature</button></div><label class="field" for="feedback-text"><span id="feedback-label">What went wrong?</span><textarea id="feedback-text" class="control" rows="5" maxlength="2000" required placeholder="What happened, and what did you expect?"></textarea></label><div class="panel-actions"><button type="submit" class="button primary" id="feedback-submit" disabled>Submit</button></div><p class="local-status" id="feedback-status" role="status"></p></form></section>

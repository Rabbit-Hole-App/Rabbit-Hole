<template id="home-main-template"><main class="home-main" id="home-main" aria-label="Home"><div class="home-content">
<header class="home-toolbar">
  <p class="home-empty" id="home-empty" hidden>No canvases yet.</p>
  <label class="home-size" for="home-size">Card size<input id="home-size" type="range" min="0" max="3" step="1" value="3" aria-label="Card size" aria-valuetext="Large"><output id="home-size-value" for="home-size">Large</output></label>
  <button class="button primary" type="button" id="home-start">Start a rabbit hole</button>
</header>
<div id="home-loading" role="status" hidden><span class="sr-only">Loading canvases</span><div class="home-loading-grid" aria-hidden="true"><div class="skeleton spacious"><span class="skeleton-line" style="width:58%;height:22px"></span><span class="skeleton-line" style="width:82%"></span><div class="skeleton-visual"></div></div><div class="skeleton spacious"><span class="skeleton-line" style="width:45%;height:22px"></span><span class="skeleton-line" style="width:72%"></span><div class="skeleton-visual"></div></div></div></div>
<div id="home-error" class="home-recovery" hidden><p role="alert">Couldn't load your canvases.</p><button type="button" class="button secondary" id="home-retry">Retry</button></div>
<div id="home-sections"><section class="home-section" id="home-continue" aria-labelledby="continue-title"><h1 class="home-section-title" id="continue-title">Continue learning</h1><div class="home-grid" id="home-continue-grid"></div></section><section class="home-section" id="home-recent" aria-labelledby="recent-title"><h2 class="home-section-title" id="recent-title">Recent</h2><div class="home-grid" id="home-recent-grid"></div></section></div>

</div></main></template>

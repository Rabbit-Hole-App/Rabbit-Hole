<dialog class="dialog purchase-dialog" id="purchase-dialog" aria-labelledby="purchase-title"><h2 id="purchase-title">Buy credits</h2><div class="settings-choice" role="group" aria-label="Amount in USD" data-choice="amount"><button type="button" class="button secondary" data-value="20" aria-pressed="true">$20</button><button type="button" class="button secondary" data-value="50" aria-pressed="false">$50</button><button type="button" class="button secondary" data-value="100" aria-pressed="false">$100</button><button type="button" class="button secondary" data-value="other" aria-pressed="false">Other amount</button></div><label class="field" id="other-amount-label" for="other-amount" hidden>Amount in USD<input class="control" id="other-amount" inputmode="decimal" aria-describedby="amount-error" placeholder="0.00"></label><p class="field-error" id="amount-error" hidden>Enter a positive amount with up to two decimal places.</p><p class="purchase-total" id="purchase-total">Total: $20.00</p><p class="purchase-notice" id="purchase-notice" role="status" hidden></p><div class="purchase-actions"><button type="button" class="button primary" id="purchase-buy">Buy</button><button type="button" class="button secondary" id="purchase-cancel">Cancel</button></div></dialog>

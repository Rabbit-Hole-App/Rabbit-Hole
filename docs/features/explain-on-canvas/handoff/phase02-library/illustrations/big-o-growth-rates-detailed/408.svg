<svg xmlns="http://www.w3.org/2000/svg" width="420" height="601" viewBox="0 0 420 601" role="img" aria-label="Big-O growth rates
Input size $n$: 1 to 10
Example work: 0 to 100
$O(1)$ (line): (1, 1); (2, 1); (3, 1); (4, 1); (5, 1); (6, 1); (7, 1); (8, 1); (9, 1); (10, 1)

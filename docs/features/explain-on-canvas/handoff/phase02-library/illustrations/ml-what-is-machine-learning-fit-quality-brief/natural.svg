<svg xmlns="http://www.w3.org/2000/svg" width="356" height="257" viewBox="0 0 356 257" role="img" aria-label="Compare fit quality
Underfitting: Too rigid; misses the bend
Good fit: Follows the trend, not every fluctuation
Overfitting: Chases samples; may miss unseen points
Illustrative. Training fit alone cannot establish generalization." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="comparison"><title>Compare fit quality</title><rect x="0.5" y="0.5" width="355" height="256" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="178" y="22.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="178" y="28.28">Compare fit quality</tspan></text><g transform="translate(0 39)"><polyline points="121,14 121,158" fill="none" stroke="var(--color-ink-2, #665951)" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"></polyline><polyline points="235,14 235,158" fill="none" stroke="var(--color-ink-2, #665951)" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"></polyline><rect x="12" y="12" width="104" height="34" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="64" y="29" fill="#32211c" font-size="11" font-weight="700" text-anchor="middle"><tspan x="64" y="32.74">Underfitting</tspan></text><rect x="126" y="12" width="104" height="34" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="178" y="29" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="178" y="33.76">Good fit</tspan></text><rect x="240" y="12" width="104" height="34" rx="7" fill="#F58371" stroke="#32211c" stroke-width="1.5"></rect><text x="292" y="29" fill="#32211c" font-size="13" font-weight="700" text-anchor="middle"><tspan x="292" y="33.42">Overfitting</tspan></text><rect x="12" y="54" width="104" height="104" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="64" y="106" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="64" y="92.76">Too rigid;</tspan><tspan x="64" y="110.76">misses</tspan><tspan x="64" y="128.76">the bend</tspan></text><rect x="126" y="54" width="104" height="104" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="178" y="106" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="178" y="84.92">Follows the</tspan><tspan x="178" y="101.92">trend, not</tspan><tspan x="178" y="118.92">every</tspan><tspan x="178" y="135.92">fluctuation</tspan></text><rect x="240" y="54" width="104" height="104" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="292" y="106" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="292" y="74.76">Chases</tspan><tspan x="292" y="92.76">samples;</tspan><tspan x="292" y="110.76">may miss</tspan><tspan x="292" y="128.76">unseen</tspan><tspan x="292" y="146.76">points</tspan></text></g><text x="178" y="231" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="178" y="226.92">Illustrative. Training fit alone cannot</tspan><tspan x="178" y="243.92">establish generalization.</tspan></text></svg>

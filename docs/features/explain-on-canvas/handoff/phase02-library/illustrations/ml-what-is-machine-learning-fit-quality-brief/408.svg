<svg xmlns="http://www.w3.org/2000/svg" width="408" height="257" viewBox="0 0 408 257" role="img" aria-label="Compare fit quality
Underfitting: Too rigid; misses the bend
Good fit: Follows the trend, not every fluctuation
Overfitting: Chases samples; may miss unseen points
Illustrative. Training fit alone cannot establish generalization." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="comparison"><title>Compare fit quality</title><rect x="0.5" y="0.5" width="407" height="256" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="22.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">Compare fit quality</tspan></text><g transform="translate(0 39)"><polyline points="138.33333333333331,14 138.33333333333331,158" fill="none" stroke="var(--color-ink-2, #665951)" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"></polyline><polyline points="269.66666666666663,14 269.66666666666663,158" fill="none" stroke="var(--color-ink-2, #665951)" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"></polyline><rect x="12" y="12" width="121.33333333333333" height="34" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="72.66666666666666" y="29" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="72.66666666666666" y="33.76">Underfitting</tspan></text><rect x="143.33333333333331" y="12" width="121.33333333333333" height="34" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="203.99999999999997" y="29" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="203.99999999999997" y="33.76">Good fit</tspan></text><rect x="274.66666666666663" y="12" width="121.33333333333333" height="34" rx="7" fill="#F58371" stroke="#32211c" stroke-width="1.5"></rect><text x="335.3333333333333" y="29" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="335.3333333333333" y="33.76">Overfitting</tspan></text><rect x="12" y="54" width="121.33333333333333" height="104" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="72.66666666666666" y="106" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="72.66666666666666" y="92.76">Too rigid;</tspan><tspan x="72.66666666666666" y="110.76">misses the</tspan><tspan x="72.66666666666666" y="128.76">bend</tspan></text><rect x="143.33333333333331" y="54" width="121.33333333333333" height="104" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="203.99999999999997" y="106" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="203.99999999999997" y="83.76">Follows the</tspan><tspan x="203.99999999999997" y="101.76">trend, not</tspan><tspan x="203.99999999999997" y="119.76">every</tspan><tspan x="203.99999999999997" y="137.76">fluctuation</tspan></text><rect x="274.66666666666663" y="54" width="121.33333333333333" height="104" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="335.3333333333333" y="106" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="335.3333333333333" y="74.76">Chases</tspan><tspan x="335.3333333333333" y="92.76">samples;</tspan><tspan x="335.3333333333333" y="110.76">may miss</tspan><tspan x="335.3333333333333" y="128.76">unseen</tspan><tspan x="335.3333333333333" y="146.76">points</tspan></text></g><text x="204" y="231" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="226.92">Illustrative. Training fit alone cannot establish</tspan><tspan x="204" y="243.92">generalization.</tspan></text></svg>

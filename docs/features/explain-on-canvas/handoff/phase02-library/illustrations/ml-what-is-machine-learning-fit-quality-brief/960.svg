<svg xmlns="http://www.w3.org/2000/svg" width="720" height="186" viewBox="0 0 720 186" role="img" aria-label="Compare fit quality
Underfitting: Too rigid; misses the bend
Good fit: Follows the trend, not every fluctuation
Overfitting: Chases samples; may miss unseen points
Illustrative. Training fit alone cannot establish generalization." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="comparison"><title>Compare fit quality</title><rect x="0.5" y="0.5" width="719" height="185" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="360" y="22.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="360" y="28.28">Compare fit quality</tspan></text><g transform="translate(0 39)"><polyline points="242.33333333333334,14 242.33333333333334,104" fill="none" stroke="var(--color-ink-2, #665951)" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"></polyline><polyline points="477.6666666666667,14 477.6666666666667,104" fill="none" stroke="var(--color-ink-2, #665951)" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"></polyline><rect x="12" y="12" width="225.33333333333334" height="34" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="124.66666666666667" y="29" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="124.66666666666667" y="33.76">Underfitting</tspan></text><rect x="247.33333333333334" y="12" width="225.33333333333334" height="34" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="360" y="29" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="360" y="33.76">Good fit</tspan></text><rect x="482.6666666666667" y="12" width="225.33333333333334" height="34" rx="7" fill="#F58371" stroke="#32211c" stroke-width="1.5"></rect><text x="595.3333333333334" y="29" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="595.3333333333334" y="33.76">Overfitting</tspan></text><rect x="12" y="54" width="225.33333333333334" height="50" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="124.66666666666667" y="79" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="124.66666666666667" y="74.76">Too rigid; misses the</tspan><tspan x="124.66666666666667" y="92.76">bend</tspan></text><rect x="247.33333333333334" y="54" width="225.33333333333334" height="50" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="360" y="79" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="360" y="74.76">Follows the trend, not</tspan><tspan x="360" y="92.76">every fluctuation</tspan></text><rect x="482.6666666666667" y="54" width="225.33333333333334" height="50" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="595.3333333333334" y="79" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="595.3333333333334" y="74.76">Chases samples; may</tspan><tspan x="595.3333333333334" y="92.76">miss unseen points</tspan></text></g><text x="360" y="168.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="360" y="172.92">Illustrative. Training fit alone cannot establish generalization.</tspan></text></svg>

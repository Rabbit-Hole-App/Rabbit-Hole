" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">b</span></span></span></span></span></div></foreignObject></g></g><g data-explanation-skip=""><text x="142.5" y="32" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="142.5" y="36.76">Predict ŷ=wx+b</tspan></text></g></switch><g><polyline points="142.5,52 142.5,68" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="142.5,68 139.1,61 145.9,61" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="72" width="261" height="50" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="142.5" y="97" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="142.5" y="92.76">Compute mean squared</tspan><tspan x="142.5" y="110.76">error</tspan></text><g><polyline points="142.5,122 142.5,138" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="142.5,138 139.1,131 145.9,131" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="142" width="261" height="40" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="142.5" y="162" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="142.5" y="166.76">Compute cost gradients</tspan></text><g><polyline points="142.5,182 142.5,198" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="142.5,198 139.1,191 145.9,191" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="202" width="261" height="50" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="142.5" y="227" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="142.5" y="222.76">Update weight and</tspan><tspan x="142.5" y="240.76">intercept</tspan></text><g><polyline points="142.5,252 142.5,268" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="142.5,268 139.1,261 145.9,261" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="272" width="261" height="40" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="142.5" y="292" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="142.5" y="296.76">Check cost; stop if low</tspan></text><g><polyline points="273,292 298,292 298,32 277,32" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="277,32 284,28.6 284,35.4" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><text x="160" y="415.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="402.92">Illustrative loop. If cost is high,</tspan><tspan x="160" y="419.92">repeat; if low, stop. A low cost need</tspan><tspan x="160" y="436.92">not be the exact minimum.</tspan></text></svg>

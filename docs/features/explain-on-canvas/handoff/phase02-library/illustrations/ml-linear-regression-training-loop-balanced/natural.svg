<svg xmlns="http://www.w3.org/2000/svg" width="320" height="467" viewBox="0 0 320 467" role="img" aria-label="Repeat until the stopping test passes
Compute predictions → Compute squared-error cost → Compute gradients → Update weight and intercept → Check stopping tolerance → Compute predictions
Illustrative loop. Exit when the stopping test passes; otherwise repeat. Low cost alone does not certify optimality." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="cycle"><title>Repeat until the stopping test passes</title><rect x="0.5" y="0.5" width="319" height="466" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="160" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="160" y="28.28">Repeat until the stopping</tspan><tspan x="160" y="50.28">test passes</tspan></text><g transform="translate(0 61)"><rect x="12" y="12" width="261" height="40" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="142.5" y="32" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="142.5" y="36.76">Compute predictions</tspan></text><g><polyline points="142.5,52 142.5,68" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="142.5,68 139.1,61 145.9,61" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="72" width="261" height="50" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="142.5" y="97" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="142.5" y="92.76">Compute squared-error</tspan><tspan x="142.5" y="110.76">cost</tspan></text><g><polyline points="142.5,122 142.5,138" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="142.5,138 139.1,131 145.9,131" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="142" width="261" height="40" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="142.5" y="162" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="142.5" y="166.76">Compute gradients</tspan></text><g><polyline points="142.5,182 142.5,198" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="142.5,198 139.1,191 145.9,191" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="202" width="261" height="50" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="142.5" y="227" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="142.5" y="222.76">Update weight and</tspan><tspan x="142.5" y="240.76">intercept</tspan></text><g><polyline points="142.5,252 142.5,268" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="142.5,268 139.1,261 145.9,261" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="272" width="261" height="40" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="142.5" y="292" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="142.5" y="296.76">Check stopping tolerance</tspan></text><g><polyline points="273,292 298,292 298,32 277,32" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="277,32 284,28.6 284,35.4" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><text x="160" y="424" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="402.92">Illustrative loop. Exit when the</tspan><tspan x="160" y="419.92">stopping test passes; otherwise</tspan><tspan x="160" y="436.92">repeat. Low cost alone does not</tspan><tspan x="160" y="453.92">certify optimality.</tspan></text></svg>

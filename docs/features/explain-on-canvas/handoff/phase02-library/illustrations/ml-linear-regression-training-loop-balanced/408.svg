<svg xmlns="http://www.w3.org/2000/svg" width="408" height="430" viewBox="0 0 408 430" role="img" aria-label="Repeat until the stopping test passes
Compute predictions → Compute squared-error cost → Compute gradients → Update weight and intercept → Check stopping tolerance → Compute predictions
Illustrative loop. Exit when the stopping test passes; otherwise repeat. Low cost alone does not certify optimality." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="cycle"><title>Repeat until the stopping test passes</title><rect x="0.5" y="0.5" width="407" height="429" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">Repeat until the stopping test</tspan><tspan x="204" y="50.28">passes</tspan></text><g transform="translate(0 61)"><rect x="12" y="12" width="349" height="40" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="186.5" y="32" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="186.5" y="36.76">Compute predictions</tspan></text><g><polyline points="186.5,52 186.5,68" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="186.5,68 183.1,61 189.9,61" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="72" width="349" height="40" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="186.5" y="92" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="186.5" y="96.76">Compute squared-error cost</tspan></text><g><polyline points="186.5,112 186.5,128" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="186.5,128 183.1,121 189.9,121" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="132" width="349" height="40" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="186.5" y="152" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="186.5" y="156.76">Compute gradients</tspan></text><g><polyline points="186.5,172 186.5,188" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="186.5,188 183.1,181 189.9,181" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="192" width="349" height="40" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="186.5" y="212" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="186.5" y="216.76">Update weight and intercept</tspan></text><g><polyline points="186.5,232 186.5,248" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="186.5,248 183.1,241 189.9,241" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="252" width="349" height="40" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="186.5" y="272" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="186.5" y="276.76">Check stopping tolerance</tspan></text><g><polyline points="361,272 386,272 386,32 365,32" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="365,32 372,28.6 372,35.4" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><text x="204" y="395.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="382.92">Illustrative loop. Exit when the stopping test</tspan><tspan x="204" y="399.92">passes; otherwise repeat. Low cost alone does</tspan><tspan x="204" y="416.92">not certify optimality.</tspan></text></svg>

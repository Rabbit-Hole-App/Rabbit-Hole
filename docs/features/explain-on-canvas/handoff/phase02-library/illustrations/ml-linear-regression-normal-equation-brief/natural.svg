<svg xmlns="http://www.w3.org/2000/svg" width="320" height="329" viewBox="0 0 320 329" role="img" aria-label="Direct solve or iterative updates?
Normal equation: Use a direct solve when the feature matrix is manageable.
Gradient descent: Use iterative updates for very large or streaming data.
Choose by feature count, memory and data access, not by an assumption that iterative fitting is a different regression model." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="comparison"><title>Direct solve or iterative updates?</title><rect x="0.5" y="0.5" width="319" height="328" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="160" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="160" y="28.28">Direct solve or iterative</tspan><tspan x="160" y="50.28">updates?</tspan></text><g transform="translate(0 61)"><polyline points="160,14 160,174" fill="none" stroke="var(--color-ink-2, #665951)" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"></polyline><rect x="12" y="12" width="143" height="50" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="83.5" y="37" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="83.5" y="32.76">Normal</tspan><tspan x="83.5" y="50.76">equation</tspan></text><rect x="165" y="12" width="143" height="50" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="236.5" y="37" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="236.5" y="32.76">Gradient</tspan><tspan x="236.5" y="50.76">descent</tspan></text><rect x="12" y="70" width="143" height="104" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="83.5" y="122" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="83.5" y="99.76">Use a direct</tspan><tspan x="83.5" y="117.76">solve when the</tspan><tspan x="83.5" y="135.76">feature matrix</tspan><tspan x="83.5" y="153.76">is manageable.</tspan></text><rect x="165" y="70" width="143" height="104" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="236.5" y="122" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="236.5" y="90.76">Use iterative</tspan><tspan x="236.5" y="108.76">updates for</tspan><tspan x="236.5" y="126.76">very large or</tspan><tspan x="236.5" y="144.76">streaming</tspan><tspan x="236.5" y="162.76">data.</tspan></text></g><text x="160" y="286" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="264.92">Choose by feature count, memory</tspan><tspan x="160" y="281.92">and data access, not by an</tspan><tspan x="160" y="298.92">assumption that iterative fitting is</tspan><tspan x="160" y="315.92">a different regression model.</tspan></text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="320" height="538" viewBox="0 0 320 538" role="img" aria-label="Supplied rules versus learned rules
Traditional programming: Rules and data are inputs; Program applies the rules; Output is produced
Reverse what is supplied and learned
Machine learning: Data and expected outputs are inputs; Learning algorithm fits a model; Model stores learned rules as parameters

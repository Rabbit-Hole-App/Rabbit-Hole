uts</tspan></text><rect x="375" y="102" width="333" height="52" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="385" y="128" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="start"><tspan x="385" y="123.76">Data and expected outputs are</tspan><tspan x="385" y="141.76">inputs</tspan></text><rect x="12" y="162" width="333" height="34" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="22" y="179" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="start"><tspan x="22" y="183.76">Program applies the rules</tspan></text><rect x="375" y="162" width="333" height="34" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="385" y="179" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="start"><tspan x="385" y="183.76">Learning algorithm fits a model</tspan></text><rect x="12" y="204" width="333" height="52" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="22" y="230" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="start"><tspan x="22" y="234.76">Output is produced</tspan></text><rect x="375" y="204" width="333" height="52" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="385" y="230" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="start"><tspan x="385" y="225.76">Model stores learned rules as</tspan><tspan x="385" y="243.76">parameters</tspan></text></g><text x="360" y="320.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="360" y="324.92">Illustrative: rules enter a program but emerge from learning as model parameters.</tspan></text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="320" height="697" viewBox="0 0 320 697" role="img" aria-label="Factorial of 3 on the call stack
1. Push the frame for factorial of 3 — Suspend $F(3)$ until $F(2)$ returns.
2. Push the frame for factorial of 2 — Suspend $F(2)$ until $F(1)$ returns.
3. Push the base case for factorial of 1 — Base case $F(1)=1$. No recursive call.
4. Pop the frame for 1 and return 1 — Resume $F(2)$ with the value 1.
5. Pop the frame for 2 and return 2 — Compute $F(2)=2\times 1=2$ and resume $F(3)$.
6. Pop the frame for 3 and return 6 — Compute $F(3)=3\times 2=6$ and return to the caller.
For $n&gt;1$, $F(n)=nF(n-1)$. The base case $F(1)=1$ starts the returns in the reverse order of the calls." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="layers"><title>Factorial of 3 on the call stack</title><rect x="0.5" y="0.5" width="319" height="696" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="160" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="160" y="28.28">Factorial of 3 on the call</tspan><tspan x="160" y="50.28">stack</tspan></text><g transform="translate(0 61)"><rect x="12" y="12" width="296" height="74" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="38" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="33.76">1. Push the frame for factorial</tspan><tspan x="160" y="51.76">of 3</tspan></text><g><foreignObject x="32.5" y="61" width="255" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">Suspend <span data-tutor-tex="$F(3)$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">3</span><span class="mclose">)</span></span></span></span></span> until <span data-tutor-tex="$F(2)$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">2</span><span class="mclose">)</span></span></span></span></span> returns.</div></foreignObject></g><rect x="12" y="93" width="296" height="74" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="119" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="114.76">2. Push the frame for factorial</tspan><tspan x="160" y="132.76">of 2</tspan></text><g><foreignObject x="32.5" y="142" width="255" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">Suspend <span data-tutor-tex="$F(2)$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">2</span><span class="mclose">)</span></span></span></span></span> until <span data-tutor-tex="$F(1)$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">1</span><span class="mclose">)</span></span></span></span></span> returns.</div></foreignObject></g><rect x="12" y="174" width="296" height="91" rx="7" fill="#F58371" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="200" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="195.76">3. Push the base case for</tspan><tspan x="160" y="213.76">factorial of 1</tspan></text><g><text x="160" y="240" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="252.92">call.</tspan></text><foreignObject x="33" y="223" width="254" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">Base case <span data-tutor-tex="$F(1)=1$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">1</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span>. No recursive</div></foreignObject></g><rect x="12" y="272" width="296" height="74" rx="7" fill="#67B9A0" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="298" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="293.76">4. Pop the frame for 1 and</tspan><tspan x="160" y="311.76">return 1</tspan></text><g><foreignObject x="43.5" y="321" width="233" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">Resume <span data-tutor-tex="$F(2)$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">2</span><span class="mclose">)</span></span></span></span></span> with the value 1.</div></foreignObject></g><rect x="12" y="353" width="296" height="91" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="379" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="374.76">5. Pop the frame for 2 and</tspan><tspan x="160" y="392.76">return 2</tspan></text><g><foreignObject x="45.5" y="402" width="229" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">Compute <span data-tutor-tex="$F(2)=2\times 1=2$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">2</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span></span></span></span></span> and</div></foreignObject><foreignObject x="108.5" y="419" width="103" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">resume <span data-tutor-tex="$F(3)$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">3</span><span class="mclose">)</span></span></span></span></span>.</div></foreignObject></g><rect x="12" y="451" width="296" height="91" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="477" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="472.76">6. Pop the frame for 3 and</tspan><tspan x="160" y="490.76">return 6</tspan></text><g><text x="160" y="517" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="529.92">return to the caller.</tspan></text><foreignObject x="45.5" y="500" width="229" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">Compute <span data-tutor-tex="$F(3)=3\times 2=6$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">3</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">3</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2778em;"></sp
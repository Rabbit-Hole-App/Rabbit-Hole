<svg xmlns="http://www.w3.org/2000/svg" width="408" height="516" viewBox="0 0 408 516" role="img" aria-label="Factorial of 3 on the call stack
1. Push the frame for factorial of 3 — Suspend $F(3)$ until $F(2)$ returns.
2. Push the frame for factorial of 2 — Suspend $F(2)$ until $F(1)$ returns.
3. Push the base case for factorial of 1 — Base case $F(1)=1$. No recursive call.
4. Pop the frame for 1 and return 1 — Resume $F(2)$ with the value 1.
5. Pop the frame for 2 and return 2 — Compute $F(2)=2\times 1=2$ and resume $F(3)$.
6. Pop the frame for 3 and return 6 — Compute $F(3)=3\times 2=6$ and return to the caller.
For $n&gt;1$, $F(n)=nF(n-1)$. The base case $F(1)=1$ starts the returns in the reverse order of the calls." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="layers"><title>Factorial of 3 on the call stack</title><rect x="0.5" y="0.5" width="407" height="515" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="22.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">Factorial of 3 on the call stack</tspan></text><g transform="translate(0 39)"><rect x="12" y="12" width="384" height="56" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="29" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="33.76">1. Push the frame for factorial of 3</tspan></text><g><foreignObject x="76.5" y="43" width="255" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">Suspend <span data-tutor-tex="$F(3)$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">3</span><span class="mclose">)</span></span></span></span></span> until <span data-tutor-tex="$F(2)$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">2</span><span class="mclose">)</span></span></span></span></span> returns.</div></foreignObjec
span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">1</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span></span></span></span></span>. No recursive call.</div></foreignObject></g><rect x="12" y="201" width="384" height="56" rx="7" fill="#67B9A0" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="218" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="222.76">4. Pop the frame for 1 and return 1</tspan></text><g><foreignObject x="87.5" y="232" width="233" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">Resume <span data-tutor-tex="$F(2)$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">2</span><span class="mclose">)</span></span></span></span></span> with the value 1.</div></foreignObject></g><rect x="12" y="264" width="384" height="56" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="281" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="285.76">5. Pop the frame for 2 and return 2</tspan></text><g><foreignObject x="37" y="295" width="334" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">Compute <span data-tutor-tex="$F(2)=2\times 1=2$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">2</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span></span></span></span></span> and resume <span data-tutor-tex="$F(3)$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">3</span><span class="mclose">)</span></span></span></span></span>.</div></foreignObject></g><rect x="12" y="327" width="384" height="73" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="344" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="348.76">6. Pop the frame for 3 and return 6</tspan></text><g><text x="204" y="375" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="387.92">caller.</tspan></text><foreignObject x="33.5" y="358" width="341" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">Compute <span data-tutor-tex="$F(3)=3\times 2=6$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">F</span><span class="mopen">(</span><span class="mord">3</span><span class="mclose">)</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">3</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">6</span></span></span></span></span> and return to the</div></foreignObject></g></g><switch><g requiredExtensions="http://www.w3.org/1999/xhtml"><g><text x="204" y="481.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="502.92">order of the calls.</tspan></text><foreignObject x="38.5" y="456" width="331" height="17" overflow="visible"><div xmlns="http://www.w3.org/1999/xhtml" style="di
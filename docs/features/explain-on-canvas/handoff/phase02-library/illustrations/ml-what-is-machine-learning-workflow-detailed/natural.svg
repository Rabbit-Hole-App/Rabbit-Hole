<svg xmlns="http://www.w3.org/2000/svg" width="320" height="914" viewBox="0 0 320 914" role="img" aria-label="Full ML workflow
Collect Data → Clean and Explore
Clean and Explore → Build Features
Build Features → Split Data
Split Data → Train Model
Train Model → Evaluate
Evaluate — good enough → Release Model
Release Model → Check Performance
Evaluate — not good enough → Return to Build Features
Check Performance — performance drops → Return to Collect Data

Pre-RMSNorm 1 (rescale input)
Repeat Pre-RMSNorm 1 (rescale input) through SwiGLU FFN (update each token) 32 times
Causal grouped-query attention (share key and value heads)
Pre-RMSNorm 2 (rescale before feed-forward)
SwiGLU FFN (update each token)

<svg xmlns="http://www.w3.org/2000/svg" width="331" height="523" viewBox="0 0 331 523" role="img" aria-label="Llama-style decoder block
Pre-RMSNorm 1 (input scaling) → Causal grouped-query attention (shared key and value heads) → Pre-RMSNorm 2 (feed-forward input scaling) → SwiGLU FFN (per-token update)
Pre-RMSNorm 1 (input scaling)
Repeat Pre-RMSNorm 1 (input scaling) through SwiGLU FFN (per-token update) 32 times
Causal grouped-query attention (shared key and value heads)
Pre-RMSNorm 2 (feed-forward input scaling)
SwiGLU FFN (per-token update)

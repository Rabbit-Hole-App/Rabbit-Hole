<svg xmlns="http://www.w3.org/2000/svg" width="408" height="505" viewBox="0 0 408 505" role="img" aria-label="Llama-style decoder block
Pre-RMSNorm 1 (rescale input) → Causal grouped-query attention (share key and value heads) → Pre-RMSNorm 2 (rescale before feed-forward) → SwiGLU FFN (update each token)
Pre-RMSNorm 1 (rescale input)
Repeat Pre-RMSNorm 1 (rescale input) through SwiGLU FFN (update each token) 32 times
Causal grouped-query attention (share key and value heads)
Pre-RMSNorm 2 (rescale before feed-forward)
SwiGLU FFN (update each token)
Residual bypass from Pre-RMSNorm 1 (rescale input) through Causal grouped-query attention (share key and value heads), then add
Residual bypass from Pre-RMSNorm 2 (rescale before feed-forward) through SwiGLU FFN (update each token), then add

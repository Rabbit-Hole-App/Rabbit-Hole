<svg xmlns="http://www.w3.org/2000/svg" width="408" height="320" viewBox="0 0 408 320" role="img" aria-label="Repeat until the stopping test passes
Compute predictions and cost → Compute gradients and update parameters → Check whether to stop → Compute predictions and cost
Illustrative loop. Exit when the stopping test passes; otherwise repeat. Low cost alone does not certify optimality." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="cycle"><title>Repeat until the stopping test passes</title><rect x="0.5" y="0.5" width="407" height="319" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">Repeat until the stopping test</tspan><tspan x="204" y="50.28">passes</tspan></text><g transform="translate(0 61)"><rect x="12" y="12" width="349" height="40" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="186.5" y="32" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="186.5" y="36.76">Compute predictions and cost</tspan></text><g><polyline points="186.5,52 186.5,68" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="186.5,68 183.1,61 189.9,61" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="72" width="349" height="50" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="186.5" y="97" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="186.5" y="92.76">Compute gradients and update</tspan><tspan x="186.5" y="110.76">parameters</tspan></text><g><polyline points="186.5,122 186.5,138" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="186.5,138 183.1,131 189.9,131" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="142" width="349" height="40" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="186.5" y="162" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="186.5" y="166.76">Check whether to stop</tspan></text><g><polyline points="361,162 386,162 386,32 365,32" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="365,32 372,28.6 372,35.4" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><text x="204" y="285.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="272.92">Illustrative loop. Exit when the stopping test</tspan><tspan x="204" y="289.92">passes; otherwise repeat. Low cost alone does</tspan><tspan x="204" y="306.92">not certify optimality.</tspan></text></svg>

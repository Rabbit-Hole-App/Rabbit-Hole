><g><polyline points="361,152 386,152 386,32 365,32" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="365,32 372,28.6 372,35.4" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><text x="204" y="245" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="240.92">Illustrative loop. If cost is high, repeat; if low,</tspan><tspan x="204" y="257.92">stop. A low cost need not be the exact minimum.</tspan></text></svg>

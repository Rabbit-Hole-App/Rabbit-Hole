><g><polyline points="673,152 698,152 698,32 677,32" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="677,32 684,28.6 684,35.4" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><text x="360" y="245" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="360" y="240.92">Illustrative loop. If cost is high, repeat; if low, stop. A low cost need not be the exact</tspan><tspan x="360" y="257.92">minimum.</tspan></text></svg>

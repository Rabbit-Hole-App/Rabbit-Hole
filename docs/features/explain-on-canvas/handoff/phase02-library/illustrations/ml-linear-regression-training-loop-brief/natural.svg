tspan x="142.5" y="166.76">Check cost; repeat if high</tspan></text><g><polyline points="273,162 298,162 298,32 277,32" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="277,32 284,28.6 284,35.4" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><text x="160" y="285.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="272.92">Illustrative loop. If cost is high,</tspan><tspan x="160" y="289.92">repeat; if low, stop. A low cost need</tspan><tspan x="160" y="306.92">not be the exact minimum.</tspan></text></svg>

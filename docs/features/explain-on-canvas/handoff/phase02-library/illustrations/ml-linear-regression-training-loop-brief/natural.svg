<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="Repeat the gradient descent loop
Predict and measure loss → Compute gradients and update → Check cost; repeat if high → Predict and measure loss

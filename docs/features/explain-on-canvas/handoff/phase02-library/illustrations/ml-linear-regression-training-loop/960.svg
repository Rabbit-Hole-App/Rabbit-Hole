span></text><g><polyline points="342.5,172 342.5,188" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="342.5,188 339.1,181 345.9,181" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="192" width="661" height="40" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="342.5" y="212" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="342.5" y="216.76">Update weight and intercept</tspan></text><g><polyline points="342.5,232 342.5,248" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="342.5,248 339.1,241 345.9,241" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><rect x="12" y="252" width="661" height="40" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="342.5" y="272" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="342.5" y="276.76">Check stopping tolerance</tspan></text><g><polyline points="673,272 698,272 698,32 677,32" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="677,32 684,28.6 684,35.4" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><text x="360" y="365" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="360" y="360.92">Illustrative loop. Exit when the stopping test passes; otherwise repeat. Low cost alone</tspan><tspan x="360" y="377.92">does not certify optimality.</tspan></text></svg>

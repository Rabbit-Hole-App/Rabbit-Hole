<svg xmlns="http://www.w3.org/2000/svg" width="408" height="440" viewBox="0 0 408 440" role="img" aria-label="Repeat until the stopping test passes
Compute $\hat y=wx+b$ → Compute $J$ from squared residuals → Compute $\partial_w J$ and $\partial_b J$ → Update $w\leftarrow w-\alpha\partial_w J$ and $b\leftarrow b-\alpha\partial_b J$ → Check stopping tolerance → Compute $\hat y=wx+b$

<svg xmlns="http://www.w3.org/2000/svg" width="408" height="391" viewBox="0 0 408 391" role="img" aria-label="Repeat the gradient descent loop
Predict $\hat y=wx+b$ → Compute $J=\frac{1}{m}\sum_i(\hat y_i-y_i)^2$ → Compute gradients $g_w,g_b$ → Update $w\gets w-\alpha g_w$ and $b\gets b-\alpha g_b$ → Check cost; stop if low → Predict $\hat y=wx+b$

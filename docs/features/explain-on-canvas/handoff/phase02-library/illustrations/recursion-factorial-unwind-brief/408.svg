<svg xmlns="http://www.w3.org/2000/svg" width="408" height="499" viewBox="0 0 408 499" role="img" aria-label="How factorial of 3 returns 6
1. Push the frame for factorial of 3 — Ask for the answer for 2.
2. Push the frame for factorial of 2 — Ask for the answer for 1.
3. Push the base case for factorial of 1 — Base case. No more calls.
4. Pop the frame for 1 and return 1 — The answer for 1 goes back to 2.
5. Pop the frame for 2 and return 2 — Two times one gives two. Send it back to 3.
6. Pop the frame for 3 and return 6 — Three times two gives six.
Put each new call on top. Remove the top call when it returns, so the older calls finish in reverse order." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="layers"><title>How factorial of 3 returns 6</title><rect x="0.5" y="0.5" width="407" height="498" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="22.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">How factorial of 3 returns 6</tspan></text><g transform="translate(0 39)"><rect x="12" y="12" width="384" height="56" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="29" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="33.76">1. Push the frame for factorial of 3</tspan></text><text x="204" y="51.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="55.92">Ask for the answer for 2.</tspan></text><rect x="12" y="75" width="384" height="56" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="92" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="96.76">2. Push the frame for factorial of 2</tspan></text><text x="204" y="114.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="118.92">Ask for the answer for 1.</tspan></text><rect x="12" y="138" width="384" height="56" rx="7" fill="#F58371" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="155" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="159.76">3. Push the base case for factorial of 1</tspan></text><text x="204" y="177.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="181.92">Base case. No more calls.</tspan></text><rect x="12" y="201" width="384" height="56" rx="7" fill="#67B9A0" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="218" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="222.76">4. Pop the frame for 1 and return 1</tspan></text><text x="204" y="240.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="244.92">The answer for 1 goes back to 2.</tspan></text><rect x="12" y="264" width="384" height="56" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="281" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="285.76">5. Pop the frame for 2 and return 2</tspan></text><text x="204" y="303.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="307.92">Two times one gives two. Send it back to 3.</tspan></text><rect x="12" y="327" width="384" height="56" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="344" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="348.76">6. Pop the frame for 3 and return 6</tspan></text><text x="204" y="366.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="370.92">Three times two gives six.</tspan></text></g><text x="204" y="464.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="451.92">Put each new call on top. Remove the top call</tspan><tspan x="204" y="468.92">when it returns, so the older calls finish in</tspan><tspan x="204" y="485.92">reverse order.</tspan></text></svg>

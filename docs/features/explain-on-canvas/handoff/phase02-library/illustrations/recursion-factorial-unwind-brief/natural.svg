<svg xmlns="http://www.w3.org/2000/svg" width="320" height="646" viewBox="0 0 320 646" role="img" aria-label="How factorial of 3 returns 6
1. Push the frame for factorial of 3 — Ask for the answer for 2.
2. Push the frame for factorial of 2 — Ask for the answer for 1.
3. Push the base case for factorial of 1 — Base case. No more calls.
4. Pop the frame for 1 and return 1 — The answer for 1 goes back to 2.
5. Pop the frame for 2 and return 2 — Two times one gives two. Send it back to 3.
6. Pop the frame for 3 and return 6 — Three times two gives six.
Put each new call on top. Remove the top call when it returns, so the older calls finish in reverse order." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="layers"><title>How factorial of 3 returns 6</title><rect x="0.5" y="0.5" width="319" height="645" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="160" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="160" y="28.28">How factorial of 3 returns</tspan><tspan x="160" y="50.28">6</tspan></text><g transform="translate(0 61)"><rect x="12" y="12" width="296" height="74" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="38" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="33.76">1. Push the frame for factorial</tspan><tspan x="160" y="51.76">of 3</tspan></text><text x="160" y="69.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="73.92">Ask for the answer for 2.</tspan></text><rect x="12" y="93" width="296" height="74" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="119" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="114.76">2. Push the frame for factorial</tspan><tspan x="160" y="132.76">of 2</tspan></text><text x="160" y="150.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="154.92">Ask for the answer for 1.</tspan></text><rect x="12" y="174" width="296" height="74" rx="7" fill="#F58371" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="200" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="195.76">3. Push the base case for</tspan><tspan x="160" y="213.76">factorial of 1</tspan></text><text x="160" y="231.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="235.92">Base case. No more calls.</tspan></text><rect x="12" y="255" width="296" height="74" rx="7" fill="#67B9A0" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="281" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="276.76">4. Pop the frame for 1 and</tspan><tspan x="160" y="294.76">return 1</tspan></text><text x="160" y="312.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="316.92">The answer for 1 goes back to 2.</tspan></text><rect x="12" y="336" width="296" height="91" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="362" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="357.76">5. Pop the frame for 2 and</tspan><tspan x="160" y="375.76">return 2</tspan></text><text x="160" y="402" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="397.92">Two times one gives two. Send it</tspan><tspan x="160" y="414.92">back to 3.</tspan></text><rect x="12" y="434" width="296" height="74" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="460" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="455.76">6. Pop the frame for 3 and</tspan><tspan x="160" y="473.76">return 6</tspan></text><text x="160" y="491.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="495.92">Three times two gives six.</tspan></text></g><text x="160" y="611.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="598.92">Put each new call on top. Remove the</tspan><tspan x="160" y="615.92">top call when it returns, so the</tspan><tspan x="160" y="632.92">older calls finish in reverse order.</tspan></text></svg>

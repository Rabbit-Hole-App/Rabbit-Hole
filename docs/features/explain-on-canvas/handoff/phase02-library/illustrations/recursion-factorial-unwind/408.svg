<svg xmlns="http://www.w3.org/2000/svg" width="408" height="555" viewBox="0 0 408 555" role="img" aria-label="Factorial of 3 calls down and returns up
1. Push the frame for factorial of 3 — Wait for factorial of 2.
2. Push the frame for factorial of 2 — Wait for factorial of 1.
3. Push the base case for factorial of 1 — Base case. No smaller call.
4. Pop the frame for 1 and return 1 — Send 1 back to the call for 2.
5. Pop the frame for 2 and return 2 — Multiply $2\times 1=2$ and send 2 back to the call for 3.
6. Pop the frame for 3 and return 6 — Multiply $3\times 2=6$ and return the final result.
Push each call onto the stack. The base case returns 1, then each earlier frame pops as it finishes." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="layers"><title>Factorial of 3 calls down and returns up</title><rect x="0.5" y="0.5" width="407" height="554" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">Factorial of 3 calls down and</tspan><tspan x="204" y="50.28">returns up</tspan></text><g transform="translate(0 61)"><rect x="12" y="12" width="384" height="56" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="29" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="33.76">1. Push the frame for factorial of 3</tspan></text><text x="204" y="51.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="55.92">Wait for factorial of 2.</tspan></text><rect x="12" y="75" width="384" height="56" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="92" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="96.76">2. Push the frame for factorial of 2</tspan></text><text x="204" y="114.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="118.92">Wait for factorial of 1.</tspan></text><rect x="12" y="138" width="384" height="56" rx="7" fill="#F58371" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="155" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="159.76">3. Push the base case for factorial of 1</tspan></text><text x="204" y="177.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="181.92">Base case. No smaller call.</tspan></text><rect x="12" y="201" width="384" height="56" rx="7" fill="#67B9A0" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="218" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="222.76">4. Pop the frame for 1 and return 1</tspan></text><text x="204" y="240.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="244.92">Send 1 back to the call for 2.</tspan></text><rect x="12" y="264" width="384" height="73" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="281" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="285.76">5. Pop the frame for 2 and return 2</tspan></text><g><text x="204" y="312" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="324.92">for 3.</tspan></text><foreignObject x="28" y="295" width="352" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">Multiply <span data-tutor-tex="$2\times 1=2$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span></span></span></span></span> and send 2 back to the call</div></foreignObject></g><rect x="12" y="344" width="384" height="73" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="361" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="365.76">6. Pop the frame for 3 and return 6</tspan></text><g><text x="204" y="392" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="404.92">result.</tspan></text><foreignObject x="53" y="375" width="302" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">Multiply <span data-tutor-tex="$3\times 2=6$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">3</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">6</span></span></span></span></span> and return the final</div></foreignObject></g></g><text x="204" y="520.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="507.92">Push each call onto the stack. The base case</tspan><tspan x="204" y="524.92">returns 1, then each earlier frame pops as it</tspan><tspan x="204" y="541.92">finishes.</tspan></text></svg>

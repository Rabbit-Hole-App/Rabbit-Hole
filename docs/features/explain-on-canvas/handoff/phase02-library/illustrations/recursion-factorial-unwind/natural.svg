<svg xmlns="http://www.w3.org/2000/svg" width="320" height="663" viewBox="0 0 320 663" role="img" aria-label="Factorial of 3 calls down and returns up
1. Push the frame for factorial of 3 — Wait for factorial of 2.
2. Push the frame for factorial of 2 — Wait for factorial of 1.
3. Push the base case for factorial of 1 — Base case. No smaller call.
4. Pop the frame for 1 and return 1 — Send 1 back to the call for 2.
5. Pop the frame for 2 and return 2 — Multiply $2\times 1=2$ and send 2 back to the call for 3.
6. Pop the frame for 3 and return 6 — Multiply $3\times 2=6$ and return the final result.
Push each call onto the stack. The base case returns 1, then each earlier frame pops as it finishes." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="layers"><title>Factorial of 3 calls down and returns up</title><rect x="0.5" y="0.5" width="319" height="662" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="160" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="160" y="28.28">Factorial of 3 calls down</tspan><tspan x="160" y="50.28">and returns up</tspan></text><g transform="translate(0 61)"><rect x="12" y="12" width="296" height="74" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="38" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="33.76">1. Push the frame for factorial</tspan><tspan x="160" y="51.76">of 3</tspan></text><text x="160" y="69.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="73.92">Wait for factorial of 2.</tspan></text><rect x="12" y="93" width="296" height="74" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="119" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="114.76">2. Push the frame for factorial</tspan><tspan x="160" y="132.76">of 2</tspan></text><text x="160" y="150.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="154.92">Wait for factorial of 1.</tspan></text><rect x="12" y="174" width="296" height="74" rx="7" fill="#F58371" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="200" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="195.76">3. Push the base case for</tspan><tspan x="160" y="213.76">factorial of 1</tspan></text><text x="160" y="231.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="235.92">Base case. No smaller call.</tspan></text><rect x="12" y="255" width="296" height="74" rx="7" fill="#67B9A0" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="281" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="276.76">4. Pop the frame for 1 and</tspan><tspan x="160" y="294.76">return 1</tspan></text><text x="160" y="312.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="316.92">Send 1 back to the call for 2.</tspan></text><rect x="12" y="336" width="296" height="91" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="362" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="357.76">5. Pop the frame for 2 and</tspan><tspan x="160" y="375.76">return 2</tspan></text><g><text x="160" y="402" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="414.92">to the call for 3.</tspan></text><foreignObject x="27" y="385" width="266" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">Multiply <span data-tutor-tex="$2\times 1=2$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">1</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span></span></span></span></span> and send 2 back</div></foreignObject></g><rect x="12" y="434" width="296" height="91" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="160" y="460" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="160" y="455.76">6. Pop the frame for 3 and</tspan><tspan x="160" y="473.76">return 6</tspan></text><g><text x="160" y="500" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="512.92">final result.</tspan></text><foreignObject x="29.5" y="483" width="261" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:#32211c;font-size:13px;font-weight:400;line-height:17px">Multiply <span data-tutor-tex="$3\times 2=6$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">3</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">6</span></span></span></span></span> and return the</div></foreignObject></g></g><text x="160" y="628.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="160" y="615.92">Push each call onto the stack. The</tspan><tspan x="160" y="632.92">base case returns 1, then each</tspan><tspan x="160" y="649.92">earlier frame pops as it finishes.</tspan></text></svg>

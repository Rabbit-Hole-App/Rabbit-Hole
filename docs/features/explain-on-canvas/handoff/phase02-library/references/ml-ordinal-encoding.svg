<svg xmlns="http://www.w3.org/2000/svg" width="408" height="938" viewBox="0 0 408 938" role="img" aria-label="Ordinal encoding preserves a real order
Panel: Choose the codebook
Panel: Encode six sample rows
Low, then Medium, then High
Level | Code
1st: Low | 0
2nd: Medium | 1
3rd: High | 2
The levels have a known ranking before encoding. Codes show rank, not measured equal spacing.
Apply one codebook to every row
Level | Code
A: Low | 0
B: High | 2
C: Medium | 1
D: Medium | 1
E: Low | 0
F: High | 2
Code: highlighted column
A through F stay in the same order; repeated levels receive the same code.

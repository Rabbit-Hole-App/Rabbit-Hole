in</tspan></text><text x="12" y="513" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="508.92">5. Training and evaluation → Deployed model:</tspan><tspan x="12" y="525.92">Deploy accepted model</tspan></text></g></svg>

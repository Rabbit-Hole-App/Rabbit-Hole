<svg xmlns="http://www.w3.org/2000/svg" width="444" height="1180" viewBox="0 0 444 1180" role="img" aria-label="Population ACF and PACF for one stationary AR(1)
Panel: ACF · Autocorrelation
Panel: PACF · Partial autocorrelation
Shared axes: x, y
ACF · Autocorrelation
Lag: 1 to 4
Correlation: -1 to 1
Population ACF (stem): (1, 0.6); (2, 0.36); (3, 0.216); (4, 0.1296)
ACF measures the full correlation at each lag. For lags 1–4, the values are 0.6, 0.36, 0.216 and 0.1296.
PACF · Partial autocorrelation
Lag: 1 to 4
Correlation: -1 to 1
Population PACF (stem): (1, 0.6); (2, 0); (3, 0); (4, 0)
PACF adjusts for intervening lags. Lag 1 stays at 0.6. At lag 2, $\frac{0.36-0.6^2}{1-0.6^2}=0$. Lags 3 and 4 are also zero.

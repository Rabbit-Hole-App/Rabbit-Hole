More weight on the missed row
Factor | Weight
R1: $e^{-\alpha}$ | 1/6
R2: $e^{-\alpha}$ | 1/6
R3: $e^\alpha$ | 1/2
R4: $e^{-\alpha}$ | 1/6
R3: highlighted row

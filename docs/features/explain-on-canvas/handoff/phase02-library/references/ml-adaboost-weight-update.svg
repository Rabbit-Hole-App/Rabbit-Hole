<svg xmlns="http://www.w3.org/2000/svg" width="408" height="971" viewBox="0 0 408 971" role="img" aria-label="AdaBoost gives the missed row more weight
Before the weight update → After normalization: Multiply by the factor for each row, then normalize
Identity preserved: R1–R4 are the same examples in both tables. R3 goes from 1/4 to 1/2.
Equal weight on every row
Result | Weight
R1: Correct | 1/4
R2: Correct | 1/4
R3: Missed | 1/4
R4: Correct | 1/4
R3: highlighted row

<svg xmlns="http://www.w3.org/2000/svg" width="444" height="1288" viewBox="0 0 444 1288" role="img" aria-label="A new feature makes separation possible
Original feature → Mapped features: $\phi(x) = (x, x^2)$
Identity preserved: The same four IDs and class labels remain. $x$ stays fixed; $x^2$ becomes the second feature.
Original feature
Feature $x$: -2.5 to 2.5
Display only (all 0): -1 to 1
Class A: −2, 2 (scatter): outerLeft (-2, 0); outerRight (2, 0)
Class B: −1, 1 (scatter): innerLeft (-1, 0); innerRight (1, 0)
Mapped features
Feature $x$: -2.5 to 2.5
Feature $x^2$: 0 to 5
Class A: −2, 2 (scatter): outerLeft (-2, 4); outerRight (2, 4)
Class B: −1, 1 (scatter): innerLeft (-1, 1); innerRight (1, 1)
Linear separator: y = 2.5
Class A has height 4; class B has height 1.

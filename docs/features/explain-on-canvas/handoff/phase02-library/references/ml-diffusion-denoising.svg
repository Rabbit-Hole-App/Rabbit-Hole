<svg xmlns="http://www.w3.org/2000/svg" width="408" height="555" viewBox="0 0 408 555" role="img" aria-label="Denoise an image from pure noise
Image app, Sampler, Denoiser
Image app — Prompt embedding for “a red fox” → Denoiser
Sampler — Pure noise $x_T$ and step $T$ → Denoiser
Denoiser — Noise predicted from $x_T$ and prompt → Sampler
Sampler — Less noisy $x_{T-1}$ and next step → Denoiser
Denoiser — Next noise prediction → Sampler
Sampler — Clean image $x_0$ after $T$ steps → Image app

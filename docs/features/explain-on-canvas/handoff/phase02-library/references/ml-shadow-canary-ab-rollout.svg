<svg xmlns="http://www.w3.org/2000/svg" width="408" height="427" viewBox="0 0 408 427" role="img" aria-label="Shadow, canary and A/B testing
Shadow: Copy live requests to the new model; Current model alone decides; Compare error rates and latency
Canary: Route 5% of live requests to the new model; New model decides for that 5%; Roll back if a guardrail breaks
A/B test: Randomly assign users to stable groups; Assigned model decides for each user; Compare a business metric

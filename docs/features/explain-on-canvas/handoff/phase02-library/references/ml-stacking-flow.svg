<svg xmlns="http://www.w3.org/2000/svg" width="408" height="544" viewBox="0 0 408 544" role="img" aria-label="Stacking learns how to combine base models
Use shared training folds: simultaneous parallel routes
Build the OOF feature matrix: merge incoming routes before continuing
Use shared training folds → Get linear model OOF scores
Use shared training folds → Get tree model OOF scores
Get linear model OOF scores → Build the OOF feature matrix
Get tree model OOF scores → Build the OOF feature matrix
Build the OOF feature matrix → Fit meta learner
Fit meta learner → Return combined predictor

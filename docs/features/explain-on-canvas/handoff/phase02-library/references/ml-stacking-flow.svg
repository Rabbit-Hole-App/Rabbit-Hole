x</tspan></text></g><g data-tutor-node="meta" data-tutor-role="process"><rect x="111" y="284" width="186" height="38" rx="7" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="204" y="303" fill="#202723" font-size="14" font-weight="400" text-anchor="middle"><tspan x="204" y="307.76">Fit meta learner</tspan></text></g><g data-tutor-node="out" data-tutor-role="outcome"><rect x="111" y="354" width="186" height="50" rx="25" fill="#e7f3ed" stroke="#e3e7e0" stroke-width="1"></rect><text x="204" y="379" fill="#202723" font-size="14" font-weight="400" text-anchor="middle"><tspan x="204" y="374.76">Return combined</tspan><tspan x="204" y="392.76">predictor</tspan></text></g></g><text x="204" y="509.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="496.92">Training the meta learner uses out-of-fold</tspan><tspan x="204" y="513.92">predictions; final test predictions use base</tspan><tspan x="204" y="530.92">models fit on training data.</tspan></text></svg>

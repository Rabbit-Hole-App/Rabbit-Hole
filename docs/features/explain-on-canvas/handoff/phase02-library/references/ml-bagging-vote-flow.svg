<svg xmlns="http://www.w3.org/2000/svg" width="408" height="511" viewBox="0 0 408 511" role="img" aria-label="Bagging combines independently trained models
Bootstrap draws: simultaneous parallel routes
Majority vote: merge incoming routes before continuing

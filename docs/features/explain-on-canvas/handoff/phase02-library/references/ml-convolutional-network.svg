<svg xmlns="http://www.w3.org/2000/svg" width="408" height="684" viewBox="0 0 408 684" role="img" aria-label="A convolutional network turns an image into class scores
Read the image → Convolve with learned filters
Convolve with learned filters → Activate feature maps
Activate feature maps → Pool local neighborhoods
Pool local neighborhoods → Flatten pooled maps
Flatten pooled maps → Apply a fully connected layer
Apply a fully connected layer → Produce class scores
Convolution produces feature maps. Activation adds nonlinearity, and pooling reduces their spatial size." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="flow"><title>A convolutional network turns an image into class scores</title><rect x="0.5" y="0.5" width="407" height="683" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">A convolutional network turns an</tspan><tspan x="204" y="50.28">image into class scores</tspan></text><g transform="translate(0 61)"><g data-tutor-edge="image:convolution"><g><polyline points="204,52 204,68 204,68 204,84" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,84 200.6,77 207.4,77" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-edge="convolution:activation"><g><polyline points="204,134 204,150 204,150 204,166" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,166 200.6,159 207.4,159" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-edge="activation:pooling"><g><polyline points="204,216 204,232 204,232 204,248" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,248 200.6,241 207.4,241" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-edge="pooling:flatten"><g><polyline points="204,298 204,314 204,314 204,330" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,330 200.6,323 207.4,323" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-edge="flatten:dense"><g><polyline points="204,380 204,396 204,396 204,412" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,412 200.6,405 207.4,405" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-edge="dense:scores"><g><polyline points="204,462 204,478 204,478 204,494" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,494 200.6,487 207.4,487" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-node="image"><rect x="111" y="14" width="186" height="38" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="33" fill="#32211c" font-size="14" font-weight="400" text-anchor="middle"><tspan x="204" y="37.76">Read the image</tspan></text></g><g data-tutor-node="convolution"><rect x="111" y="84" width="186" height="50" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="109" fill="#32211c" font-size="14" font-weight="400" text-anchor="middle"><tspan x="204" y="104.76">Convolve with</tspan><tspan x="204" y="122.76">learned filters</tspan></text></g><g data-tutor-node="activation"><rect x="111" y="166" width="186" height="50" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="191" fill="#32211c" font-size="14" font-weight="400" text-anchor="middle"><tspan x="204" y="186.76">Activate feature</tspan><tspan x="204" y="204.76">maps</tspan></text></g><g data-tutor-node="pooling"><rect x="111" y="248" width="186" height="50" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="273" fill="#32211c" font-size="14" font-weight="400" text-anchor="middle"><tspan x="204" y="268.76">Pool local</tspan><tspan x="204" y="286.76">neighborhoods</tspan></text></g><g data-tutor-node="flatten"><rect x="111" y="330" width="186" height="50" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="355" fill="#32211c" font-size="14" font-weight="400" text-anchor="middle"><tspan x="204" y="350.76">Flatten pooled</tspan><tspan x="204" y="368.76">maps</tspan></text></g><g data-tutor-node="dense"><rect x="111" y="412" width="186" height="50" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="437" fill="#32211c" font-size="14" font-weight="400" text-anchor="middle"><tspan x="204" y="432.76">Apply a fully</tspan><tspan x="204" y="450.76">connected layer</tspan></text></g><g data-tutor-node="scores"><rect x="111" y="494" width="186" height="50" rx="25" fill="#67B9A0" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="519" fill="#32211c" font-size="14" font-weight="400" text-anchor="middle"><tspan x="204" y="514.76">Produce class</tspan><tspan x="204" y="532.76">scores</tspan></text></g></g><text x="204" y="649.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="636.92">Convolution produces feature maps. Activation</tspan><tspan x="204" y="653.92">adds nonlinearity, and pooling reduces their</tspan><tspan x="204" y="670.92">spatial size.</tspan></text></svg>

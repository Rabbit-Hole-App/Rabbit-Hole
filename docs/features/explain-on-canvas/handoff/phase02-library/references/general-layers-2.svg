Data — Stores and retrieves persistent records." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="layers"><title>Three layers of a web application</title><rect x="0.5" y="0.5" width="407" height="261" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="22.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">Three layers of a web application</tspan></text><g transform="translate(0 39)"><rect x="12" y="12" width="384" height="73" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="29" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="33.76">Presentation</tspan></text><text x="204" y="60" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="55.92">Renders the interface and handles user</tspan><tspan x="204" y="72.92">input.</tspan></text><rect x="12" y="92" width="384" height="56" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="109" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="113.76">Application</tspan></text><text x="204" y="131.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="135.92">Applies rules and coordinates requests.</tspan></text><rect x="12" y="155" width="384" height="56" rx="7" fill="#F58371" stroke="#32211c" stroke-width="1.5"></rect><text x="204" y="172" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="176.76">Data</tspan></text><text x="204" y="194.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="198.92">Stores and retrieves persistent records.</tspan></text></g></svg>

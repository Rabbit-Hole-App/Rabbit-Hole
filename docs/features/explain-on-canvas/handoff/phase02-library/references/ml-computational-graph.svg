<svg xmlns="http://www.w3.org/2000/svg" width="408" height="737" viewBox="0 0 408 737" role="img" aria-label="A computational graph links operations through values
Read input — Pass $x$ → Multiply
Read weight — Pass $w$ → Multiply
Multiply — Pass $u=wx$ → Add
Read bias — Pass $b$ → Add
Add — Pass $z=u+b$ → Square for loss
Read edges forward for values and backward for gradients. For $L=z^2$, the chain rule gives $\partial L/\partial w=2zx$." font-family="Inter, Liberation Sans, Arial, sans-serif" style="display:block;max-width:none;margin-inline:auto;--color-ink:#202723;--color-ink-2:#5d675f;--color-line:#e3e7e0;--viz-surface:#fffefa" data-tutor-diagram="relationship"><title>A computational graph links operations through values</title><rect x="0.5" y="0.5" width="407" height="736" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">A computational graph links</tspan><tspan x="204" y="50.28">operations through values</tspan></text><g transform="translate(0 61)"><g data-tutor-edge="x:multiply" data-tutor-edge-index="0"><g><polyline points="216.5,29 230.5,29 230.5,184.5 216.5,184.5" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="216.5,184.5 223.5,181.1 223.5,187.9" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="230.5" cy="70" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="230.5" y="70" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="230.5" y="74.08">1</tspan></text></g><g data-tutor-edge="w:multiply" data-tutor-edge-index="1"><g><polyline points="216.5,111 254.5,111 254.5,193 216.5,193" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="216.5,193 223.5,189.6 223.5,196.4" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="254.5" cy="152" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="254.5" y="152" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="254.5" y="156.08">2</tspan></text></g><g data-tutor-edge="multiply:add" data-tutor-edge-index="2"><g><polyline points="216.5,201.5 278.5,201.5 278.5,348.5 216.5,348.5" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="216.5,348.5 223.5,345.1 223.5,351.9" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="278.5" cy="234" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="278.5" y="234" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="278.5" y="238.08">3</tspan></text></g><g data-tutor-edge="b:add" data-tutor-edge-index="3"><g><polyline points="216.5,275 302.5,275 302.5,357 216.5,357" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="216.5,357 223.5,353.6 223.5,360.4" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="302.5" cy="316" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="302.5" y="316" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="302.5" y="320.08">4</tspan></text></g><g data-tutor-edge="add:loss" data-tutor-edge-index="4"><g><polyline points="216.5,365.5 326.5,365.5 326.5,439 216.5,439" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="216.5,439 223.5,435.6 223.5,442.4" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="326.5" cy="398" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="326.5" y="398" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="326.5" y="402.08">5</tspan></text></g><g data-tutor-node="x"><rect x="63.5" y="12" width="151" height="34" rx="9" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="139" y="29" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="139" y="33.76">Read input</tspan></text></g><g data-tutor-node="w"><rect x="63.5" y="94" width=
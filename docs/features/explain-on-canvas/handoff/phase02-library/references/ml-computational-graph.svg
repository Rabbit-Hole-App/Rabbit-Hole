div></foreignObject></g><g><foreignObject x="12" y="499" width="264" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:flex-start;height:100%;white-space:pre;color:var(--color-ink, #32211c);font-size:13px;font-weight:400;line-height:17px">2. Read weight → Multiply: Pass <span data-tutor-tex="$w$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span></span></span></span></span></div></foreignObject></g><g><foreignObject x="12" y="524" width="238" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:flex-start;height:100%;white-space:pre;color:var(--color-ink, #32211c);font-size:13px;font-weight:400;line-height:17px">3. Multiply → Add: Pass <span data-tutor-tex="$u=wx$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">u</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mord mathnormal">x</span></span></span></span></span></div></foreignObject></g><g><foreignObject x="12" y="549" width="203" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:flex-start;height:100%;white-space:pre;color:var(--color-ink, #32211c);font-size:13px;font-weight:400;line-height:17px">4. Read bias → Add: Pass <span data-tutor-tex="$b$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">b</span></span></span></span></span></div></foreignObject></g><g><foreignObject x="12" y="574" width="314" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:flex-start;height:100%;white-space:pre;color:var(--color-ink, #32211c);font-size:13px;font-weight:400;line-height:17px">5. Add → Square for loss: Pass <span data-tutor-tex="$z=u+b$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal" style="margin-right:0.044em;">z</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6667em;vertical-align:-0.0833em;"></span><span class="mord mathnormal">u</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6944em;"></span><span class="mord mathnormal">b</span></span></span></span></span></div></foreignObject></g></g><g><text x="204" y="702.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="689.92">Read edges forward for values and backward</tspan></text><foreignObject x="22" y="694" width="364" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:var(--color-ink-2, #665951);font-size:13px;font-weight:400;line-height:17px">for gradients. For <span data-tutor-tex="$L=z^2$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal">L</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8141em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.044em;">z</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span></span>, the chain rule gives</div></foreignObject><foreignObject x="131" y="711" width="146" height="17" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:var(--color-ink-2, #665951);font-size:13px;font-weight:400;line-height:17px"><span data-tutor-tex="$\partial L/\partial w=2zx$" style="font-size:13px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord" style="margin-right:0.0556em;">∂</span><span class="mord mathnormal">L</span><span class="mord">/</span><span class="mord" style="margin-right:0.0556em;">∂</span><span class="mord mathnormal" style="margin-right:0.0269em;">w</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span><span class="mord mathnormal" style="margin-right:0.044em;">z</span><span class="mord mathnormal">x</span></span></span></span></span>.</div></foreignObject></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="408" height="846" viewBox="0 0 408 846" role="img" aria-label="Backpropagation carries the loss gradient backward
Read input $x$ → Compute hidden activations $h$
Compute hidden activations $h$ → Compute prediction $\hat y$
Compute prediction $\hat y$ → Evaluate loss $L$
Evaluate loss $L$ — Start backward pass → Differentiate loss at prediction
Differentiate loss at prediction — $\partial L/\partial \hat y$ → Apply chain rule at output layer
Apply chain rule at output layer — $\partial L/\partial h$ → Apply chain rule at hidden layer
Apply chain rule at hidden layer — Gradients for both layers → Update weights $w\gets w-\eta\nabla_w L$
The backward pass reuses saved activations. At each layer, multiply the incoming loss gradient by local derivatives." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="flow"><title>Backpropagation carries the loss gradient backward</title><rect x="0.5" y="0.5" width="407" height="845" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">Backpropagation carries the loss</tspan><tspan x="204" y="50.28">gradient backward</tspan></text><g transform="translate(0 61)"><g data-tutor-edge="input:hidden"><g><polyline points="204,52 204,68 204,68 204,84" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,84 200.6,77 207.4,77" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-edge="hidden:output"><g><polyline points="204,134 204,150 204,150 204,166" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,166 200.6,159 207.4,159" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-edge="output:loss"><g><polyline points="204,216 204,232 204,232 204,248" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,248 200.6,241 207.4,241" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-edge="loss:seed"><g><polyline points="204,286 204,318 204,318 204,350" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,350 200.6,343 207.4,343" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-edge="seed:outputGrad"><g><polyline points="204,400 204,423 204,423 204,446" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,446 200.6,439 207.4,439" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-edge="outputGrad:hiddenGrad"><g><polyline points="204,496 204,519 204,519 204,542" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,542 200.6,535 207.4,535" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-edge="hiddenGrad:update"><g><polyline points="204,592 204,624 204,624 204,656" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,656 200.6,649 207.4,649" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g><rect x="211" y="298" width="145" height="40" fill="var(--viz-surface, #fbfbfa)"></rect><text x="283.5" y="318" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="283.5" y="313.76">Start backward</tspan><tspan x="283.5" y="331.76">pass</tspan></text></g><g><rect x="211" y="412" width="105" height="22" fill="var(--viz-surface, #fbfbfa)"></rect><g><foreignObject x="216" y="414" width="95" height="18" overflow="visible"><div style="display:flex;align-items:center;justify-content:center;height:100%;white-space:pre;color:var(--color-ink, #32211c);font-size:14px;font-weight:400;line-height:18px"><span data-tutor-tex="$\partial L/\partial \hat y$" style="font-size:14px;line-height:normal"><span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord" style="margin-right:0.0556em;">∂</span><
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="643" viewBox="0 0 440 643" role="img" aria-label="Batch and online inference
Batch job, Model, Score store, App
Batch job — Batch · score feature snapshot → Model
Model — Return batch scores → Batch job
Batch job — Store scores before requests → Score store
App — Batch request · read score → Score store
Score store — Return stored score → App
App — Online request · current features → Model
Model — Return fresh score → App

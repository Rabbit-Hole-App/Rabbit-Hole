<svg xmlns="http://www.w3.org/2000/svg" width="440" height="658" viewBox="0 0 440 658" role="img" aria-label="Retrieve evidence before answering
User, App, Retriever / vector store, LLM
User — “When does the museum close?” → App
App — Question text to embed and search → Retriever / vector store
Retriever / vector store — Top passages include “Closes at 5 pm” → App
App — Prompt with question and top passages → LLM
LLM — Answer “5 pm” with source passage → App
App — “5 pm” with source → User

<svg xmlns="http://www.w3.org/2000/svg" width="1256" height="922" viewBox="0 0 1256 922" font-family="Inter, Liberation Sans, Arial, sans-serif" fill="#202723" role="img">
<title>Tree depth, regression and forests</title>
<desc>Illustrative SVG examples of expected explanation and interactive cards. Each interactive scene shows one possible state.</desc>
<g id="sheet-2">
<rect width="1256" height="922" fill="#f5f4ed"/>
<circle cx="30" cy="28" r="4" fill="#b86232"/>
<text x="42" y="33" font-size="15" fill="#515d52" font-weight="700" text-anchor="start">Rabbit Hole · Decision Trees and Random Forests</text>
<text x="26" y="75" font-size="29" fill="#202723" font-weight="700" text-anchor="start">Tree depth, regression and forests</text>
<rect x="1033" y="49" width="197" height="30" rx="15" fill="#ebece3"/>
<text x="1131.5" y="69" font-size="13" fill="#4b584e" font-weight="600" text-anchor="middle">05–08 · Example previews</text>
<g id="card-05" transform="translate(26 98)" aria-label="When to Stop Growing a Tree">
<rect x="0.5" y="2.5" width="591" height="393" rx="18" fill="#e6e5de"/>
<rect x="0.5" y="0.5" width="591" height="393" rx="18" fill="#fffefa" stroke="#dedfd8"/>
<rect x="25" y="17" width="101" height="26" rx="13" fill="#eaf1fb"/>
<text x="75.5" y="35" font-size="13" fill="#375d92" font-weight="700" text-anchor="middle">Explanation</text>
<text x="567" y="35" font-size="13" fill="#656c62" font-weight="600" text-anchor="end">05 / 12</text>
<text x="25" y="76" font-size="27" fill="#202723" font-weight="700" text-anchor="start">When to Stop Growing a Tree</text>
<text x="26" y="102" font-size="14.5" fill="#505b52" font-weight="400" text-anchor="start">Extra splits can correct a training mistake while making a new</text>
<text x="26" y="120" font-size="14.5" fill="#505b52" font-weight="400" text-anchor="start">mistake on points the tree has never seen.</text>
<g transform="translate(26 132)">
<rect x="0" y="0" width="262" height="141" rx="10" fill="#f6f8f4" stroke="#e3e7e0"/><rect x="278" y="0" width="262" height="141" rx="10" fill="#f6f8f4" stroke="#e3e7e0"/><text x="17" y="29" fill="#202723" font-size="17" font-weight="650" text-anchor="start">Stop after the first split</text><line x1="17" y1="46" x2="245" y2="46" stroke="#e3e7e0" stroke-width="1"/><text x="17" y="74" fill="#5d675f" font-size="14" font-weight="500" text-anchor="start">Training points correct</text><text x="245" y="74" fill="#202723" font-size="17" font-weight="700" text-anchor="end">7 / 8</text><text x="17" y="109" fill="#5d675f" font-size="14" font-weight="500" text-anchor="start">Held-out points correct</text><text x="245" y="109" fill="#267657" font-size="17" font-weight="700" text-anchor="end">5 / 6</text><text x="295" y="29" fill="#202723" font-size="17" font-weight="650" text-anchor="start">Split around a noisy point</text><line x1="295" y1="46" x2="523" y2="46" stroke="#e3e7e0" stroke-width="1"/><text x="295" y="74" fill="#5d675f" font-size="14" font-weight="500" text-anchor="start">Training points correct</text><text x="523" y="74" fill="#267657" font-size="17" font-weight="700" text-anchor="end">8 / 8</text><text x="295" y="109" fill="#5d675f" font-size="14" font-weight="500" text-anchor="start">Held-out points correct</text><text x="523" y="109" fill="#b86232" font-size="17" font-weight="700" text-anchor="end">4 / 6</text><rect x="0" y="156" width="540" height="74" rx="10" fill="#faf0e7" stroke="none"/><text x="16" y="181" fill="#202723" font-size="16" font-weight="650" text-anchor="start">When to stop</text><text x="16" y="204" fill="#5d675f" font-size="14" font-weight="500" text-anchor="start">Limit tree depth or require more points in each leaf.</text><text x="16" y="222" fill="#5d675f" font-size="14" font-weight="500" text-anchor="start">Both make it harder to split off a single noisy example.</text>
</g></g>
<g id="card-06" transform="translate(638 98)" aria-label="Tree Depth and Overfitting">
<rect x="0.5" y="2.5" width="591" height="393" rx="18" fill="#e6e5de"/>
<rect x="0.5" y="0.5" width="591" height="393" rx="18" fill="#fffefa" stroke="#dedfd8"/>
<rect x="25" y="17" width="101" height="26" rx="13" fill="#f8ece3"/>
<text x="75.5" y="35" font-size="13" fill="#934723" font-weight="700" text-anchor="middle">Interactive</text>
<text x="567" y="35" font-size="13" fill="#656c62" font-weight="600" text-anchor="end">06 / 12</text>
<text x="25" y="76" font-size="27" fill="#202723" font-weight="700" text-anchor="start">Tree Depth and Overfitting</text>
<text x="26" y="102" font-size="14.5" fill="#505b52" font-weight="400" text-anchor="start">Compare two trees on the same points. The deeper tree carves out</text>
<text x="26" y="120" font-size="14.5" fill="#505b52" font-weight="400" text-anchor="start">a corner for a noisy point and misclassifies another held-out point.</text>
<g transform="translate(26 132)">
<rect x="0" y="0" width="337" height="184" rx="10" fill="#fff" stroke="#e3e7e0"/><rect x="350" y="0" width="190" height="184" rx="10" fill="#f6f8f4" stroke="#e3e7e0"/><rect x="37" y="14" width="132" height="132" rx="0" fill="#edf3fc" stroke="none"/><rect x="169" y="14" width="153" height="132" rx="0" fill="#edf6ef" stroke="none"/><rect x="231" y="14" width="91" height="58" rx="0" fill="#edf3fc" stroke="none"/><line x1="37" y1="146" x2="322" y2="146" stroke="#9ca79d" stroke-width="1"/><line x1="37" y1="14" x2="37" y2="146" stroke="#9ca79d" stroke-width="1"/><line x1="169" y1="14" x2="169" y2="146" stroke="#95a796" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="231" y1="14" x2="231" y2="72" stroke="#95a796" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="231" y1="72" x2="322" y2="72" stroke="#95a796" stroke-width="1.5" stroke-dasharray="4 4"/><text x="15" y="22" fill="#5d675f" font-size="12" font-weight="500" text-anchor="start">y</text><text x="318" y="162" fill="#5d675f" font-size="12" font-weight="500" text-anchor="start">x</text><circle cx="54" cy="54" r="5.5" fill="#426db2" stroke="#426db2" stroke-width="1"/><circle cx="81" cy="94" r="5.5" fill="#426db2" stroke="#426db2" stroke-width="1"/><circle cx="120" cy="70" r="5.5" fill="#426db2" stroke="#426db2" stroke-width="1"/><circle cx="266" cy="46" r="5.5" fill="#426db2" stroke="#426db2" stroke-width="1"/><circle cx="191" cy="43" r="5.5" fill="#267657" stroke="#267657" stroke-width="1"/><circle cx="222" cy="85" r="5.5" fill="#267657" stroke="#267657" stroke-width="1"/><circle cx="276" cy="102" r="5.5" fill="#267657" stroke="#267657" stroke-width="1"/><circle cx="315" cy="77" r="5.5" fill="#267657" stroke="#267657" stroke-width="1"/><circle cx="68" cy="71" r="5.5" fill="#fff" stroke="#426db2" stroke-width="2"/><circle cx="130" cy="114" r="5.5" fill="#fff" stroke="#426db2" stroke-width="2"/><circle cx="204" cy="123" r="5.5" fill="#fff" stroke="#426db2" stroke-width="2"/><circle cx="195" cy="63" r="5.5" fill="#fff" stroke="#267657" stroke-width="2"/><circle cx="286" cy="48" r="5.5" fill="#fff" stroke="#267657" stroke-width="2"/><circle cx="313" cy="120" r="5.5" fill="#fff" stroke="#267657" stroke-width="2"/><circle cx="58" cy="169" r="4" fill="#426db2" stroke="#426db2" stroke-width="1"/><text x="69" y="174" fill="#5d675f" font-size="13" font-weight="500" text-anchor="start">Training</text><circle cx="156" cy="169" r="4" fill="#fff" stroke="#426db2" stroke-width="2"/><text x="167" y="174" fill="#5d675f" font-size="13" font-weight="500" text-anchor="start">Held out</text><text x="365" y="29" fill="#202723" font-size="15" font-weight="650" text-anchor="start">Correct predictions</text><line x1="365" y1="43" x2="525" y2="43" stroke="#e3e7e0" stroke-width="1"/><text x="365" y="68" fill="#5d675f" font-size="14" font-weight="500" text-anchor="start">Training</text><text x="525" y="68" fill="#267657" font-size="18" font-weight="700" text-anchor="end">8 / 8</text><text x="365" y="101" fill="#5d675f" font-size="14" font-weight="500" text-anchor="start">Held out</text><text x="525" y="101" fill="#b86232" font-size="18" font-weight="700" text-anchor="end">4 / 6</text><line x1="365" y1="118" x2="525" y2="118" stroke="#e3e7e0" stroke-width="1"/><text x="365" y="143" fill="#5d675f" font-size="13" font-weight="650" text-anchor="start">At depth 1</text><text x="365" y="167" fill="#5d675f" font-size="13" font-weight="500" text-anchor="start">7 / 8 train</text><text x="525" y="167" fill="#5d675f" font-size="13" font-weight="500" text-anchor="end">5 / 6 held out</text><rect x="0" y="201" width="540" height="36" rx="10" fill="#f6f8f4" stroke="#e3e7e0"/><text x="14" y="224" fill="#202723" font-size="14" font-weight="650" text-anchor="start">Tree depth</text><rect x="372" y="205" width="73" height="28" rx="7" fill="#fff" stroke="#e3e7e0"/><rect x="450" y="205" width="83" height="28" rx="7" fill="#faf0e7" stroke="#e8cdb8"/><text x="408.5" y="224" fill="#202723" font-size="14" font-weight="600" text-anchor="middle">1</text><text x="491.5" y="224" fill="#b86232" font-size="14" font-weight="700" text-anchor="middle">3</text>
</g></g>
<g id="card-07" transform="translate(26 510)" aria-label="Regression Tree Explorer">
<rect x="0.5" y="2.5" width="591" height="393" rx="18" fill="#e6e5de"/>
<rect x="0.5" y="0.5" width="591" height="393" rx="18" fill="#fffefa" stroke="#dedfd8"/>
<rect x="25" y="17" width="101" height="26" rx="13" fill="#f8ece3"/>
<text x="75.5" y="35" font-size="13" fill="#934723" font-weight="700" text-anchor="middle">Interactive</text>
<text x="567" y="35" font-size="13" fill="#656c62" font-weight="600" text-anchor="end">07 / 12</text>
<text x="25" y="76" font-size="27" fill="#202723" font-weight="700" text-anchor="start">Regression Tree Explorer</text>
<text x="26" y="102" font-size="14.5" fill="#505b52" font-weight="400" text-anchor="start">Move the cutoff to change the groups. Each leaf predicts the</text>
<text x="26" y="120" font-size="14.5" fill="#505b52" font-weight="400" text-anchor="start">average target value of the points on its side.</text>
<g transform="translate(26 132)">
<rect x="0" y="0" width="337" height="184" rx="10" fill="#fff" stroke="#e3e7e0"/><rect x="350" y="0" width="190" height="184" rx="10" fill="#f6f8f4" stroke="#e3e7e0"/><rect x="37" y="15" width="142" height="140" rx="0" fill="#edf3fc" stroke="none"/><rect x="179" y="15" width="142" height="140" rx="0" fill="#edf6ef" stroke="none"/><line x1="37" y1="155" x2="321" y2="155" stroke="#9ca79d" stroke-width="1"/><line x1="37" y1="15" x2="37" y2="155" stroke="#9ca79d" stroke-width="1"/><line x1="179" y1="15" x2="179" y2="155" stroke="#b86232" stroke-width="1.8" stroke-dasharray="5 4"/><line x1="38" y1="129.7" x2="178" y2="129.7" stroke="#426db2" stroke-width="2.3"/><line x1="180" y1="53.7" x2="320" y2="53.7" stroke="#267657" stroke-width="2.3"/><text x="17" y="27" fill="#5d675f" font-size="12" font-weight="500" text-anchor="start">y</text><text x="318" y="173" fill="#5d675f" font-size="12" font-weight="500" text-anchor="start">x</text><circle cx="57" cy="136" r="5.5" fill="#426db2" stroke="#426db2" stroke-width="1"/><text x="57" y="173" fill="#5d675f" font-size="11" font-weight="500" text-anchor="middle">1</text><circle cx="106" cy="117" r="5.5" fill="#426db2" stroke="#426db2" stroke-width="1"/><text x="106" y="173" fill="#5d675f" font-size="11" font-weight="500" text-anchor="middle">2</text><circle cx="155" cy="136" r="5.5" fill="#426db2" stroke="#426db2" stroke-width="1"/><text x="155" y="173" fill="#5d675f" font-size="11" font-weight="500" text-anchor="middle">3</text><circle cx="204" cy="60" r="5.5" fill="#267657" stroke="#267657" stroke-width="1"/><text x="204" y="173" fill="#5d675f" font-size="11" font-weight="500" text-anchor="middle">4</text><circle cx="253" cy="41" r="5.5" fill="#267657" stroke="#267657" stroke-width="1"/><text x="253" y="173" fill="#5d675f" font-size="11" font-weight="500" text-anchor="middle">5</text><circle cx="302" cy="60" r="5.5" fill="#267657" stroke="#267657" stroke-width="1"/><text x="302" y="173" fill="#5d675f" font-size="11" font-weight="500" text-anchor="middle">6</text><text x="365" y="29" fill="#202723" font-size="15" font-weight="650" text-anchor="start">Predicted values</text><line x1="365" y1="43" x2="525" y2="43" stroke="#e3e7e0" stroke-width="1"/><text x="365" y="69" fill="#5d675f" font-size="14" font-weight="500" text-anchor="start">Left mean</text><text x="525" y="69" fill="#426db2" font-size="18" font-weight="700" text-anchor="end">1.33</text><text x="365" y="103" fill="#5d675f" font-size="14" font-weight="500" text-anchor="start">Right mean</text><text x="525" y="103" fill="#267657" font-size="18" font-weight="700" text-anchor="end">5.33</text><line x1="365" y1="119" x2="525" y2="119" stroke="#e3e7e0" stroke-width="1"/><text x="365" y="145" fill="#5d675f" font-size="13" font-weight="500" text-anchor="start">Variance reduction</text><text x="525" y="167" fill="#202723" font-size="18" font-weight="700" text-anchor="end">4.00</text><rect x="0" y="201" width="540" height="36" rx="10" fill="#f6f8f4" stroke="#e3e7e0"/><text x="14" y="224" fill="#202723" font-size="14" font-weight="650" text-anchor="start">Split cutoff</text><line x1="142" y1="219" x2="460" y2="219" stroke="#d4dbd3" stroke-width="4"/><line x1="142" y1="219" x2="301" y2="219" stroke="#d29a72" stroke-width="4"/><circle cx="301" cy="219" r="6" fill="#b86232" stroke="#b86232" stroke-width="1"/><text x="525" y="224" fill="#b86232" font-size="14" font-weight="700" text-anchor="end">3.5</text>
</g></g>
<g id="card-08" transform="translate(638 510)" aria-label="Why a Forest Is More Stable">
<rect x="0.5" y="2.5" width="591" height="393" rx="18" fill="#e6e5de"/>
<rect x="0.5" y="0.5" width="591" height="393" rx="18" fill="#fffefa" stroke="#dedfd8"/>
<rect x="25" y="17" width="101" height="26" rx="13" fill="#eaf1fb"/>
<text x="75.5" y="35" font-size="13" fill="#375d92" font-weight="700" text-anchor="middle">Explanation</text>
<text x="567" y="35" font-size="13" fill="#656c62" font-weight="600" text-anchor="end">08 / 12</text>
<text x="25" y="76" font-size="27" fill="#202723" font-weight="700" text-anchor="start">Why a Forest Is More Stable</text>
<text x="26" y="102" font-size="14.5" fill="#505b52" font-weight="400" text-anchor="start">For a true value of 70, individual trees can miss in different</text>
<text x="26" y="120" font-size="14.5" fill="#505b52" font-weight="400" text-anchor="start">directions. Their average is less sensitive to any one prediction.</text>
<g transform="translate(26 132)">
<rect x="0" y="0" width="172" height="97" rx="10" fill="#f6f8f4" stroke="#e3e7e0"/><text x="14" y="28" fill="#5d675f" font-size="14" font-weight="650" text-anchor="start">Tree 1</text><text x="14" y="71" fill="#426db2" font-size="32" font-weight="700" text-anchor="start">62</text><rect x="184" y="0" width="172" height="97" rx="10" fill="#f6f8f4" stroke="#e3e7e0"/><text x="198" y="28" fill="#5d675f" font-size="14" font-weight="650" text-anchor="start">Tree 2</text><text x="198" y="71" fill="#b86232" font-size="32" font-weight="700" text-anchor="start">78</text><rect x="368" y="0" width="172" height="97" rx="10" fill="#f6f8f4" stroke="#e3e7e0"/><text x="382" y="28" fill="#5d675f" font-size="14" font-weight="650" text-anchor="start">Tree 3</text><text x="382" y="71" fill="#267657" font-size="32" font-weight="700" text-anchor="start">71</text><rect x="0" y="111" width="540" height="52" rx="10" fill="#edf6ef" stroke="none"/><text x="15" y="143" fill="#202723" font-size="16" font-weight="650" text-anchor="start">Forest average</text><text x="525" y="146" fill="#267657" font-size="24" font-weight="700" text-anchor="end">70.3</text><rect x="0" y="177" width="540" height="56" rx="10" fill="#f6f8f4" stroke="#e3e7e0"/><text x="15" y="201" fill="#202723" font-size="14" font-weight="650" text-anchor="start">Different samples</text><text x="15" y="222" fill="#5d675f" font-size="13" font-weight="500" text-anchor="start">Each tree sees a bootstrap draw.</text><line x1="269" y1="189" x2="269" y2="223" stroke="#e3e7e0" stroke-width="1"/><text x="284" y="201" fill="#202723" font-size="14" font-weight="650" text-anchor="start">Different candidate features</text><text x="284" y="222" fill="#5d675f" font-size="13" font-weight="500" text-anchor="start">Each split considers a random subset.</text>
</g></g>
</g>
</svg>

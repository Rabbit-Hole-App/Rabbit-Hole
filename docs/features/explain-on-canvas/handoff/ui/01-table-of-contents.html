<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rabbit Hole — unified Table of contents</title>
<!--
MOCKUP ONLY. Existing UI checked against main 72d6536657af269bb894511220975fd2254246ed.
Updated from the supplied tutor-unified-toc(2).html; this is the Table of contents only.
Reuse TableOfContents.jsx and learn-outline-model.js: outlineTree, H1/H2/H3,
descriptions, manual Circle checkboxes, fold controls and onShow navigation.
Retain the existing panel header, typography, colors, numbering and tree spacing.
Show only the accepted roadmap tree here. Parameters, draft review, roadmap acceptance,
roadmap editing, ending and the Tutor conversation belong in Chat.
One flex:1/min-height:0/overflow-y:auto tree body; no split panel or conversation footer.
Mockup panel width 480px; production retains ResizableSidePanel and saved learner width.
Manual completion does not imply delivery or assessed understanding.
HTML is a visual reference, not an application implementation or a live canvas connection.
-->
<style>
:root{color-scheme:dark;--surface:#191919;--ink:#d4d4d4;--secondary:#a1a1a1;--tertiary:#6f6f6f;--line:#2f2f2f;--line-strong:#4a4a4a;--hover:#2c2c2c;--accent:#2383e2;--primary:#1b6fc2;--nav-bg:#453060;--nav-fg:#e1cff9}
*{box-sizing:border-box}body{margin:0;background:#111;color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.demo{width:min(100% - 32px,480px);margin:20px auto}
.demo-caption{display:flex;justify-content:space-between;gap:16px;color:var(--secondary);font-size:11px;margin:0 0 10px}
.demo-caption span:last-child{color:var(--tertiary)}
.panel{height:calc(100dvh - 80px);min-height:460px;max-height:1000px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{color:inherit;background:none;border:0}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.panel-header{height:54px;flex:0 0 54px;padding:10px 20px 11px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.tabs,.utilities{display:flex;gap:2px;align-items:center}.icon{width:30px;height:32px;display:grid;place-items:center;border-radius:6px;padding:0;color:var(--secondary)}
.icon:hover{background:var(--hover);color:var(--ink)}.icon.active{background:var(--nav-bg);color:var(--nav-fg)}.icon.pinned{background:var(--hover);color:var(--ink)}
.toc-header{flex:0 0 auto;min-height:52px;padding:12px 20px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:16px;font-weight:600;line-height:24px;margin:0}
.heading-tools{display:flex;gap:2px;align-items:center;color:var(--secondary)}
.heading-tools>span{font-size:20px;font-weight:300;color:var(--tertiary);margin-right:2px}
.heading-tools button{height:28px;width:28px;border-radius:4px;padding:0;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.heading-tools button sub{font-size:9px;align-self:center;transform:translateY(3px);padding-left:1px}
.heading-tools button:hover{background:var(--hover);color:var(--ink)}
/* The only scrolling region in the panel: the accepted roadmap tree. */
.toc-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 20px 20px;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#4a4a4a transparent}
.tree,.tree ol{padding:0;margin:0;list-style:none}
.tree>li+li{margin-top:28px}
.tree>li{position:relative}
.tree>li:not(:last-child):before{content:"";position:absolute;top:12px;bottom:-40px;left:11.5px;width:1px;background:var(--line);pointer-events:none}
.row{position:relative;display:flex;align-items:flex-start;gap:12px;border-radius:2px}
.check-wrap{position:relative;width:24px;height:24px;flex:0 0 24px;display:flex;align-items:center;justify-content:center}
.check-wrap input{position:absolute;inset:0;width:24px;height:24px;opacity:0;cursor:pointer;margin:0}
.circle{position:relative;width:16px;height:16px;border:1.5px solid var(--tertiary);background:var(--surface);border-radius:50%;display:grid;place-items:center;pointer-events:none}
.circle svg{display:none;width:11px;height:11px;stroke-width:3;color:#fff}
.check-wrap input:checked+.circle{background:var(--accent);border-color:var(--accent)}.check-wrap input:checked+.circle svg{display:block}
.check-wrap input:focus-visible+.circle{outline:2px solid var(--accent);outline-offset:3px}
.row.current .circle{box-shadow:0 0 0 3px #2383e24d}
.number{min-width:18px;margin-right:-4px;flex-shrink:0;font-size:12px;line-height:20px;padding-top:3px;color:var(--secondary);font-variant-numeric:tabular-nums}
.content{min-width:0;flex:1}
.title{font-size:16px;font-weight:600;line-height:24px;text-align:left;padding:0;overflow-wrap:anywhere;border-radius:2px}
.title:hover,.current .title{color:var(--accent)}
.description{font-size:14px;line-height:21px;margin:4px 0 0;color:var(--secondary);overflow-wrap:anywhere}
.state{font-size:11px;line-height:16px;margin-top:5px;color:var(--secondary)}
.state.ready{color:#6bb4ff}
.fold{height:24px;width:24px;padding:0;flex-shrink:0;display:grid;place-items:center;color:var(--tertiary);border-radius:4px}
.fold:hover{background:var(--hover);color:var(--ink)}
.fold svg{transition:transform 120ms ease}.fold[aria-expanded=true] svg{transform:rotate(90deg)}
.children{margin:14px 0 0 24px!important}.children>li+li{margin-top:14px}.children .title{font-size:14px;font-weight:500;line-height:20px}.children .description{font-size:13px;line-height:19.5px}.children .number{min-width:36px;padding-top:1px;font-size:13px}.children .check-wrap{height:20px}.children .row{gap:12px}
.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
[contenteditable=true]{outline:1px solid var(--line-strong);padding:2px 4px}
@media(max-width:520px){.demo{width:100%;margin:0}.demo-caption{padding:8px 16px;margin:0}.panel{height:calc(100dvh - 32px);border-left:0;border-right:0;min-height:380px}}
@media(prefers-reduced-motion:reduce){.fold svg{transition:none}}
</style>
</head>
<body>
<div class="demo">
 <div class="demo-caption"><span>Unified ToC · proposed UI</span><span>One tree · one scroll area</span></div>
 <aside class="panel" aria-label="Table of contents mockup">
  <nav class="panel-header" aria-label="Existing panel header">
   <div class="tabs">
    <button class="icon" title="Chat" aria-label="Chat (visual reference)"><svg viewBox="0 0 24 24"><path d="M21 15a3 3 0 0 1-3 3H7l-4 3V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/><path d="M7 7h10M7 11h7"/></svg></button>
    <button class="icon" title="Find" aria-label="Find (visual reference)"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg></button>
    <button class="icon active" title="Table of contents" aria-label="Table of contents" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1v15"/></svg></button>
    <button class="icon" title="Comments" aria-label="Comments (visual reference)"><svg viewBox="0 0 24 24"><path d="M21 11a9 9 0 0 1-13 8l-6 2 2-6A9 9 0 1 1 21 11Z"/></svg></button>
    <button class="icon" title="Progress" aria-label="Progress (visual reference)"><svg viewBox="0 0 24 24"><path d="M3 3v18h18M7 16v-4M12 16V7M17 16V4"/></svg></button>
   </div>
   <div class="utilities">
    <button class="icon" title="Context" aria-label="Context (visual reference)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button>
    <button class="icon pinned" title="Keep sidebar open" aria-label="Keep sidebar open (visual reference)"><svg viewBox="0 0 24 24"><path d="M8 3h8l-1 7 4 4v2H5v-2l4-4-1-7ZM12 16v6"/></svg></button>
    <button class="icon" title="Close sidebar" aria-label="Close sidebar (visual reference)"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
   </div>
  </nav>
  <div class="toc-header">
   <h1>Table of contents</h1>
   <div class="heading-tools" aria-label="Existing section tools"><span aria-hidden="true">+</span><button data-add="1" title="Add section" aria-label="Add section">H<sub>1</sub></button><button data-add="2" title="Add sub-section" aria-label="Add sub-section">H<sub>2</sub></button><button data-add="3" title="Add sub-sub-section" aria-label="Add sub-sub-section">H<sub>3</sub></button></div>
  </div>
  <div class="toc-scroll" id="toc-scroll">
   <ol class="tree" id="tree"></ol>
  </div>
  <div class="sr-only" aria-live="polite" id="announcement"></div>
 </aside>
</div>
<script>
const items=[
{title:'Why trees, and what a tree does',description:'See how a series of yes/no questions divides the data and produces a prediction.'},
{title:'Measuring impurity',description:'Compare Gini and entropy to understand what makes a group of examples more consistent.',children:[
 {title:'Gini impurity',description:'Work through one small calculation using a mixed group of examples.'},
 {title:'Entropy',description:'Compare the same split using a second measure of uncertainty.'}
]},
{title:'Information gain and greedy splitting',description:'Choose between candidate splits and understand why the tree decides one split at a time.'},
{title:'Stopping the tree',description:'See how depth limits and minimum leaf size control complexity and overfitting.'},
{title:'Random forests',description:'Understand how bagging and random feature choices make individual trees differ.'},
{title:'Feature importance',description:'Compare impurity-based and permutation importance, including their limitations.'},
{title:'When trees beat neural networks',description:'Identify where tree models are useful without treating that advantage as universal.'},
{title:'Building a tree from scratch',description:'Connect the split rule, stopping condition and prediction to a small implementation.'},
{title:'Using it in practice',description:'Put the ideas together and explain the choices behind a simple tree or forest.'}
];
const arrow='<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>';
const check='<svg viewBox="0 0 16 16"><path d="m3 8 3 3 7-7"/></svg>';
let counter=0;
const announce=text=>document.getElementById('announcement').textContent=text;
function makeEntry(item,number,level=1){
 const id='section-'+(++counter),li=document.createElement('li');
 const row=document.createElement('div');row.className='row';row.dataset.section=id;
 const label=document.createElement('label');label.className='check-wrap';label.title='Mark section done (manual)';
 const input=document.createElement('input');input.type='checkbox';input.setAttribute('aria-label',item.title+' done');
 const circle=document.createElement('span');circle.className='circle';circle.setAttribute('aria-hidden','true');circle.innerHTML=check;label.append(input,circle);
 const n=document.createElement('span');n.className='number';n.textContent=number;
 const content=document.createElement('div');content.className='content';
 const title=document.createElement('button');title.className='title';title.type='button';title.textContent=item.title;title.title='Select section; double-click to edit';
 title.onclick=()=>{document.querySelectorAll('.row.current').forEach(r=>r.classList.remove('current'));row.classList.add('current');announce('Selected '+number+' '+title.textContent+'. In RH this navigates to its linked canvas content or proposal.');};
 title.ondblclick=()=>{title.contentEditable='true';title.focus();};
 title.onkeydown=event=>{if(title.isContentEditable&&event.key==='Enter'){event.preventDefault();title.blur();}};
 title.onblur=()=>title.contentEditable='false';
 const desc=document.createElement('p');desc.className='description';desc.textContent=item.description;
 content.append(title,desc);
 if(level===1){const state=document.createElement('div');state.className='state';state.textContent='Planned · Explanation';content.append(state);}
 row.append(label,n,content);li.append(row);
 if(item.children){
  const sub=document.createElement('ol');sub.className='children';sub.id=id+'-children';
  item.children.forEach((child,j)=>sub.append(makeEntry(child,number+'.'+(j+1),level+1)));
  const fold=document.createElement('button');fold.className='fold';fold.type='button';fold.setAttribute('aria-expanded','true');fold.setAttribute('aria-controls',sub.id);fold.setAttribute('aria-label','Collapse '+item.title);fold.innerHTML=arrow;
  fold.onclick=()=>{const open=fold.getAttribute('aria-expanded')==='true';fold.setAttribute('aria-expanded',String(!open));fold.setAttribute('aria-label',(open?'Expand ':'Collapse ')+item.title);sub.classList.toggle('hidden',open);};
  row.append(fold);li.append(sub);
 }
 return li;
}
const tree=document.getElementById('tree');items.forEach((item,i)=>tree.append(makeEntry(item,String(i+1))));
document.querySelectorAll('[data-add]').forEach(button=>button.onclick=()=>{
 const level=Number(button.dataset.add);
 const entry={title:level===1?'New section':level===2?'New sub-section':'New sub-sub-section',description:'Add a short description of what this section covers.'};
 if(level===1)tree.append(makeEntry(entry,String(tree.children.length+1)));
 else{let parent=tree.lastElementChild,sub=parent.querySelector(':scope > .children');if(!sub){sub=document.createElement('ol');sub.className='children';parent.append(sub);}if(level===3){let last=sub.lastElementChild;if(!last){last=makeEntry({title:'New sub-section',description:'What this part covers.'},tree.children.length+'.1',2);sub.append(last);}let nested=last.querySelector(':scope > .children');if(!nested){nested=document.createElement('ol');nested.className='children';last.append(nested);}nested.append(makeEntry(entry,tree.children.length+'.'+sub.children.length+'.'+(nested.children.length+1),3));}else sub.append(makeEntry(entry,tree.children.length+'.'+(sub.children.length+1),2));}
 const all=tree.querySelectorAll('.title');const title=all[all.length-1];title.contentEditable='true';title.focus();title.scrollIntoView({block:'nearest'});
});
</script>
</body>
</html>

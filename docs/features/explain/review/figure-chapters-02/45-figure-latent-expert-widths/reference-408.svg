<svg xmlns="http://www.w3.org/2000/svg" width="408" height="738" viewBox="0 0 408 738" role="img" aria-label="Only selected experts use the smaller state
Read the full state: simultaneous parallel routes
Add the two results: merge incoming routes before continuing
Read the full state → Choose experts from the full state
Choose experts from the full state → Project to a smaller state
Project to a smaller state → Run the selected experts
Run the selected experts → Project the routed sum back
Read the full state → Run the shared expert at full size
Project the routed sum back → Add the two results
Run the shared expert at full size → Add the two results
Add the two results → Return the update

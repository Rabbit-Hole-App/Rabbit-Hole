<svg xmlns="http://www.w3.org/2000/svg" width="408" height="383" viewBox="0 0 408 383" role="img" aria-label="Autoregressive text generation steps
Prompt: Read the input prompt — The model processes the initial token sequence.
First step: Sample the next token — Choose the highest-scoring token from the distribution.
Second step: Append and repeat — Use the expanded text as the prefix for the next call.

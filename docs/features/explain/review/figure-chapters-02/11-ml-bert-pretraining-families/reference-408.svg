<svg xmlns="http://www.w3.org/2000/svg" width="408" height="482" viewBox="0 0 408 482" role="img" aria-label="BERT and earlier language models
Transformer: Architecture: Encoder and decoder; Training objective: Translation example
ULMFiT: Architecture: Forward LSTM; Training objective: Next-token prediction
ELMo: Architecture: Two directional LSTMs; Training objective: Directional prediction
Original GPT: Architecture: Causal decoder; Training objective: Next-token prediction
BERT: Architecture: Bidirectional encoder; Training objective: Recover masked tokens

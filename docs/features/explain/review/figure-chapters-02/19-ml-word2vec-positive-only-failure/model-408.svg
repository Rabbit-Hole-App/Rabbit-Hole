<svg xmlns="http://www.w3.org/2000/svg" width="408" height="372" viewBox="0 0 408 372" role="img" aria-label="Positive pairs alone cannot teach contrast
Observed pair one: Candidate word: robot; True status: Neighbor; Always predict: Right
Observed pair two: Candidate word: seeds; True status: Neighbor; Always predict: Right
Sampled comparison: Candidate word: bulbs; True status: Negative; Always predict: Wrong

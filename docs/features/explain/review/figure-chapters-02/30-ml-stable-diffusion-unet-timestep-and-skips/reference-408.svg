<svg xmlns="http://www.w3.org/2000/svg" width="408" height="907" viewBox="0 0 408 907" role="img" aria-label="Timestep inputs and skip paths inside a U-Net
Noisy latent — Supplies features → Down residual block
Timestep embedding — Sets noise level → Down residual block
Timestep embedding — Sets the same level → Up residual block
Down residual block — Compresses features → Bottleneck
Bottleneck — Sends refined features → Up residual block
Down residual block — Reuses early details → Up residual block
Up residual block — Predicts noise → Noise estimate
Both stages get the noise level. The shortcut carries earlier details." font-family="Inter, Liberation Sans, Arial, sans-serif" style="display:block;max-width:none;margin-inline:auto;--color-ink:#202723;--color-ink-2:#5d675f;--color-line:#e3e7e0;--viz-surface:#fffefa" data-tutor-diagram="relationship"><title>Timestep inputs and skip paths inside a U-Net</title><rect x="0.5" y="0.5" width="407" height="906" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">Timestep inputs and skip paths</tspan><tspan x="204" y="50.28">inside a U-Net</tspan></text><g transform="translate(0 61)"><g data-tutor-edge="x:down" data-tutor-edge-index="0"><g><polyline points="204,29 228,29 228,200.8 204,200.8" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,200.8 211,197.4 211,204.20000000000002" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="228" cy="70" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="228" y="70" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="228" y="74.08">1</tspan></text></g><g data-tutor-edge="t:down" data-tutor-edge-index="1"><g><polyline points="204,111.33333333333333 252,111.33333333333333 252,207.6 204,207.6" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,207.6 211,204.2 211,211" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="252" cy="170" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="252" y="170" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="252" y="174.08">2</tspan></text></g><g data-tutor-edge="t:up" data-tutor-edge-index="2"><g><polyline points="204,128.66666666666666 276,128.66666666666666 276,364.8 204,364.8" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,364.8 211,361.40000000000003 211,368.2" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="276" cy="170" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="276" y="170" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="276" y="174.08">3</tspan></text></g><g data-tutor-edge="down:middle" data-tutor-edge-index="3"><g><polyline points="204,214.4 300,214.4 300,287.3333333333333 204,287.3333333333333" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,287.3333333333333 211,283.93333333333334 211,290.7333333333333" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="300" cy="252" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="300" y="252" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="300" y="256.08">4</tspan></text></g><g data-tutor-edge="middle:up" data-tutor-edge-index="4"><g><polyline points="204,298.6666666666667 324,298.6666666666667 324,371.6 204,371.6" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,371.6 211,368.20000000000005 211,375" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="324" cy="334" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="324" y="334" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="324" y="338.08">5</tspan></text></g><g data-tutor-edge="down:up" data-tutor-edge-index="5"><g><polyline points="204,221.2 348,221.2 348,378.4 204,378.4" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,378.4 211,375 211,381.79999999999995" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="348" cy="252" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="348" y="252" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="348" y="256.08">6</tspan></text></g><g data-tutor-edge="up:output" data-tutor-edge-index="6"><g><polyline points="204,385.2 372,385.2 372,457 204,457" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,457 211,453.6 211,460.4" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="372" cy="416" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="372" y="416" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="372" y="420.08">7</tspan></text></g><g data-tutor-node="x"><rect x="18" y="12" width="186" height="34" rx="9" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="111" y="29" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="111" y="33.76">Noisy latent</tspan></text></g><g data-tutor-node="t"><rect x="18" y="94" width="186" height="52" rx="9" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="111" y="120" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="111" y="115.76">Timestep</tspan><tspan x="111" y="133.76">embedding</tspan></text></g><g data-tutor-node="down"><rect x="18" y="194" width="186" height="34" rx="9" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="111" y="211" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="111" y="215.76">Down residual block</tspan></text></g><g data-tutor-node="middle"><rect x="18" y="276" width="186" height="34" rx="9" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="111" y="293" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="111" y="297.76">Bottleneck</tspan></text></g><g data-tutor-node="up"><rect x="18" y="358" width="186" height="34" rx="9" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="111" y="375" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="111" y="379.76">Up residual block</tspan></text></g><g data-tutor-node="output"><rect x="18" y="440" width="186" height="34" rx="9" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="111" y="457" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="111" y="461.76">Noise estimate</tspan></text></g><text x="12" y="509" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="504.92">1. Noisy latent → Down residual block: Supplies</tspan><tspan x="12" y="521.92">features</tspan></text><text x="12" y="551" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="546.92">2. Timestep embedding → Down residual block:</tspan><tspan x="12" y="563.92">Sets noise level</tspan></text><text x="12" y="593" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="588.92">3. Timestep embedding → Up residual block: Sets</tspan><tspan x="12" y="605.92">the same level</tspan></text><text x="12" y="635" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="630.92">4. Down residual block → Bottleneck: Compresses</tspan><tspan x="12" y="647.92">features</tspan></text><text x="12" y="677" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="672.92">5. Bottleneck → Up residual block: Sends refined</tspan><tspan x="12" y="689.92">features</tspan></text><text x="12" y="719" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="714.92">6. Down residual block → Up residual block:</tspan><tspan x="12" y="731.92">Reuses early details</tspan></text><text x="12" y="761" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="756.92">7. Up residual block → Noise estimate: Predicts</tspan><tspan x="12" y="773.92">noise</tspan></text></g><text x="204" y="881" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="876.92">Both stages get the noise level. The shortcut</tspan><tspan x="204" y="893.92">carries earlier details.</tspan></text></svg>

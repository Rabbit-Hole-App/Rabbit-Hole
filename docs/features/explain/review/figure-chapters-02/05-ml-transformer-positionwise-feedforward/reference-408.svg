<svg xmlns="http://www.w3.org/2000/svg" width="408" height="864" viewBox="0 0 408 864" role="img" aria-label="Context mixing versus position-wise updates
cat before mixing — Contributes its own value → cat with context
sat before mixing — Contributes its own value → sat with context
cat before mixing — Contributes nearby context → sat with context
sat before mixing — Contributes nearby context → cat with context
cat with context — Runs the shared update → cat after update
sat with context — Runs the shared update → sat after update

<svg xmlns="http://www.w3.org/2000/svg" width="408" height="426" viewBox="0 0 408 426" role="img" aria-label="Context in GPT-2, BERT and Transformer-XL
GPT-2: Attention context: Causal attention within context; Example objective: Predict the next token

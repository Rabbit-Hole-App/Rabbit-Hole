span><tspan x="335.3333333333333" y="287.76">state reuse</tspan></text></g><text x="204" y="403" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="398.92">The context rule determines what each</tspan><tspan x="204" y="415.92">architecture can consult during processing.</tspan></text></svg>

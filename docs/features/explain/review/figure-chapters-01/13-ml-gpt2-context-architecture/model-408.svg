<svg xmlns="http://www.w3.org/2000/svg" width="408" height="429" viewBox="0 0 408 429" role="img" aria-label="Context in GPT-2, BERT, and Transformer-XL
GPT-2: Causal attention within context; Predict the next token; Autoregressive masking

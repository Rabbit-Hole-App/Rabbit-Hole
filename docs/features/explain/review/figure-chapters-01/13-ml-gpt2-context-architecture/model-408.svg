333333" y="50.76">r-XL</tspan></text><rect x="12" y="70" width="121.33333333333333" height="86" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="72.66666666666666" y="113" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="72.66666666666666" y="90.76">Causal</tspan><tspan x="72.66666666666666" y="108.76">attention</tspan><tspan x="72.66666666666666" y="126.76">within</tspan><tspan x="72.66666666666666" y="144.76">context</tspan></text><rect x="143.33333333333331" y="70" width="121.33333333333333" height="86" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="203.99999999999997" y="113" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="203.99999999999997" y="108.76">Bidirectional</tspan><tspan x="203.99999999999997" y="126.76">encoder</tspan></text><rect x="274.66666666666663" y="70" width="121.33333333333333" height="86" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="335.3333333333333" y="113" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="335.3333333333333" y="108.76">Causal plus</tspan><tspan x="335.3333333333333" y="126.76">memory</tspan></text><rect x="12" y="164" width="121.33333333333333" height="68" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="72.66666666666666" y="198" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="72.66666666666666" y="193.76">Predict the</tspan><tspan x="72.66666666666666" y="211.76">next token</tspan></text><rect x="143.33333333333331" y="164" width="121.33333333333333" height="68" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="203.99
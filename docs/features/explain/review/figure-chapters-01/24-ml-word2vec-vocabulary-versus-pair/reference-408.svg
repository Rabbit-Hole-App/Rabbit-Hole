<svg xmlns="http://www.w3.org/2000/svg" width="408" height="358" viewBox="0 0 408 358" role="img" aria-label="Full vocabulary versus sampled pair objective
Full softmax: Start with one center word; Score all vocabulary choices; Normalize the scores together
Negative sampling: Supply a center and candidate; Score only the chosen pairs; Check each pair separately

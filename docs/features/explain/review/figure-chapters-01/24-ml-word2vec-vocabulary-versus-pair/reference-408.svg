chor="middle"><tspan x="302.5" y="74.76">Supply a center and</tspan><tspan x="302.5" y="92.76">candidate</tspan></text><rect x="12" y="112" width="187" height="50" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="105.5" y="137" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="105.5" y="132.76">Score all vocabulary</tspan><tspan x="105.5" y="150.76">choices</tspan></text><rect x="209" y="112" width="187" height="50" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="302.5" y="137" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="302.5" y="132.76">Score only the</tspan><tspan x="302.5" y="150.76">chosen pairs</tspan></text><rect x="12" y="170" width="187" height="50" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="105.5" y="195" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="105.5" y="190.76">Normalize the</tspan><tspan x="105.5" y="208.76">scores together</tspan></text><rect x="209" y="170" width="187" height="50" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="302.5" y="195" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="302.5" y="190.76">Check each pair</tspan><tspan x="302.5" y="208.76">separately</tspan></text></g><text x="204" y="323.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="310.92">Full prediction scores every choice. Pair</tspan><tspan x="204" y="327.92">training scores one observed neighbor and some</tspan><tspan x="204" y="344.92">sampled alternatives.</tspan></text></svg>

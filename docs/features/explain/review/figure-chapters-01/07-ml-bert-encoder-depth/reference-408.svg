<svg xmlns="http://www.w3.org/2000/svg" width="408" height="325" viewBox="0 0 408 325" role="img" aria-label="A miniature BERT encoder stack
Token vectors → BERT encoder layer → Contextual token vectors
Token vectors
BERT encoder layer
Repeat BERT encoder layer 3 times
Contextual token vectors
Base uses fewer layers and narrower vectors than Large. Both return one vector for each input position." font-family="Inter, Liberation Sans, Arial, sans-serif" style="display:block;max-width:none;margin-inline:auto;--color-ink:#202723;--color-ink-2:#5d675f;--color-line:#e3e7e0;--viz-surface:#fffefa" data-tutor-diagram="block-stack"><title>A miniature BERT encoder stack</title><rect x="0.5" y="0.5" width="407" height="324" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="22.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">A miniature BERT encoder stack</tspan></text><g transform="translate(0 39)"><g><polyline points="204,52 204,70" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,70 200.6,63 207.4,63" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><g><polyline points="204,135 204,153" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="204,153 200.6,146 207.4,146" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><g data-block-stack-node="input"><rect x="87" y="12" width="234" height="40" rx="9" fill="#e7f3ed" stroke="#e3e7e0" stroke-width="1"></rect><text x="204" y="32" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="36.76">Token vectors</tspan></text></g><g data-block-stack-node="layer"><rect x="87" y="70" width="234" height="65" rx="9" fill="#eaf1fb" stroke="#e3e7e0" stroke-width="1"></rect><text x="204" y="89" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="93.76">BERT encoder layer</tspan></text><g data-block-stack-repeat=""><rect x="188.5" y="104" width="31" height="21" rx="9" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="204" y="114.5" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="204" y="118.58">×3</tspan></text></g></g><g data-block-stack-node="output"><rect x="87" y="153" width="234" height="56" rx="9" fill="#e7f3ed" stroke="#267657" stroke-width="1.5"></rect><text x="204" y="181" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="204" y="176.76">Contextual token</tspan><tspan x="204" y="194.76">vectors</tspan></text></g></g><text x="204" y="290.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="277.92">Base uses fewer layers and narrower vectors</tspan><tspan x="204" y="294.92">than Large. Both return one vector for each</tspan><tspan x="204" y="311.92">input position.</tspan></text></svg>

 after the mask → State at [MASK]:</tspan><tspan x="12" y="399.92">Provides a right cue</tspan></text><text x="12" y="429" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="424.92">3. State at [MASK] → Original word seal:</tspan><tspan x="12" y="441.92">Predicts the hidden word</tspan></text></g><text x="204" y="535.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="522.92">The original sentence supplies the answer. The</tspan><tspan x="204" y="539.92">model uses both sides to work out the missing</tspan><tspan x="204" y="556.92">word.</tspan></text></svg>

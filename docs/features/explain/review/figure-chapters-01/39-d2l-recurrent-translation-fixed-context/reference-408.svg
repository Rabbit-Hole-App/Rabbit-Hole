<svg xmlns="http://www.w3.org/2000/svg" width="408" height="699" viewBox="0 0 408 699" role="img" aria-label="Translation with a fixed encoder summary
red birds fly — Supplies ordered words → Reading network
Reading network — Compresses source history → Final source state
Final source state — Initializes writing state → First writing step
First writing step — Passes state to next word → Second writing step

<svg xmlns="http://www.w3.org/2000/svg" width="408" height="385" viewBox="0 0 408 385" role="img" aria-label="Gate the attention read before projecting it
Attention weighted read → Elementwise output gate → Attention output projection
Attention weighted read
Elementwise output gate
Token-derived sigmoid → Elementwise output gate multiply join
Elementwise output gate uses a multiply join
Attention output projection
The attention read is already computed. The gate scales it before projection. The feed-forward block comes separately." font-family="Inter, Liberation Sans, Arial, sans-serif" style="display:block;max-width:none;margin-inline:auto;--color-ink:#202723;--color-ink-2:#5d675f;--color-line:#e3e7e0;--viz-surface:#fffefa" data-tutor-diagram="block-stack"><title>Gate the attention read before projecting it</title><rect x="0.5" y="0.5" width="407" height="384" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">Gate the attention read before</tspan><tspan x="204" y="50.28">projecting it</tspan></text><g transform="translate(0 61)"><g><polyline points="269,52 269,70" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="269,70 265.6,63 272.4,63" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><g><polyline points="269,110 269,134.5" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="269,134.5 265.6,127.5 272.4,127.5" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><g><polyline points="269,154.5 269,191" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="269,191 265.6,184 272.4,184" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g><g data-block-stack-node="read"><rect x="152" y="12" width="234" height="40" rx="9" fill="#eaf1fb" stroke="#e3e7e0" stroke-width="1"></rect><text x="269" y="32" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="269" y="36.76">Attention weighted read</tspan></text></g><g data-block-stack-node="gate"><rect x="152" y="70" width="234" height="40" rx="9" fill="#eaf1fb" stroke="#e3e7e0" stroke-width="1"></rect><text x="269" y="90" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="269" y="94.76">Elementwise output gate</tspan></text></g><g data-block-stack-input-wire=""><g><polyline points="134,144.5 148,144.5 260,144.5" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="260,144.5 253,147.9 253,141.1" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-block-stack-input=""><rect x="22" y="116" width="112" height="57" rx="9" fill="#eaf1fb" stroke="#e3e7e0" stroke-width="1"></rect><text x="78" y="144.5" fill="var(--color-ink, #32211c)" font-size="12" font-weight="400" text-anchor="middle"><tspan x="78" y="133.58">Token-</tspan><tspan x="78" y="148.58">derived</tspan><tspan x="78" y="163.58">sigmoid</tspan></text></g><g data-block-stack-node="out"><rect x="152" y="191" width="234" height="56" rx="9" fill="#e7f3ed" stroke="#267657" stroke-width="1.5"></rect><text x="269" y="219" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="269" y="214.76">Attention output</tspan><tspan x="269" y="232.76">projection</tspan></text></g><g data-block-stack-merge="multiply"><circle cx="269" cy="144.5" r="10" fill="#fffefa"></circle><text x="269" y="144.5" fill="var(--color-ink, #32211c)" font-size="22" font-weight="700" text-anchor="middle"><tspan x="269" y="151.98">⊗</tspan></text></g></g><text x="204" y="350.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="337.92">The attention read is already computed. The</tspan><tspan x="204" y="354.92">gate scales it before projection. The</tspan><tspan x="204" y="371.92">feed-forward block comes separately.</tspan></text></svg>

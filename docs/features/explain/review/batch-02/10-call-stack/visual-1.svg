<svg xmlns="http://www.w3.org/2000/svg" width="406" height="555" viewBox="0 0 406 555" role="img" aria-label="Factorial of 3 calls down and returns up
1. Push the frame for factorial of 3 — Wait for factorial of 2.
2. Push the frame for factorial of 2 — Wait for factorial of 1.
3. Push the base case for factorial of 1 — Base case. No smaller call.
4. Pop the frame for 1 and return 1 — Send 1 back to the call for 2.
5. Pop the frame for 2 and return 2 — Multiply 2 times 1 equals 2 and send 2 back to the call for 3.
6. Pop the frame for 3 and return 6 — Multiply 3 times 2 equals 6 and return the final result.
Push each call onto the stack. The base case returns 1, then each earlier frame pops as it finishes." font-family="Arial, Liberation Sans, sans-serif" data-tutor-diagram="layers" style="display: block; max-width: none; margin-inline: auto;"><title>Factorial of 3 calls down and returns up</title><rect x="0.5" y="0.5" width="405" height="554" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="203" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="203" y="28.28">Factorial of 3 calls down and</tspan><tspan x="203" y="50.28">returns up</tspan></text><g transform="translate(0 61)"><rect x="12" y="12" width="382" height="56" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="203" y="29" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="203" y="33.76">1. Push the frame for factorial of 3</tspan></text><text x="203" y="51.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="203" y="55.92">Wait for factorial of 2.</tspan></text><rect x="12" y="75" width="382" height="56" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="203" y="92" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="203" y="96.76">2. Push the frame for factorial of 2</tspan></text><text x="203" y="114.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="203" y="118.92">Wait for factorial of 1.</tspan></text><rect x="12" y="138" width="382" height="56" rx="7" fill="#F58371" stroke="#32211c" stroke-width="1.5"></rect><text x="203" y="155" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="203" y="159.76">3. Push the base case for factorial of 1</tspan></text><text x="203" y="177.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="203" y="181.92">Base case. No smaller call.</tspan></text><rect x="12" y="201" width="382" height="56" rx="7" fill="#67B9A0" stroke="#32211c" stroke-width="1.5"></rect><text x="203" y="218" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="203" y="222.76">4. Pop the frame for 1 and return 1</tspan></text><text x="203" y="240.5" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="203" y="244.92">Send 1 back to the call for 2.</tspan></text><rect x="12" y="264" width="382" height="73" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="203" y="281" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="203" y="285.76">5. Pop the frame for 2 and return 2</tspan></text><text x="203" y="312" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="203" y="307.92">Multiply 2 times 1 equals 2 and send 2 back</tspan><tspan x="203" y="324.92">to the call for 3.</tspan></text><rect x="12" y="344" width="382" height="73" rx="7" fill="#95A448" stroke="#32211c" stroke-width="1.5"></rect><text x="203" y="361" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="203" y="365.76">6. Pop the frame for 3 and return 6</tspan></text><text x="203" y="392" fill="#32211c" font-size="13" font-weight="400" text-anchor="middle"><tspan x="203" y="387.92">Multiply 3 times 2 equals 6 and return the</tspan><tspan x="203" y="404.92">final result.</tspan></text></g><text x="203" y="520.5" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="203" y="507.92">Push each call onto the stack. The base case</tspan><tspan x="203" y="524.92">returns 1, then each earlier frame pops as it</tspan><tspan x="203" y="541.92">finishes.</tspan></text></svg>
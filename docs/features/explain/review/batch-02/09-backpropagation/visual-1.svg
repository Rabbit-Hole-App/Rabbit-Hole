<svg xmlns="http://www.w3.org/2000/svg" width="406" height="846" viewBox="0 0 406 846" role="img" aria-label="Backpropagation carries the loss gradient backward
Read input $x$ → Compute hidden activations $h$
Compute hidden activations $h$ → Compute prediction $\hat y$
Compute prediction $\hat y$ → Evaluate loss $L$
Evaluate loss $L$ — Start backward pass → Differentiate loss at prediction
Differentiate loss at prediction — $\partial L/\partial \hat y$ → Apply chain rule at output layer
Apply chain rule at output layer — $\partial L/\partial h$ → Apply chain rule at hidden layer
Apply chain rule at hidden layer — Gradients for both layers → Update weights $w\gets w-\eta\nabla_w L$
The backward pass reuses saved activations. At each layer, multiply the incoming loss gradient by local derivatives." font-family="Arial, Liberation Sans, sans-serif" data-tutor-diagram="flow" style="display: block; max-width: none; margin-inline: auto;"><title>Backpropagation carries the loss gradient backward</title><rect x="0.5" y="0.5" width="405" height="845" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="203" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="203" y="28.28">Backpropagation carries the loss</tspan><tspan x="203" y="50.28">gradient backward</tspan></text><g transform="translate(0 61)"><g data-tutor-edge="input:hidden"><g><polyline points="203,52 203,68 203,68 203,84" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="203,84 199.6,77 206.4,77" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-edge="hidden:output"><g><polyline points="203,134 203,150 203,150 203,166" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="203,166 199.6,159 206.4,159" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-edge="output:loss"><g><polyline points="203,216 203,232 203,232 203,248" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="203,248 199.6,241 206.4,241" fill="var(--color-ink, #32211c)" data-tutor-arrowhead=""></polygon></g></g><g data-tutor-edge="loss:seed"><g><polyline points="203,286 203,318 203,318 203,350" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="203,350 199.6,343 206.4,343" fill="var(--color-ink, #32211c)" data
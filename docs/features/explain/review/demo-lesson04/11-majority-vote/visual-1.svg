<svg xmlns="http://www.w3.org/2000/svg" width="440" height="489" viewBox="0 0 440 489" role="img" aria-label="Ensemble aggregation flow
Collect tree predictions: simultaneous parallel routes
Take majority vote: merge incoming routes before continuing
Collect tree predictions — Tree 1 → Predict class A
Collect tree predictions — Tree 2 → Predict class B
Collect tree predictions — Tree 3 → Predict class A
Predict class A → Take majority vote
Predict class B → Take majority vote
Predict class A → Take majority vote
Take majority vote → Output class A

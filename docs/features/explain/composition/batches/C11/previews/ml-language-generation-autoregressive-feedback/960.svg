<svg xmlns="http://www.w3.org/2000/svg" width="720" height="452" viewBox="0 0 720 452" role="img" aria-label="Encode once, then append each choice before the next call
Encode once: Encode source once; keep memory M — Source keys/values fixed before prediction; h is separately supplied.
Start: Call on $\text{&lt;bos&gt;}$; empty user text — Supplied birds begins at the second declared prefix.
Prediction 1: Emit birds; append — Next call uses $\text{&lt;bos&gt;}$ birds
Prediction 2: Emit fly; append — Next call uses $\text{&lt;bos&gt;}$ birds fly
Stop: Emit $\text{&lt;eos&gt;}$; append marker and STOP — No further call; visible text is birds fly
Given h per exact prefix; M is a fixed temporal interface, not a computation of h. Greedy tied toy head; visible text excludes BOS/EOS." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="timeline"><title>Encode once, then append each choice before the next call</title><rect x="0.5" y="0.5" width="719" height="451" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="360" y="22.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="360" y="28.28">Encode once, then append each choice before the next call</tspan></text><g transform="translate(0 39)"><polyline points="109,40.5 109,324.5" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><circle cx="109" cy="40.5" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><circle cx="109" cy="111.5" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><circle cx="109" cy="182.5" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><circle cx="109" cy="253.5" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><circle cx="109" cy="324.5" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><rect x="12" y="16.5" width="80" height="48" rx="16" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="52" y="40.5" fill="#32211c" font-size="13" font-weight="700" text-anchor="middle"><tspan x="52" y="36.42">Encode</tspan><tspan x="52" y="53.42">once</tspan></text><rect x="125" y="12" width="583" height="57" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="135" y="29" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="start"><tspan x="135" y="33.76">Encode source once; keep memory M</tspan></text><text x="135" y="52.5" fill="var(--color-in
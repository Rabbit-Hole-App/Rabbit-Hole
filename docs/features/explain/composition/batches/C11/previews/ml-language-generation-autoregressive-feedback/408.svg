<svg xmlns="http://www.w3.org/2000/svg" width="408" height="630" viewBox="0 0 408 630" role="img" aria-label="Encode once, then append each choice before the next call
Encode once: Encode source once; keep memory M — Source keys/values fixed before prediction; h is separately supplied.
Start: Call on $\text{&lt;bos&gt;}$; empty user text — Supplied birds begins at the second declared prefix.
Prediction 1: Emit birds; append — Next call uses $\text{&lt;bos&gt;}$ birds
Prediction 2: Emit fly; append — Next call uses $\text{&lt;bos&gt;}$ birds fly
Stop: Emit $\text{&lt;eos&gt;}$; append marker and STOP — No further call; visible text is birds fly
Given h per exact prefix; M is a fixed temporal interface, not a computation of h. Greedy tied toy head; visible text excludes BOS/EOS." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="timeline"><title>Encode once, then append each choice before the next call</title><rect x="0.5" y="0.5" width="407" height="629" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">Encode once, then append each</tspan><tspan x="204" y="50.28">choice before the next call</tspan></text><g transform="translate(0 61)"><polyline points="109,66.5 109,446" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><circle cx="109" cy="66.5" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><circle cx="109" cy="181" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><circle cx="109" cy="269.5" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><circle cx="109" cy="349" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><circle cx="109" cy="446" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><rect x="12" y="42.5" width="80" height="48" rx="16" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="52" y="66.5" fill="#32211c" font-size="13" font-weight="700" text-anchor="middle"><tspan x="52" y="62.42">Encode</tspan><tspan x="52" y="79.42">once</tspan></text><rect x="125" y="12" width="271" height="109" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="135" y="38" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="start"><tspan x="135" y="33.76">Encode source once; keep</tspan><tspan x="135" y="51.76">memory M<
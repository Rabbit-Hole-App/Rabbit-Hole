<svg xmlns="http://www.w3.org/2000/svg" width="320" height="428" viewBox="0 0 320 428" role="img" aria-label="An event vocabulary for a music Transformer
Set loudness: Example event: Velocity 72; Toy token ID: 0
Start a note: Example event: Start pitch 60; Toy token ID: 1

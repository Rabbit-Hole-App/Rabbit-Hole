<svg xmlns="http://www.w3.org/2000/svg" width="320" height="773" viewBox="0 0 320 773" role="img" aria-label="Encode once, then append each choice before the next call
Encode once: Encode source once; keep memory M — Source keys/values fixed before prediction; h is separately supplied.
Start: Call on $\text{&lt;bos&gt;}$; empty user text — Supplied birds begins at the second declared prefix.
Prediction 1: Emit birds; append — Next call uses $\text{&lt;bos&gt;}$ birds
Prediction 2: Emit fly; append — Next call uses $\text{&lt;bos&gt;}$ birds fly
Stop: Emit $\text{&lt;eos&gt;}$; append marker and STOP — No further call; visible text is birds fly
Same fixed memory/head; EOS stops after3, limit stops after2. Supplied prompt is not generated; h remains given." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="timeline"><title>Encode once, then append each choice before the next call</title><rect x="0.5" y="0.5" width="319" height="772" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="160" y="44.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="160" y="28.28">Encode once, then append</tspan><tspan x="160" y="50.28">each choice before the next</tspan><tspan x="160" y="72.28">call</tspan></text><g transform="translate(0 83)"><polyline points="109,84 109,532.5" fill="none" stroke="var(--color-ink, #32211c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></polyline><circle cx="109" cy="84" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><circle cx="109" cy="224.5" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><circle cx="109" cy="330" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><circle cx="109" cy="418" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><circle cx="109" cy="532.5" r="4" fill="#67B9A0" stroke="#32211c" stroke-width="1.3"></circle><rect x="12" y="60" width="80" height="48" rx="16" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="52" y="84" fill="#32211c" font-size="13" font-weight="700" text-anchor="middle"><tspan x="52" y="79.92">Encode</tspan><tspan x="52" y="96.92">once</tspan></text><rect x="125" y="12" width="183" height="144" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="135" y="47" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="start"><tspan x="135" y="33.76">Encode source</tspan><tspan x="135" y="51.76">once; keep memo
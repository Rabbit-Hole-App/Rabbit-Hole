<svg xmlns="http://www.w3.org/2000/svg" width="720" height="309" viewBox="0 0 720 309" role="img" aria-label="An event vocabulary for a music Transformer
Set loudness: Example event: Velocity 72; Toy token ID: 0
Start a note: Example event: Start pitch 60; Toy token ID: 1
Advance time: Example event: Wait 250 ms; Toy token ID: 2
Release a note: Example event: Release pitch 60; Toy token ID: 4

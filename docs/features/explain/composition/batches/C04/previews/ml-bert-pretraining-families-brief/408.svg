<svg xmlns="http://www.w3.org/2000/svg" width="408" height="464" viewBox="0 0 408 464" role="img" aria-label="The ideas BERT built on
Transformer: How it reads: Reader and writer; What it learns: Translate text
ULMFiT: How it reads: Reads from the start; What it learns: Guess later words
ELMo: How it reads: Reads both ways; What it learns: Guess in each direction
GPT: How it reads: Writes from earlier words; What it learns: Guess later words
BERT: How it reads: Reads both ways; What it learns: Recover hidden words
Each model learns from text, with different ways of reading it." font-family="Arial, Liberation Sans, sans-serif" style="display:block;max-width:none;margin-inline:auto" data-tutor-diagram="matrix"><title>The ideas BERT built on</title><rect x="0.5" y="0.5" width="407" height="463" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="22.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">The ideas BERT built on</tspan></text><g transform="translate(0 39)"><rect x="142.33333333333331" y="12" width="123.33333333333333" height="50" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="203.99999999999997" y="37" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="203.99999999999997" y="41.76">How it reads</tspan></text><rect x="272.66666666666663" y="12" width="123.33333333333333" height="50" rx="7" fill="#8DBFEF" stroke="#32211c" stroke-width="1.5"></rect><text x="334.3333333333333" y="37" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="334.3333333333333" y="32.76">What it</tspan><tspan x="334.3333333333333" y="50.76">learns</tspan></text><rect x="12" y="69" width="123.33333333333333" height="50" rx="7" fill="#67B9A0" stroke="#32211c" stroke-width="1.5"></rect><text x="73.66666666666666" y="94" fill="#32211c" font-size="14" font-weight="700" text-anchor="middle"><tspan x="73.66666666666666" y="98.76">Transformer</tspan></text><rect x="142.33333333333331" y="69" width="123.33333333333333" height="50" rx="7" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-ink, #32211c)" stroke-width="1.5"></rect><text x="203.99999999999997" y="94" fill="var(--color-ink, #32211c)" font-size="14" font-weight="400" text-anchor="middle"><tspan x="203.99999999999997" y="89.76">Reader and</tspan><tspan x="203.99999999999997" y="107.76">writer</tspan></text><rect x="272.66666666666663" y="69" width="
<svg xmlns="http://www.w3.org/2000/svg" width="467" height="605" viewBox="0 0 467 605" role="img" aria-label="Inside a writing layer
Earlier word context → First scale check → Source context → Second scale check → Separate word update → Final scale check
Earlier word context
Repeat Earlier word context through Final scale check 6 times
First scale check
Source context
Source notes → Source context
Second scale check
Separate word update
Final scale check
Residual bypass from Earlier word context through Earlier word context, then add
Residual bypass from Source context through Source context, then add
Residual bypass from Separate word update through Separate word update, then add

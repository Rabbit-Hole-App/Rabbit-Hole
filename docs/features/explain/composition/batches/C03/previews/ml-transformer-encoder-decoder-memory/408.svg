<svg xmlns="http://www.w3.org/2000/svg" width="408" height="823" viewBox="0 0 408 823" role="img" aria-label="Encoder memory feeds the decoder stack
Source sentence — Supplies ordered words → Encoder stack
Encoder stack — Builds source context → Encoded memory
Encoded memory — Supplies source context → Decoder stack
Words written so far — Supplies earlier words → Decoder stack
Decoder stack — Predicts a continuation → Next word
The source is read once. The writing side can consult it at each step." font-family="Inter, Liberation Sans, Arial, sans-serif" style="display:block;max-width:none;margin-inline:auto;--color-ink:#202723;--color-ink-2:#5d675f;--color-line:#e3e7e0;--viz-surface:#fffefa" data-tutor-diagram="relationship"><title>Encoder memory feeds the decoder stack</title><rect x="0.5" y="0.5" width="407" height="822" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="204" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="204" y="28.28">Encoder memory feeds the decoder</tspan><tspan x="204" y="50.28">stack</tspan></text><g transform="translate(0 61)"><g data-tutor-edge="source:encoder" data-tutor-edge-index="0"><g><polyline points="234,29 248,29 248,105.33333333333333 234,105.33333333333333" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="234,105.33333333333333 241,101.93333333333332 241,108.73333333333333" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="248" cy="70" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="248" y="70" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="248" y="74.08">1</tspan></text></g><g data-tutor-edge="encoder:memory" data-tutor-edge-index="1"><g><polyline points="234,116.66666666666667 272,116.66666666666667 272,187.33333333333334 234,187.33333333333334" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="234,187.33333333333334 241,183.93333333333334 241,190.73333333333335" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="272" cy="152" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="272" y="152" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="272" y="156.08">2</tspan></text></g><g data-tutor-edge="memory:decoder" data-tutor-edge-index="2"><g><polyline points="234,198.66666666666666 296,198.66666666666666 296,366.5 234,366.5" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="234,366.5 241,363.1 241,369.9" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="296" cy="234" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="296" y="234" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="296" y="238.08">3</tspan></text></g><g data-tutor-edge="prefix:decoder" data-tutor-edge-index="3"><g><polyline points="234,284 320,284 320,375 234,375" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="234,375 241,371.6 241,378.4" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="320" cy="334" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="320" y="334" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="320" y="338.08">4</tspan></text></g><g data-tutor-edge="decoder:next" data-tutor-edge-index="4"><g><polyline points="234,383.5 344,383.5 344,457 234,457" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="234,457 241,453.6 241,460.4" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="344" cy="416" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="344" y="416" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="344" y="420.08">5</tspan></text></g><g data-tutor-node="source"><rect x="46" y="12" width="186" height="34" rx="9" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="139" y="29" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="139" y="33.76">Source sentence</tspan></text></g><g data-tutor-node="encoder"><rect x="46" y="94" width="186" height="34" rx="9" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="139" y="111" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="139" y="115.76">Encoder stack</tspan></text></g><g data-tutor-node="memory"><rect x="46" y="176" width="186" height="34" rx="9" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="139" y="193" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="139" y="197.76">Encoded memory</tspan></text></g><g data-tutor-node="prefix"><rect x="46" y="258" width="186" height="52" rx="9" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="139" y="284" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="139" y="279.76">Words written so</tspan><tspan x="139" y="297.76">far</tspan></text></g><g data-tutor-node="decoder"><rect x="46" y="358" width="186" height="34" rx="9" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="139" y="375" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="139" y="379.76">Decoder stack</tspan></text></g><g data-tutor-node="next"><rect x="46" y="440" width="186" height="34" rx="9" fill="#fffefa" stroke="#e3e7e0" stroke-width="1"></rect><text x="139" y="457" fill="var(--color-ink, #32211c)" font-size="14" font-weight="700" text-anchor="middle"><tspan x="139" y="461.76">Next word</tspan></text></g><text x="12" y="509" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="504.92">1. Source sentence → Encoder stack: Supplies</tspan><tspan x="12" y="521.92">ordered words</tspan></text><text x="12" y="551" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="546.92">2. Encoder stack → Encoded memory: Builds</tspan><tspan x="12" y="563.92">source context</tspan></text><text x="12" y="593" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="588.92">3. Encoded memory → Decoder stack: Supplies</tspan><tspan x="12" y="605.92">source context</tspan></text><text x="12" y="635" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="630.92">4. Words written so far → Decoder stack:</tspan><tspan x="12" y="647.92">Supplies earlier words</tspan></text><text x="12" y="677" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="672.92">5. Decoder stack → Next word: Predicts a</tspan><tspan x="12" y="689.92">continuation</tspan></text></g><text x="204" y="797" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="204" y="792.92">The source is read once. The writing side can</tspan><tspan x="204" y="809.92">consult it at each step.</tspan></text></svg>

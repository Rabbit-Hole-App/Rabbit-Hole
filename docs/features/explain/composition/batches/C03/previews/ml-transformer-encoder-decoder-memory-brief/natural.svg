<svg xmlns="http://www.w3.org/2000/svg" width="340" height="823" viewBox="0 0 340 823" role="img" aria-label="How the two halves work together
Source sentence — Supplies ordered words → Reading layers
Reading layers — Builds source context → Source notes
Source notes — Supplies source context → Writing layers
Words written so far — Supplies earlier words → Writing layers
Writing layers — Predicts a continuation → Next word
The source is read once. The writing side can consult it at each step." font-family="Inter, Liberation Sans, Arial, sans-serif" style="display:block;max-width:none;margin-inline:auto;--color-ink:#202723;--color-ink-2:#5d675f;--color-line:#e3e7e0;--viz-surface:#fffefa" data-tutor-diagram="relationship"><title>How the two halves work together</title><rect x="0.5" y="0.5" width="339" height="822" rx="12" fill="var(--viz-surface, #fbfbfa)" stroke="var(--color-line, #dedad4)"></rect><text x="170" y="33.5" fill="var(--color-ink, #32211c)" font-size="17" font-weight="700" text-anchor="middle"><tspan x="170" y="28.28">How the two halves work</tspan><tspan x="170" y="50.28">together</tspan></text><g transform="translate(0 61)"><g data-tutor-edge="source:encoder" data-tutor-edge-index="0"><g><polyline points="200,29 214,29 214,105.33333333333333 200,105.33333333333333" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="200,105.33333333333333 207,101.93333333333332 207,108.73333333333333" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="214" cy="70" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="214" y="70" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="214" y="74.08">1</tspan></text></g><g data-tutor-edge="encoder:memory" data-tutor-edge-index="1"><g><polyline points="200,116.66666666666667 238,116.66666666666667 238,187.33333333333334 200,187.33333333333334" fill="none" stroke="#b9c3b9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><polygon points="200,187.33333333333334 207,183.93333333333334 207,190.73333333333335" fill="#b9c3b9" data-tutor-arrowhead=""></polygon></g><circle cx="238" cy="152" r="9" fill="#fffefa" stroke="#e3e7e0"></circle><text x="238" y="152" fill="var(--color-ink, #32211c)" font-size="12" font-weight="700" text-anchor="middle"><tspan x="238" y="156.08">2</tspan></text></g><g data
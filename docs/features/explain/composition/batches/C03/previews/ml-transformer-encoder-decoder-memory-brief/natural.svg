xt><text x="12" y="593" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="588.92">3. Source notes → Writing layers:</tspan><tspan x="12" y="605.92">Supplies source context</tspan></text><text x="12" y="635" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="630.92">4. Words written so far → Writing</tspan><tspan x="12" y="647.92">layers: Supplies earlier words</tspan></text><text x="12" y="677" fill="var(--color-ink, #32211c)" font-size="13" font-weight="400" text-anchor="start"><tspan x="12" y="672.92">5. Writing layers → Next word: Predicts</tspan><tspan x="12" y="689.92">a continuation</tspan></text></g><text x="170" y="797" fill="var(--color-ink-2, #665951)" font-size="13" font-weight="400" text-anchor="middle"><tspan x="170" y="792.92">The source is read once. The writing</tspan><tspan x="170" y="809.92">side can consult it at each step.</tspan></text></svg>

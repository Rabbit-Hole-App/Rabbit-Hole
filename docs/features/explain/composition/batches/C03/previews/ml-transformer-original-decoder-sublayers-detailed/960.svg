<svg xmlns="http://www.w3.org/2000/svg" width="960" height="635" viewBox="0 0 960 635" role="img" aria-label="Original Transformer decoder layer
Masked self-attention → Self-attention LayerNorm → Encoder–decoder attention → Cross-attention LayerNorm → Position-wise feed-forward → Feed-forward LayerNorm
Masked self-attention
Repeat Masked self-attention through Feed-forward LayerNorm 6 times
Self-attention LayerNorm
Encoder–decoder attention
Encoder keys and values → Encoder–decoder attention
Cross-attention LayerNorm
Position-wise feed-forward
Feed-forward LayerNorm
Residual bypass from Masked self-attention through Masked self-attention, then add
Residual bypass from Encoder–decoder attention through Encoder–decoder attention, then add
Residual bypass from Position-wise feed-forward through Position-wise feed-forward, then add

[project]
name = "moment"
version = "0.1.0"
description = "Ask a question, get the one YouTube video and the exact start/end that answers it."
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.1",
    "youtube-transcript-api>=1.0",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "numpy",
    "anthropic>=0.40",
    "pydantic>=2",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]   # fallback when a video has no captions

[project.scripts]
moment = "moment.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

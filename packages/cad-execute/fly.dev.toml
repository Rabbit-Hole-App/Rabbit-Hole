app = "rabbit-hole-cad-dev"
primary_region = "iad"
kill_timeout = "25s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CAD_ADMISSION_ENABLED = "false"
  CAD_ALLOWED_ORIGINS = "https://rabbit-hole-web-dev-cad-integration.tryrabbithole.workers.dev"
  CAD_DEV_DEADLINE = "2026-10-17T22:15:00Z"
  CAD_DEV_BUDGET_FILE = "/var/cad/budget/usage.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[restart]]
  policy = "never"

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

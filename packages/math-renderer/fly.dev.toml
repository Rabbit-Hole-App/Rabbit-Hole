app = "small-math-renderer-dev"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

# Manim renders frame by frame; the extra memory is for cairo surfaces and the
# LaTeX run, not for parallelism - the worker still renders one job at a time.
[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

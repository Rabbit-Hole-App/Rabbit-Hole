# rabbit-hole-motion-orchestrator: the hostable Motion orchestrator (motion/orchestrator-main.mjs). PREPARED, not deployed:
# creating it needs the owner's priced infrastructure approval (C:/s/spec/day-1021/motion-deploy-plan.md). Home deploys from
# `context.sh --target orchestrator`; this file creates nothing by itself. Secrets (fly secrets, never here):
# MOTION_ORCHESTRATOR_TOKEN, MOTION_RENDERER_TOKEN (the production renderer's), ANTHROPIC_API_KEY, ANTHROPIC_WORKSPACE_ID.
app = "rabbit-hole-motion-orchestrator"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.orchestrator"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  MOTION_RENDERER_URL = "https://rabbit-hole-motion-renderer.fly.dev"
  MOTION_MAX_CALLS = "9"
  MOTION_JOB_TIMEOUT_S = "3300"
  # ACCEPTANCE WINDOW (owner 2026-10-25, R1; ceiling raised 2.00 to 3.50 after the first acceptance job refused on 2.00): one job may spend at most US$3.50 of model money. The Worker still holds
  # US$8.96 against the learner's allowance and releases the unused part. REMOVE this line in the activation release (R2): public jobs need the full hold.
  # The orchestrator preflight (orchestrator.mjs) refuses every job before any paid work when this is below US$2.56, the least the mandatory calls can cost;
  # the measured need (3.05 to 3.13 with one repair) is in docs/features/rabbit-hole-motion-v1-harness-spec.md "Failure codes, the preflight and what a limit charges".
  MOTION_JOB_CEILING_USD = "3.50"
  # ACTIVATION (off): the renderer configuration the measured readiness policy applies to. Uncomment this line, with the Worker's
  # MOTION_RENDERER_CONFIG of the same value, only after the matching renderer and its job store are deployed and accepted. While it is absent
  # the orchestrator takes jobs exactly as it does today. A job whose approved proposal names another configuration is refused before any model call.
  # MOTION_RENDERER_CONFIG = "03f2a1efc08e-1.5cpu-3gib-420s"

# No [mounts]: the durable job record is the worker's (LearnVideos Durable Object + the D1 reservation). A restart loses the
# running job; the worker keeps its hold as unknown cost and this process refuses that job's grant.
[http_service]
  internal_port = 8080
  force_https = true
  # The worker polls a running job every 10 s, which keeps the machine up; idle between jobs it stops.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

# One machine (deploy with --ha=false): the orchestrator runs one job at a time, platform-wide.
[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

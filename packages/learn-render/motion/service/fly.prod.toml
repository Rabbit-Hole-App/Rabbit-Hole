# rabbit-hole-motion-renderer (spec §32): the PRODUCTION Motion render service. PREPARED, not deployed: creating it needs
# the owner's priced infrastructure approval (C:/s/spec/day-1021/motion-deploy-plan.md). The same image and limits as the
# proven dev service (fly.dev.toml, service.linux.test.mjs 15/15 at 9083840e), a fresh MOTION_RENDERER_TOKEN, and one
# machine: the fixed pool is the platform-funded compute ceiling (owner decision C). Home deploys from
# `context.sh --target renderer`; this file creates nothing by itself.
app = "rabbit-hole-motion-renderer"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  MOTION_SANDBOX = "linux"

[http_service]
  internal_port = 8080
  force_https = true
  # Idle machines stop; a request starts one. Callers poll GET /render/<id> while a render runs
  # and fetch the artifacts promptly: finished renders live in memory for 30 minutes at most.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # Status polls and artifact downloads are cheap; the service itself admits one render at a
  # time (a second POST /render gets 429).
  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

# One machine (deploy with --ha=false). Dedicated CPUs: a 1080p render is minutes of sustained
# Chromium + encoder work, which shared CPUs throttle toward the 420 s limit.
[[vm]]
  memory = "4gb"
  cpu_kind = "performance"
  cpus = 2

# rabbit-hole-motion-renderer-dev (spec §10.2): Motion V1 DEVELOPMENT render service only.
# Home creates the app in the rabbit-hole Fly org, sets MOTION_RENDERER_TOKEN and deploys from
# the context motion/service/context.sh builds. This file creates nothing by itself.
app = "rabbit-hole-motion-renderer-dev"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  MOTION_SANDBOX = "linux"
# DEV ONLY (never in fly.prod.toml): job records survive restart, auto-stop and redeploy on the volume below, and the
# service refuses every new job (503 job_store_not_mounted) unless that directory really is a separate, writable mount.
  MOTION_JOB_STORE_DIR = "/data/motion-jobs"
  MOTION_JOB_STORE_REQUIRE_MOUNT = "1"

# One Fly volume, machine-local: it attaches to exactly one machine (this app runs one). Create it BEFORE the deploy
# (RUNBOOK: `fly volumes create motion_jobs ...`). Billed per provisioned GB-month even while the machine is stopped.
[mounts]
  source = "motion_jobs"
  destination = "/data/motion-jobs"
  initial_size = "1gb"
  snapshot_retention = 1

[http_service]
  internal_port = 8080
  force_https = true
  # Idle machines stop; a request starts one. Callers poll GET /render/<id> while a render runs
  # and fetch the artifacts promptly: finished renders live in memory for 30 minutes at most.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  # Status polls and artifact downloads are cheap; the service itself admits one render at a
  # time (a second POST /render gets 429).
  [http_service.concurrency]
    type = "requests"
    soft_limit = 10
    hard_limit = 20

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

# One machine (deploy with --ha=false). Dedicated CPUs: a 1080p render is minutes of sustained
# Chromium + encoder work, which shared CPUs throttle toward the 420 s limit.
[[vm]]
  memory = "4gb"
  cpu_kind = "performance"
  cpus = 2

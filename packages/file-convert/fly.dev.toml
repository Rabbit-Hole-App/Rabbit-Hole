# rabbit-hole-convert-dev: the DEVELOPMENT file conversion service (owner-approved 2026-10-16,
# Fly org rabbit-hole). Never production. Secrets: CONVERT_TOKEN, CONVERT_ALLOWED_ORIGINS.
# Deploy from the context packages/file-convert/context.sh builds.
app = "rabbit-hole-convert-dev"
primary_region = "iad"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CONVERT_SANDBOX = "linux"
  CONVERT_SLOTS = "2"
  CONVERT_IDLE_STOP_SECONDS = "300"

[http_service]
  internal_port = 8080
  force_https = true
  # The proxy never stops the machine for lack of traffic: a conversion keeps running after the
  # dispatching request returns. The service exits by itself (exit 0 -> machine stopped) after
  # CONVERT_IDLE_STOP_SECONDS with no active attempt; the next dispatch starts it again.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[restart]]
  policy = "on-failure"
  retries = 3

# One machine (deploy with --ha=false). Size from measurement: docs/features/canvas-file-converter.md section 3.
[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

# Production rehearsal controller (owner decision (a), 2026-11-16 14:05). Secrets on the app: ANTHROPIC_API_KEY, MODAL_TOKEN_ID, MODAL_TOKEN_SECRET,
# REHEARSAL_WORKER_TOKEN (the bearer the app worker sends; set on both sides, never printed). The worker writes the records to R2, so no R2 credentials here.
# Jobs and sessions live in memory: auto-stop only stops an idle machine (the worker polls every 5 s while a job or a session runs).
app = "rabbit-hole-rehearsal-prod"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8891
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

  <script xlink:href="https://evil.example/ext.js"/>
  <style>@import url(https://evil.example/import.css); rect { fill: url(https://evil.example/fill.svg#p); } circle { fill: url(#ok) }</style>
  <rect width="100" height="100" fill="#ddd" onclick="alert(1)" onmouseover="alert(2)"/>
  <image href="https://evil.example/pixel.png" width="10" height="10"/>
  <image xlink:href="data:image/png;base64,iVBORw0KGgo=" width="10" height="10"/>
  <use href="https://evil.example/sprite.svg#icon"/>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rabbit Hole — hero</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Grid and type metrics are measured off typesafe.ai at viewport 1536 (body 1521):
     1240px content frame centred, crop marks at x140/x1370, headline 150px/120px. */
  :root{
    --ink:#1E1E1E;
    --ink86:rgba(30,30,30,.86);
    --paper:#FEFEFE;
    --grot:Arial,"Helvetica Neue",Helvetica,sans-serif;
    /* working choice — the six candidates are in headline-font-candidates.html */
    --display:"Space Grotesk",Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{overflow-y:scroll}
  /* no overflow-x here: it would make <body> a scroll container and kill the
     sticky shaft below */
  body{background:var(--paper);font-family:var(--grot);color:var(--ink);
       width:100%;height:1740px;position:relative}

  /* ---- hero shaft: you are falling down it. The title is drawn into the canvas, so
     there is no overlay element and nothing that can lag behind the scroll. ---- */
  /* as tall as the page, so the canvas stays stuck for the whole descent */
  #shaft-track{position:absolute;left:0;top:0;width:100%;height:1740px}
  /* full viewport height so the mouth sits dead centre of the page */
  #shaft{position:sticky;top:0;width:100%;height:100vh;display:block;
         image-rendering:pixelated}
  @media (prefers-reduced-motion:reduce){ #shaft{position:absolute} }



</style>
</head>
<body>

<!-- Buffer is deliberately small: it is upscaled with image-rendering: pixelated, which
     is what makes the dither grain, and cost is quadratic in these numbers. -->
<div id="shaft-track"><canvas id="shaft" width="520" height="260"></canvas></div>



<script>
/* The fall — the page opens looking straight down the shaft.
   Polar tunnel: depth z = SCALE / radius, so the centre is infinitely far away and
   goes black on its own. Per-pixel depth, angle and light never change, so they are
   computed once; each frame only samples the wall at (angle, z + t). Low-res buffer
   with a pixelated upscale gives the 1-bit dither grain. */
(function () {
  const cv = document.getElementById('shaft');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const img = ctx.createImageData(W, H);

  const WHITE = [254, 254, 254];         // the page
  // The inner band is dark, not mid-grey. Difference blending cannot make the title
  // white over a mid tone — |255 - 168| is still dark — so the letters only go white
  // where the wall behind them is genuinely dark.
  const GREY  = [196, 196, 196];         // the ripples: outer band, keeps the title ink
  const SLATE = [ 72,  72,  72];         // inner band, flips the title to white
  const INK   = [0, 0, 0];               // the bottom of the hole: pitch black, not charcoal

  const BAYER = [0,8,2,10, 12,4,14,6, 3,11,1,9, 15,7,13,5].map(v => (v + 0.5) / 16);
  const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;

  const CX = Math.round(W / 2), CY = Math.round(H * 0.50);   // vanishing point, dead centre
  const SCALE = 300;                     // shaft radius in buffer px at z = 1
  const ZFAR = 8;                        // past this the wall is pure ink
  // per-pixel geometry never changes with time — pay for it once, and again only when
  // the window aspect changes (otherwise the rings would go oval on resize)
  const zTab = new Float32Array(W * H);  // depth, drives the texture
  const uTab = new Float32Array(W * H);  // angle around the shaft
  const sTab = new Float32Array(W * H);  // how much light gets here
  const dTab = new Float32Array(W * H);  // texture weight — 0 across the core edge
  let SQUASH = 1, LIGHT = W / 2;

  // Lookups instead of transcendentals. The inner loop runs W*H times a frame, so a
  // Math.sin for the rings plus a sin-based hash for the grain is ~600k sin calls per
  // frame — enough to saturate the main thread and make the whole page feel sticky.
  // These must be declared before rebuild() runs; it fills gTab.
  const hash = (a, b) => { const s = Math.sin(a * 91.7 + b * 47.3) * 43758.5453; return s - Math.floor(s); };
  const RINGS = 8;                       // ring frequency along depth
  const SIN_N = 2048, SIN_MASK = SIN_N - 1;
  const SIN = new Float32Array(SIN_N);   // pre-biased into 0..1
  for (let i = 0; i < SIN_N; i++) SIN[i] = 0.5 + 0.5 * Math.sin(i / SIN_N * Math.PI * 2);
  const RING_K = RINGS * SIN_N / (Math.PI * 2);

  const GU = 40, GV = 512, GV_MASK = GV - 1;   // grain: 40 bands around, 512 down
  const GRAIN = new Float32Array(GU * GV);
  for (let u = 0; u < GU; u++)
    for (let v = 0; v < GV; v++) GRAIN[u * GV + v] = hash(u, v);
  const gTab = new Int32Array(W * H);    // per-pixel row offset into GRAIN

  function rebuild() {
    // The buffer is 2:1 but the canvas is stretched to the viewport, so correct dy by
    // the ratio of the two aspects — that is what keeps the rings circular on screen.
    SQUASH = (W / H) / (cv.clientWidth / cv.clientHeight);
    // The ripple disc fits the shorter axis with an 8% margin, so the page stays white
    // around it and only the ripples carry colour.
    LIGHT = 0.92 * Math.min(W / 2, (H / 2) * SQUASH);
    for (let y = 0, p = 0; y < H; y++) {
      for (let x = 0; x < W; x++, p++) {
        const dx = x - CX, dy = (y - CY) * SQUASH;
        const r = Math.max(Math.sqrt(dx * dx + dy * dy), 0.75);
        zTab[p] = Math.min(SCALE / r, ZFAR);
        uTab[p] = Math.atan2(dy, dx) / (Math.PI * 2) + 0.5; // 0..1 around the shaft
        let ui = (uTab[p] * GU) | 0; if (ui >= GU) ui = GU - 1;
        gTab[p] = ui * GV;
        // exponent sets how wide the black core starts: lower = tighter core
        sTab[p] = clamp(Math.pow(r / LIGHT, 1.1));          // 0 at the vanishing point
        // Texture is faded out across the core boundary. Letting the rings modulate
        // brightness there makes the edge of the black breathe in and out with t.
        dTab[p] = clamp((r - 0.255 * LIGHT) / (0.425 * LIGHT));
      }
    }
  }
  rebuild();
  addEventListener('resize', rebuild);

  function put(i, c) { img.data[i] = c[0]; img.data[i+1] = c[1]; img.data[i+2] = c[2]; img.data[i+3] = 255; }

  // One 32-bit store per pixel instead of four byte stores plus a call. At 288k pixels
  // a frame the call overhead alone was costing milliseconds.
  const buf32 = new Uint32Array(img.data.buffer);
  const pack = c => (255 << 24) | (c[2] << 16) | (c[1] << 8) | c[0];   // little-endian RGBA
  const C_INK = pack(INK), C_SLATE = pack(SLATE), C_GREY = pack(GREY), C_WHITE = pack(WHITE);

  // `open` shrinks from 1 to 0 as you enter: less light reaches the wall, so the black
  // core swallows the frame outward until the screen is solid black.
  // The title is drawn into the buffer, not laid over it in the DOM. That is what puts
  // the ripple pixels inside the letters: `difference` against the dithered wall means
  // the glyphs are made of wall pixels, and over the pure-black core it resolves to a
  // true white rather than the muddy mid-grey a CSS blend gave. It also cannot jiggle,
  // because the text lives at a fixed point in a canvas the browser pins.
  const LINES = ['Knowledge is', 'infinite.'];
  function drawTitle(scale, alpha) {
    if (!(alpha > 0.004)) return;
    const px = 190 * (W / cv.clientWidth) * scale;         // 190 CSS px at the mouth
    ctx.save();
    ctx.globalCompositeOperation = 'difference';
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '500 ' + px.toFixed(1) + 'px "Space Grotesk", Arial, sans-serif';
    const lead = px * 0.8;
    for (let i = 0; i < LINES.length; i++)
      ctx.fillText(LINES[i], CX, CY + (i - (LINES.length - 1) / 2) * lead);
    ctx.restore();
  }

  function frame(t, open, titleScale, titleAlpha) {
    const K = open * 1.2;                                  // hoisted out of the inner loop
    for (let y = 0, p = 0; y < H; y++) {
      const brow = (y & 3) * 4;
      for (let x = 0; x < W; x++, p++) {
        const v = zTab[p] + t;
        const ring  = SIN[(v * RING_K) & SIN_MASK];        // courses of earth rushing past
        const grain = GRAIN[gTab[p] + (((v * 7) | 0) & GV_MASK)];
        const tex = 0.6 * ring + 0.4 * grain;
        const lum = sTab[p] * K * (0.62 + 0.38 * (0.5 + (tex - 0.5) * dTab[p]));
        // no clamp: the thresholds below already bucket anything outside 0..1
        const lit = lum + (BAYER[brow + (x & 3)] - 0.5) * 0.16;
        buf32[p] = lit < 0.30 ? C_INK : lit < 0.50 ? C_SLATE : lit < 0.74 ? C_GREY : C_WHITE;
      }
    }
    ctx.putImageData(img, 0, 0);
    drawTitle(titleScale, titleAlpha);
  }

  // Depth = a slow clock plus an eased scroll position. Scrolling IS falling, and the
  // hole lets go before the headline arrives so the type never lands on black.
  const ENTER = 700;                     // px of scroll from mouth to solid black
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t0 = performance.now();
  let sm = window.scrollY;
  (function tick() {
    sm += (window.scrollY - sm) * 0.28;                     // eased, but tight to the scroll
    // Size tracks the scrollbar directly — the mouth should open exactly as far as you
    // have scrolled, with no lag. Only the wall's motion is eased.
    const enter = clamp(window.scrollY / ENTER);
    const open = still ? 1 : Math.pow(1 - enter, 1.6);      // hole widens as you go in
    // The camera closes on the title: it grows, then slips past us.
    const near = still ? 1 : 1 / (1 - enter * 0.94);
    const alpha = still ? 1 : 1 - clamp((enter - 0.22) / 0.28);
    frame(still ? 0.8 : (performance.now() - t0) * 0.00016 + sm * 0.0022, open, near, alpha);
    // The title is a fixed object in the shaft: the browser pins it and a scroll-driven
    // CSS animation grows it. Nothing here touches it — driving position or scale from
    // rAF lands a frame behind the scroll, which is exactly what makes type jiggle.
    if (!still) requestAnimationFrame(tick);                // every frame, no chug
  })();

  // --- self-check: load with ?selftest=1 ---
  if (location.search.includes('selftest')) {
    const out = [], at = (x, y) => zTab[Math.round(y) * W + Math.round(x)];
    const ok = (name, cond) => out.push((cond ? 'PASS ' : 'FAIL ') + name);
    // Brightness must be luminance, not the red channel: pink and magenta share red
    // 255, so a red-only diff sees no motion, and a blue mid-tone reads as core.
    const lumOf = (d, i) => 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    const lumAt = (x, y) => {
      const d = ctx.getImageData(x, y, 1, 1).data;
      return lumOf(d, 0);
    };
    ok('z falls off with radius', at(CX + 10, CY) > at(CX + 100, CY) && at(CX + 100, CY) > at(CX + 300, CY));
    ok('z clamps at ZFAR', Math.abs(at(CX, CY) - ZFAR) < 1e-6);
    ok('angle stays in 0..1', uTab.every(v => v >= 0 && v <= 1));
    frame(0, 1, 1, 0);
    ok('core darker than rim', lumAt(CX, CY) < lumAt(2, 2));

    // the mouth must be a circle on screen, not an oval: walk out from the centre
    // along each axis to where the core ends, and convert both to screen pixels
    const px = ctx.getImageData(0, 0, W, H).data;
    const darkAt = (x, y) => lumOf(px, (y * W + x) * 4) < 90;
    // Walk out to the first RUN of light pixels. Stopping at the first single light
    // pixel ends the walk early (the dither punches holes through the core); counting
    // every dark pixel on the ray overcounts the dark rings beyond the core.
    const RUN = 6;
    function edge(stepX, stepY, limit) {
      let light = 0;
      for (let i = 0; i < limit; i++) {
        if (darkAt(CX + stepX * i, CY + stepY * i)) light = 0;
        else if (++light >= RUN) return i - RUN + 1;
      }
      return limit;
    }
    const rx = edge(1, 0, W - CX - 1), ry = edge(0, 1, H - CY - 1);
    const sx = cv.clientWidth / W, sy = cv.clientHeight / H;
    const ratio = (rx * sx) / (ry * sy);
    ok('mouth is circular, not oval (' + ratio.toFixed(3) + ')', Math.abs(ratio - 1) < 0.08);

    // only the wall moves — measure inside the mouth, not across the static page
    const bw = Math.min(Math.round(LIGHT), CX);            // LIGHT now reaches the corners
    const bh = Math.min(Math.round(LIGHT / SQUASH), CY);   // so clamp inside the canvas
    const box = [CX - bw, CY - bh, bw * 2, bh * 2];
    const before = ctx.getImageData(box[0], box[1], box[2], box[3]).data.slice();
    frame(0.5, 1, 1, 0);
    const after = ctx.getImageData(box[0], box[1], box[2], box[3]).data;
    let moved = 0;
    for (let i = 0; i < before.length; i += 4)
      if (Math.abs(lumOf(before, i) - lumOf(after, i)) > 1) moved++;
    ok('advancing t redraws the wall', moved > box[2] * box[3] * 0.05);

    // the core must hold still while the rings move through it
    let coreMoved = 0;
    const cr = Math.round(0.20 * LIGHT);
    for (let y = CY - Math.round(cr / SQUASH); y <= CY + Math.round(cr / SQUASH); y++)
      for (let x = CX - cr; x <= CX + cr; x++) {
        const i = ((y - box[1]) * box[2] + (x - box[0])) * 4;
        if (Math.abs(lumOf(before, i) - lumOf(after, i)) > 1) coreMoved++;
      }
    // a handful of dithered pixels at the damping boundary is not a beat
    const coreArea = (2 * cr + 1) * (2 * Math.round(cr / SQUASH) + 1);
    ok('core holds still, no beating (' + coreMoved + 'px)', coreMoved < coreArea * 0.002);

    // entering all the way takes the whole screen to black
    frame(0.5, 0, 1, 0);
    const shut = ctx.getImageData(0, 0, W, H).data;
    let lightPx = 0;
    for (let i = 0; i < shut.length; i += 4) if (lumOf(shut, i) > 90) lightPx++;
    ok('entering closes to solid black', lightPx === 0);
    const el = document.createElement('pre');
    el.id = 'selftest';
    el.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:99;background:#000;' +
                       'color:#6f6;padding:8px;font:11px/1.4 monospace';
    el.textContent = out.join('\n');
    document.body.appendChild(el);
  }
})();
</script>
</body>
</html>

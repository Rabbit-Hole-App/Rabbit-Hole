<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>headline font candidates</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Instrument+Serif&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Newsreader:wght@400;500&family=Outfit:wght@500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0D0A0C;color:#fff;font-family:system-ui,sans-serif;padding:24px 40px}
  .row{margin-bottom:18px}
  .tag{font:500 12px/1 ui-monospace,monospace;color:#FF1FD8;letter-spacing:.08em;
       text-transform:uppercase;margin-bottom:2px}
  .spec{font-size:86px;line-height:.86;white-space:nowrap}
  .a{font-family:"Space Grotesk";font-weight:500}
  .b{font-family:"Instrument Serif";font-weight:400}
  .c{font-family:"Bricolage Grotesque";font-weight:600}
  .d{font-family:"Newsreader";font-weight:400}
  .e{font-family:"Outfit";font-weight:500}
  .f{font-family:"DM Serif Display";font-weight:400}
</style>
</head>
<body>
  <div class="row"><div class="tag">1 · Space Grotesk</div>
    <div class="spec a">Knowledge is infinite.</div></div>
  <div class="row"><div class="tag">2 · Instrument Serif</div>
    <div class="spec b">Knowledge is infinite.</div></div>
  <div class="row"><div class="tag">3 · Bricolage Grotesque</div>
    <div class="spec c">Knowledge is infinite.</div></div>
  <div class="row"><div class="tag">4 · Newsreader</div>
    <div class="spec d">Knowledge is infinite.</div></div>
  <div class="row"><div class="tag">5 · Outfit</div>
    <div class="spec e">Knowledge is infinite.</div></div>
  <div class="row"><div class="tag">6 · DM Serif Display</div>
    <div class="spec f">Knowledge is infinite.</div></div>
</body>
</html>

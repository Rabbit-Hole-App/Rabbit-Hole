# Reproducible, unprivileged verification before any deployment (r34 audit, owner 2026-10-09): locked Node and Python
# dependencies, the unit suites and both page builds, on Linux, with no deployment or model credential in the job (token: contents: read, plus actions: read to confirm a reused run).
# It writes its evidence (sha, tree, lockfile digests, run id, verdicts) as a note under refs/notes/verify; the dev
# deploy refuses a commit whose tree carries no passing note (scripts/dev-deploy-gate.mjs). Gate reuse is unchanged. A passing push run of the exact commit is reused.
# ci-speed item 3 (owner brief v2, 2026-11-05): only the unit suites and page builds the changed paths need run (scripts/ci/verify-plan.mjs,
# the changed-path plan fast-e2e uses); lockfiles, package.json, workflows, scripts/ci and run.sh run everything. The note records which ran.
name: verify
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
  actions: read # verify-plan.mjs reads this branch's green verify runs; verify-reuse.mjs confirms the original verify run through the API
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      evidence: ${{ steps.evidence.outputs.evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the plan diffs against the newest green verify run of this branch, or the merge-base with main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Which suites and builds this push needs, before any install (node, git and gh only). A plan that cannot be made runs everything.
      - name: Plan the suites
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/verify-plan.mjs
      # Before any install or build: a passing verify run of exactly this commit, tree and lockfiles (its note, checked
      # by verify-evidence.mjs) whose run the API confirms as this repository's verify.yml, at this sha, a completed
      # success, and which ran at least the suites and builds planned above, is reused, and the job summary links it.
      # Anything missing, invalid, smaller or unconfirmed: the steps below run.
      - name: Reuse a passing verify run of this exact commit
        id: reuse
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUITES: ${{ steps.plan.outputs.suites }}
          BUILD: ${{ steps.plan.outputs.build }}
        run: node scripts/verify-reuse.mjs
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.reuse.outputs.reuse != 'true' && contains(format(' {0} ', steps.plan.outputs.suites), ' python ')
      - run: node scripts/lock-natives.mjs --check
        if: steps.reuse.outputs.reuse != 'true'
      - run: npm ci --no-audit --no-fund
        if: steps.reuse.outputs.reuse != 'true'
      - run: node scripts/ensure-natives.mjs
        if: steps.reuse.outputs.reuse != 'true'
      - run: uv sync --locked
        if: steps.reuse.outputs.reuse != 'true' && contains(format(' {0} ', steps.plan.outputs.suites), ' python ')
      # Keyless: every suite runs with no provider or deployment credential in the environment. A plan with no suite (docs
      # only) runs none and the note says so; the names come from verify-plan.mjs's fixed list, and run.sh refuses any other.
      - name: Unit suites
        id: unit
        if: steps.reuse.outputs.reuse != 'true'
        env:
          SUITES: ${{ steps.plan.outputs.suites }}
        run: |
          set +e
          if [ -z "$SUITES" ]; then echo "no unit suite selected"; echo "code=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          env -i PATH="$PATH" HOME="$HOME" CI=true bash run.sh test:unit $SUITES
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Page builds
        id: build
        if: steps.reuse.outputs.reuse != 'true'
        env:
          BUILD: ${{ steps.plan.outputs.build }}
        run: |
          set +e
          case "$BUILD" in
            both) (cd packages/web && VITE_RABBIT_HOLE=true VITE_TLDRAW_LICENSE_KEY=verify-only npm run build && npm run build -- --outDir dist-dev) ;;
            dist-dev) (cd packages/web && VITE_RABBIT_HOLE=true VITE_TLDRAW_LICENSE_KEY=verify-only npm run build -- --outDir dist-dev) ;;
            *) echo "no page build needed"; echo "code=skipped" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          echo "code=$?" >> "$GITHUB_OUTPUT"
      # A reuse writes no evidence, so the record job below adds no note: the original run's note stays the record.
      - name: Evidence
        id: evidence
        if: steps.reuse.outputs.reuse != 'true'
        env:
          SUITES: ${{ steps.plan.outputs.suites }}
          BUILD: ${{ steps.plan.outputs.build }}
        run: |
          node scripts/verify-evidence.mjs write --unit "${{ steps.unit.outputs.code }}" --build "${{ steps.build.outputs.code }}" --suites "$SUITES" --pages "$BUILD" --out "$RUNNER_TEMP/verify.json"
          echo "evidence=$(cat "$RUNNER_TEMP/verify.json" | tr -d '\n')" >> "$GITHUB_OUTPUT"
          test "${{ steps.unit.outputs.code }}" = 0 && case "${{ steps.build.outputs.code }}" in 0|skipped) true ;; *) false ;; esac
  # The note is written by a separate job with only the write it needs; the verify job above holds no write at all.
  record:
    needs: verify
    if: always() && needs.verify.outputs.evidence != '' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to push refs/notes/verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          git fetch -q origin '+refs/notes/verify:refs/notes/verify' 2>/dev/null || true
          git -c user.name=rabbit-hole-ci -c user.email=rabbit-hole-ci@users.noreply.github.com notes --ref=verify add -f -m '${{ needs.verify.outputs.evidence }}' "$GITHUB_SHA"
          git push -q origin refs/notes/verify

[project]
name = "small-deploy"
version = "0.1.0"
description = "Cloud for small python softwares"
readme = "README.md"
authors = [
    { name = "yudhisteer", email = "yudhisteer.chin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "flask>=3.1.3",
    "gradio",
    "ultralytics",
]

[dependency-groups]
dev = [
    "boto3>=1.43.88",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# importlib: allows duplicate test basenames (test_app.py per example) and hyphenated dirs
addopts = "--import-mode=importlib"
